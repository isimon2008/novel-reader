中间，比前后的书页都薄。他拿镊子挑起来，对着灯看了一眼，上面只有一行字。","“顾阙，本县人，卒于本月十七亥时，年二十六。”","他今年二十六。","今天是十一月十七号。","他放下镊子，先做了一件事：伸出小指，在“卒”字的最后一竖上轻轻蹭了一下。","指腹黑了。","墨是湿的。","他把手指凑到鼻子底下闻了闻。古墨是松烟和胶做的，放久了，闻着有一股淡淡的胶香，像旧木头。这个不是。这是一股刺鼻的味道，酸，冲，就是文具店里最便宜的那种瓶装墨汁，里面兑了防腐剂。","小学生练毛笔字用的那种。","“小葛。”顾阙头也没抬，“今天谁进过修复室？”","对面工位的小葛把耳机摘下来一只：“没人啊，门禁刷卡的，就咱俩。怎么了顾老师？”","“这本书谁送来的？”","“早上收发室拿上来的，说是捐赠件，没留名字。”","顾阙没再问。","小葛是今年夏天刚来的研究生，学文献的，干活细，就是胆子小，修复室里那具做示范用的骷髅标本，她来了三个月还不敢正眼看。要是告诉她这本书里夹着一张写他死期的纸，她今晚大概睡不着觉。","这种恶作剧顾阙见过。去年有人往送修的族谱里夹过一张讨债的条子，闹到了派出所。但这张纸不一样。","纸是竹纸，帘纹粗，少说三百年。这种纸现在造不出来，至少造不出这个老化的程度。","墨却是今天的。","一张三百年的老纸，写着今天的墨，写的是他的名字。","他掏出手机，想先拍下来留个底。","对焦，按快门，咔嚓一声。","他点开照片。照片里，那页纸是空的。帘纹拍得清清楚楚，纸边的虫眼也在，就是那一行字不见了，干干净净，像从来没写过。","他又拍了一张。还是空的。","他抬头看纸。那行字好好地待在那儿，墨迹还在反光。","顾阙把手机扣在桌上，扣得有点重。小葛又抬头看了他一眼，他冲她摆了摆手，示意没事。","然后他把整本书从头到尾又翻了一遍。","这是一部地方志，残了，前后都缺，没有题署。版心本该刻县名的地方，每一页都被人用刀刮过，刮得很细，一叶也没落下。页码倒是连着的，一页不少。","顾阙干这行七年，见过虫蛀的、水泡的、火烧的，没见过这么恨一个地名的。","整个下午，他都在跟这本书较劲。","他先查了馆里的地方志目录，又上网查了能查到的所有方志数据库。这本书的版式很特别，每半叶九行，每行二十字，版心下方有一个小小的“刊”字。他比对了一千多种县志，没有一种对得上。","然后他想把那页夹纸揭下来，单独放进夹板里保存。","揭不下来。","它不是夹在书里的。顾阙拿放大镜一看，夹纸的边缘和书脊的装订线长在了一起，纸纤维一丝一丝地缠在线上，就像装订的时候它就在那儿了。可他上午挑起它的时候，它分明是松的。","他放下镊子，在椅子上坐了很久。","下午五点半，小葛收拾东西准备走。走之前她探头问：“顾老师，晚上一起吃饭吗？楼下新开了一家砂锅。”","“不了，你先走。”","“那我给您带一份？”","“不用。”","她笑了笑，冲他挥挥手，门关上了。","顾阙当时不知道，这是她最后一次叫他顾老师。","晚上七点，他去茶水间接水，回来时门禁滴了一声，亮了红灯。","他又刷了一次。","红灯。","他把工牌翻过来看。照片还是他的，下面印名字的那一栏是空的，白得很干净，像从来没印过。","顾阙在走廊里站了大概十秒，然后摸出钱包，抽出身份证。","照片是他，出生日期是他，住址是他。姓名那一栏，是空的。","他又掏出手机，打开通讯录。","第一个联系人是“阿姨（房东）”。他盯着它看的时候，它消失了。不是一下子没的，是字先淡下去，再是头像，那一行往上一缩，下面的人补了上来。","然后下面那个人也淡了。","他划上去，划下来，通讯录像漏水一样，一格一格地空。银行软件弹出提示：用户不存在。微信退回了登录页。","顾阙拨了110。","这个号码不在通讯录里，它打得通。接警员是个年轻的女声：“您好，请讲。”","“我叫顾阙，我在省图书馆四楼，我……”","那边安静了两秒。","“您好，请讲。”","就好像他刚才什么都没说。","“我叫顾阙。”他又说了一遍，一个字一个字地说，“顾客的顾，宫阙的阙。”","“您好，请讲。”接警员的语气里有一点困惑，“您好？能听到吗？”","他挂了电话。","不是信号不好。是他的名字，传不过去了。","顾阙没有喊。","这大概是他这个职业带来的毛病。书在手里烂的时候，慌是没用的，手一抖，整页就碎了。","这句话是他的老师说的。","七年前顾阙刚进修复室，老师扔给他一册粘成砖头的旧账本，让他一页一页揭开。他揭了一下午，揭坏了三页，急得满头大汗。老师在旁边喝茶，一句话不说，最后才放下杯子：“书在你手里烂的时候，慌是没用的。书比人活得久，你对它客气点，它就给你留点面子。”","那天晚上，顾阙揭到十二点，一页没再坏。","通讯录里还剩最后一个名字：闻启章。","他的老师，七十一岁，教了他七年。","他按下拨号键，响了四声，通了。","“老师，是我。”","那边静了一会儿。","“小顾？”","顾阙的喉咙一下子紧了。","“您还记得我？”","“胡说什么。”老头的声音和平常一样，有点不耐烦，“这么晚，书修坏了？”","“老师，我收到一本书，书里——”","“小顾。”闻启章打断他，语气忽然变了，“你现在手边，是不是有一本没有县名的书？”","顾阙握着手机，没说话。","“听好，”老师说，“太阳落山以后，不管谁叫你——”","电话断了。","他再拨回去，听筒里传来一个女声：您拨打的号码不存在。","再看屏幕，通讯录是空的。","顾阙决定先离开这栋楼。","他推开楼梯间的门往下走。三楼，二楼，一楼，他数着台阶，每层二十二级。走到底，推开防火门。","门外是四楼的走廊。","修复室的门牌就挂在他对面，“古籍修复室”五个字，是他去年亲手贴的，贴歪了一点，一直没顾上改。","他又走了一遍，这次在每层的扶手上用指甲划了一道。","还是四楼。他低头看扶手，只有一道划痕。","保安老王从楼梯口上来，手电筒照在顾阙脸上。顾阙认识老王三年，每年过年都给他带两条烟，老王每次都推辞，每次都收下。","“哎，你谁啊？”老王皱着眉，“闭馆了，怎么进来的？”","“王叔，是我，小顾。”","“什么小顾？赶紧下楼，不然我报警了。”","顾阙打开手机相册，翻出去年春节的一张合影，举到老王面前。那天他们俩站在传达室门口，一人叼着一根烟，笑得像两个傻子。","照片上只有老王一个人。他站在左边，叼着烟，右手搭在空气上，冲着镜头笑。","他旁边那块地方，什么也没有。","老王眯着眼看了看照片，又看了看顾阙，往后退了半步，手往腰上的对讲机摸过去。","“小伙子，”老王的声音放软了，是那种对付醉汉的软，“有啥事明天再说，啊？我先送你下楼。”","顾阙把手机收了回来。","手表上的时间是八点五十九分。","亥时，从晚上九点开始。","他转身回了修复室。门禁依然是红的，可他一推，门开了，就好像它从来没锁过。屋里没开灯，那本书好端端地摊在工作台上，翻在那一页。","老王没有跟进来。顾阙听见他的脚步声在门外停了一下，然后走远了，嘴里还嘟囔着什么，好像已经忘了刚才见过一个人。","顾阙走到工作台前。","分针跳了一格。","九点整。","背后吹来一阵风，带着土腥味，还有一股湿草烧过的焦味。","修复室在四楼，窗外本来是图书馆的停车场。这个点，停车场的路灯应该亮着，橘黄色的光会一直照到他的工作台上。","现在没有光。","顾阙慢慢转过身，看见窗户开着，窗台外面没有停车场，也没有路灯。","那里有一条土路，从窗台平平地伸出去，伸进一片黑里。","路边立着一块木牌，字是新刷的，红漆还在往下淌。","丁溪县，三里。","他低下头。","书页上，他的死讯旁边，正一笔一笔地，多出三个小字。","已入卷。"]},{"id":"ch-1795214173095-0-0","title":"第2章 三里","paragraphs":["样稿，用于确定文风，请勿直接发布","顾阙在窗台上蹲了很久。","不是犹豫。他是在等一个人来告诉他，这一切是假的。","没有人来。身后修复室的门开着，走廊的感应灯瞬间全灭下去，整栋楼突然黑透了。只有窗外那条路是亮的。不是灯照的亮，是路本身泛着一层灰白，像洗过很多遍的旧布。","他回身把工具包拿了过来。","帆布的，用了七年，边角磨得起毛。里面是他吃饭的家伙：两把镊子，一支骨刀，一个十倍放大镜，一小瓶喷壶，还有一卷棉纸。他不知道那边用不用得上，但他这个人有个毛病，出门不带工具就心慌。","那本书他也塞了进去，拉好拉链，翻过窗台。","脚踩上去，是实的。土很松，昨天刚下完雨，带着潮气，一踩一个印子。","他回头。","窗户没了，图书馆也没了。身后是一模一样的土路，往另一头伸进黑里，看不见尽头。","他掏出手机。没有信号，屏幕上的时间停在21:00，秒数也不动。","行，那就往前走。","顾阙开始数步子。这也是职业病。揭一张粘连的书页，手上要有数，镊子进去几毫米，喷几下水，等几秒，全靠数。数着数着，人就静下来了。","一里是五百米，按他的步幅，大概七百步。","数到六百九十步，路边出现了一块石碑。","半人高，青石的，正面刻着“一里”两个字，刻工很粗，像是赶工出来的。","碑底下扔着几个烟头。","他蹲下看了看，烟头还是温的，最便宜的那种烟，十块钱一包。有一个只抽了一半就掐了，掐的人手在抖，烟丝都碾出来了。","有人刚从这儿过去，而且很害怕。","二里碑那里坐着一个人。","是个穿保安制服的中年男人，抱着膝盖坐在碑底下。听见脚步声，他噌地站起来，右手攥着一根橡胶棍，左手却把一个东西往身后藏。","“谁！”","“路过的。”顾阙说，“跟你一样。”","保安盯着他看了好几秒，棍子慢慢放下来，大口喘气。","这人个子不高，挺着个啤酒肚，制服小了一号，扣子绷得紧紧的，袖口磨得发亮。左边胸口别着一个对讲机，右边别着一块工牌，工牌上照片还在，名字那一栏是空的。","和顾阙的一样。","“兄弟，你也是……从家里走出来的？”","“单位。”","“我是小区。”保安说，“我在岗亭里，一抬头，岗亭窗户外头就是这条路。我还以为我喝多了，可我一口都没喝啊。”","他叫郝建国，四十六岁，在城东一个老小区当保安，干了十一年。说这些的时候，他一直在按对讲机，按下去，松开，再按下去，里面只有沙沙的响声。","“没用的。”顾阙说。","“我知道没用。”郝建国又按了一下，“按着踏实。”","顾阙没再劝。他也有他的对讲机，就是心里数的那些数。","他这才看清郝建国藏在身后的东西。是个不锈钢的保温桶，两层的，桶身上贴着一张卡通贴纸，已经褪色了。","郝建国注意到他在看，有点不好意思，把桶往怀里抱了抱。","“饺子。”他说，“韭菜鸡蛋的。我闺女今年高三，晚自习下课得十点，我每天晚上给她送一顿。今天包得多，她妈还特意多放了虾皮。”","“那你怎么带着它过来了？”","“我也不知道。”郝建国低头看着那个桶，“那会儿我正准备出门，手里就拎着它。我在岗亭里给闺女打电话，想问她今天几点下课，她接了，问我……”","他停了一下。","“问我，‘你哪位’。”","风从路上吹过来，凉飕飕的。","郝建国吸了吸鼻子，把保温桶的提手攥紧了：“我闺女不是那种开玩笑的孩子。她小时候我值夜班，她非要等我回来才睡，困得眼皮打架也不睡。她不会问我是谁的。”","顾阙没接话。这种时候说什么都不对。","“兄弟，你说，”郝建国问，“咱们这是死了吗？”","“死了的人，烟头不会是温的。”顾阙站起来，“走吧，前面还有一里。”","郝建国愣了一下，好像没想到他会这么回答，然后笑了，笑得比哭还难看。","“你这人说话，怪噎人的。”","“我知道。”","郝建国跟上来，走在他旁边，保温桶在手里一晃一晃。走了一段，他又开始说话，说闺女数学不好，说打算等闺女考上大学就把烟戒了。顾阙听着，偶尔应一声。","他看得出来，郝建国不是话多，是怕静。","走到二里和三里中间，郝建国忽然不说了。","“兄弟，”他压低声音，“你看路边。”","顾阙看了。","路两边的土埂上，隔几步就摆着一只鞋。有布鞋，有胶鞋，有一只小孩的虎头鞋，还有一只高跟鞋，鞋跟断了。全都鞋尖朝着前面，整整齐齐，像是有人一只一只摆好的。","没有一双是成对的。","郝建国用橡胶棍挑起一只解放鞋，翻过来看了看，又赶紧放回去，放得端端正正。","“这么多人，”他说，“都只走到这儿？”","顾阙没回答。他在看那只虎头鞋。鞋面上的绣线褪成了白色，鞋底却没有一点磨损。","穿它的孩子，几乎没走过路。","“别数了。”顾阙说，“走快点。”","“我没数。”郝建国说完，自己愣了一下，“我数了，四十七只。”","后面那一段路，他一句话都没有再说。","过了三里碑，路突然变宽了，天也开始亮。","不是慢慢亮的。像是有人把一块黑布从天上扯了下去，一眨眼，天边就泛出鱼肚白，远处显出一道灰色的城墙。墙不高，青砖砌的，砖缝里长着草，墙头上插着几面褪了色的旗子，旗子上写着什么，离得太远看不清。","城门还关着，门前站着四个人。","四个人同时转过头来，看着他俩。"]},{"id":"ch-1795214173100-0-0","title":"第3章 人齐了","paragraphs":["样稿，用于确定文风，请勿直接发布","顾阙和郝建国走近的时候，那四个人还在看着他们。","其中一个女孩先回过神来，挥了挥手，又觉得不对，把手放下了。","她看着二十岁出头，个子小小的，扎着一个歪掉的丸子头，睡衣外面套了一件长到膝盖的白色羽绒服，脚上是一双毛绒拖鞋，兔子耳朵的那种，已经被泥糊得看不出颜色了。","“你们也是？”她的声音有点抖，“我叫陈小满，大二的。我在宿舍床上刷手机，刷着刷着，床帘外面就是土路了。我室友就睡在下铺，我叫她，她翻了个身问我是谁……”","她说着说着眼圈就红了，又硬憋回去，用羽绒服袖子使劲擦了一下鼻子。","“对不起，我一紧张话就多。”","“没事，”郝建国说，“我也是。”","他看陈小满的眼神，和刚才看保温桶的眼神有点像。顾阙猜他闺女也是这么大的个子。","陈小满冲他笑了一下，又转过来看顾阙：“你们是从后面那条路上来的吧？你们有没有觉得，那三块碑不太对？”","顾阙看了她一眼。","“哪里不对？”","“距离不一样。”她掰着手指头，“从起点到一里碑，我走了六百八十步左右，一里碑到二里碑是六百二十步，二里碑到三里碑只有五百多步。我步子小，一步大概七十公分，那就是说，三段路一段比一段短。”","“你也数步子？”","“我是学测绘的。”她有点不好意思，“老师说的，没有仪器的时候，步子就是尺。我紧张的时候就数东西，数完就不那么怕了。”","顾阙自己数的是六百九十，后面两段他没留意。但她说得没错，后面那两段，确实走得比第一段快。","路在变短。或者说，这个地方在把人往城门这边收。","顾阙还没想明白这意味着什么，她旁边的男人已经走过来了。","三十出头，一身深蓝色西装，白衬衫，没打领带，头发梳得一丝不乱。皮鞋擦得锃亮，只是鞋底和裤脚都是泥，他走路的时候一直踮着脚，好像这样就能少脏一点。","他双手递过来一张名片，动作很熟练，腰弯得恰到好处。","“贾三元，做保险的。”他顿了顿，自己先笑了，“算了，现在说这个也没意义。名片您收着，万一出去了呢？”","顾阙接过名片，上面印名字的地方是空的，只剩一个电话号码。","贾三元见他盯着名片，笑容停了一下，很快又接上了：“您看，我也是刚发现。不过号码还在，说明还有希望，对吧？”","他又给郝建国递了一张。郝建国腾不出手，用夹着保温桶的胳膊肘夹住了。","贾三元的眼睛在他们俩身上转了一圈，在郝建国的橡胶棍上停了一下，在顾阙的工具包上也停了一下。","那不是在看人。那是在估价。","第四个人站得最远，靠着城墙。","年轻，二十七八岁的样子，穿一件深灰色的长大衣，里面是黑色高领毛衣，手里什么都没拿。从他们走过来，他就一直在看顾阙，不说话，也不过来。","顾阙也打量了他一眼。","然后注意到一件事。","所有人的鞋上都是泥。郝建国的劳保鞋，陈小满的兔子拖鞋，贾三元的皮鞋，顾阙的运动鞋。从那条路上走过来，没有人能干干净净的。","只有那个年轻人的鞋是干净的。黑色的皮鞋，一点泥也没有。","他像是没走过那三里路。","顾阙盯着那双鞋看，年轻人也察觉到了，嘴角动了一下，像是在笑，又不太像。","“你手上的墨，”年轻人开口了，声音很低，“还没干。”","顾阙低头。他的左手小指，指腹上还是黑的，就是下午在“卒”字上蹭的那一下。","再抬头的时候，对方已经把视线移开了，看着城墙上的旗子，好像刚才那句话不是他说的。","最后一个人蹲在城门正下方，背对着他们，在看门上贴的东西。他头发花白，戴一副老花镜，一条镜腿用胶布缠着。膝盖上摊着一个硬皮笔记本，他一边看，一边往本子上抄。","听见他们说话，他也没回头。","“又来两个。”他说，“好，人齐了。”","“什么人齐了？”郝建国问。","老头不慌不忙，把最后一个字抄完，合上本子，夹在胳膊底下，这才站起来，拍了拍膝盖上的土，转过身。","他五十多岁，脸很瘦，颧骨高，穿一件洗得发白的蓝夹克，口袋里插着两支笔，一支黑的，一支红的。整个人看着像个中学老师，还是那种改作业很严的。","“周铎。”他说，“这种地方，我是第三次来了。”","所有人都安静了。","“这种地方，”陈小满小声问，“是哪种地方？”","周铎没直接回答，往城门上指了指。","门上贴着一张告示，纸已经黄透了，四个角用浆糊糊着，有一个角翘了起来。告示抬头两个大字：凡例。","下面是一条一条的竖排小字，第一条被人撕掉了大半，只剩开头一行：","“一、日落后，有人唤名，勿……”","后面没了。","顾阙走近了一步。","撕口的边缘起了毛，纤维发黑，那是很多年的灰慢慢吃进去的颜色，不是新撕的。他又凑近看了看纸面，帘纹很粗，纸里能看见没打散的竹丝。","这张告示的纸，和他包里那本书，是同一种竹纸。","“你懂纸？”","周铎站在顾阙旁边，从老花镜上面看着他。","“修古籍的。”顾阙说，“这一条不是刚撕的，至少撕了几十年。”","周铎“嗯”了一声，没有夸他，也没有反驳，又低头翻开了自己的本子，在刚才抄的那一页上用红笔补了一行小字。","顾阙瞥了一眼，写的是：首条撕，旧痕。","“这是什么意思？”贾三元凑过来，“勿什么？勿出门？勿回头？勿答应？”","“不知道。”周铎说，“每个地方的凡例都不全。全的，就不叫这种地方了。”","“那到底是哪种地方？”郝建国的嗓门大了起来，“老哥，你知道什么就说，别打哑谜。我闺女还在家等我。”","周铎合上本子，看了他一会儿。","“你闺女还记得你吗？”","郝建国张了张嘴，没说出话来，抱着保温桶的手指一点一点地收紧了。","“你们每个人来之前，都碰上了一样的事。”周铎说，“工牌上没名字，手机里没人，熟人不认识你。不是他们忘了，是你从那边被删了。你们现在，是这一页里多出来的人。”","“删了……还能加回去吗？”陈小满问。","“能。”周铎说，“把这个地方的事办完，这一卷合上，你就能回去。回去以后，大家就又记得你了。”","“上一回，”贾三元忽然问，“跟您一起进来的有几个人？”","周铎看了他一眼。","“七个。”","“出去了几个？”","“两个。”","陈小满倒吸了一口凉气。郝建国骂了一句脏话。贾三元没说话，只是点了点头，嘴唇动了动，像是在算什么。","顾阙看着周铎胳膊底下夹着的那个本子。","“所以你一直在抄。”顾阙说。","“人会忘，纸不会。”周铎把本子往胳膊底下又夹紧了些，“在这种地方，脑子靠不住，纸上写的才靠得住。你们最好也找个东西记着。”","他说这话的时候很平静，像在课堂上讲一条定理。","城门里传来一声锣响。","门闩从里面被拉开了，两扇厚重的城门吱呀一声，缓缓往里开。","门里是一条长街，青石板铺的路，两边是一溜的铺子。早点铺的蒸笼正冒着白气，油条在锅里滋滋地响，挑担的、赶车的、扫地的，人来人往，有人在讨价还价，有个小孩追着一只鸡跑过去。","和任何一个普通的早晨，没有区别。","看上去，是个活生生的县城。","郝建国长出了一口气：“这不挺好的吗……”","周铎第一个往里走。走了两步，他回过头，看了他们一圈。","“记住，”他说，“天亮着的时候，什么都别怕。”","“天黑了呢？”顾阙问。","周铎看了他一眼，好像这才真正注意到这个年轻人。","“过了今晚的，”他说，“才能叫活人。”"]},{"id":"ch-1795214173102-0-0","title":"第4章 丁口","paragraphs":["样稿，用于确定文风，请勿直接发布","进了城门，一股热气扑到脸上。","油条的香味，豆浆的焦味，骡子身上的骚味，还有不知哪家在熬猪油。郝建国的肚子咕噜叫了一声，叫得特别响。","他赶紧把保温桶往怀里搂了搂：“别看我啊，这饺子是给我闺女的。”","“没人跟你抢，郝哥。”贾三元笑着拍了拍他的肩膀，眼睛却一直在两边的铺子上转，“不过咱们得先想想，拿什么买吃的？我兜里就一个手机，这地方总不能扫码吧？”","“你可以试试，”陈小满说，“万一呢，说不定他们收花呗。”","没人笑，她自己尴尬地“嘿嘿”了两声。","周铎走在最前面，头也不回：“这里的东西，能不吃就不吃。”","“为啥？”郝建国问。","“我上一回见过有人吃了这里的饭，”周铎说，“第二天，他就开始说这里的方言了。”","郝建国把刚咽下去的口水又咽了一遍。","顾阙走在队伍最后面，一边走一边看。","这是一条很普通的老街。青石板被踩得发亮，两边的铺子是木板门，门楣上挂着招牌：粮店、布庄、铁匠铺、药铺。街上的人穿着粗布短褂，男人头上缠着布巾，女人挽着发髻，小孩光着脚跑来跑去。","街上的人看见这群外来者，会多看两眼，但没有一个人大惊小怪。好像穿睡衣和穿西装的人从城门走进来，是一件再平常不过的事。","裴照走在顾阙前面两步。顾阙注意到，裴照走路的时候，两只手一直插在大衣口袋里，经过一个摊子时，摊主递过来一个烧饼让他尝，他侧身避开了，连衣角都没让对方碰到。","陈小满落后几步，凑到顾阙身边，压低声音：“哎，那个……你叫什么来着？”","顾阙这才想起来，自己还没跟大家报过名字。","“顾阙。”","“顾阙，你有没有觉得，这里的人说话特别怪？”","“哪里怪？”","“你听。”","街边一个卖菜的妇人在吆喝，一个汉子挑着担子从她摊前过，她招呼了一声：“哎，那谁，今儿的萝卜水灵，捎两个？”","汉子摆摆手：“不了，他婶子，家里还有。”","再往前，一个老头蹲在门口抽旱烟，冲屋里喊：“那个谁，饭好了没？”","一个小男孩追着一只鸡跑过去，他娘在后面追着喊：“小子！小子你给我回来！”","“我数了，”陈小满说，“从城门到这里，一共二十三个人说过话，没有一个人叫过别人的名字。全是‘那谁’‘他婶子’‘小子’。”","顾阙停下脚步，又听了一会儿。","她说得对。","“也许是习惯？”郝建国回过头来，“我们小区也有人这么叫，见面就是‘老哥’，叫了十年都不知道对方姓啥。”","“郝哥，”顾阙说，“一条街上的人，全都十年不知道对方姓啥？”","郝建国张了张嘴，不说话了。","“名字，”周铎在前面停下来，从夹克口袋里掏出那个硬皮本子，用黑笔记了一行，“记下来。这里的人不叫名字。”","他写完，用红笔在下面画了一道线。","街的尽头是个小广场，广场北面是一座衙门。","门口两只石狮子，一只缺了半边耳朵。大门上的匾写着“丁溪县署”。衙门正对面立着一面照壁，白墙上贴满了告示，新的压着旧的，一层叠一层。","“先找住的地方。”周铎说，“天黑之前，必须有一间能关门的屋子。这条比什么都要紧。”","“我想先去看看那些告示。”顾阙说。","周铎看了他一眼：“半炷香。别乱碰东西。”","“我也去！”陈小满跟了上来。","“我陪周老师去找客栈，”贾三元说，“郝哥，你跟着他俩，有个照应。”","他安排得很顺溜，好像大家是他带的旅游团。","郝建国应了一声，跟在后面。顾阙走了几步，发现裴照也过来了。裴照没说要来，就是站在照壁前面，隔着两三步，也在看告示。","顾阙一张一张地看下去。","最上面的告示是新的，说的都是小事：秋粮已经征完了，严禁私自宰牛，某段河堤哪天开工。越往下，纸越旧，字越淡。","在照壁正中间，顾阙看见了一张大榜。","它比别的告示大一圈，左下角盖着一方红色的官印，印文是“丁溪县印”。榜上的字写得端端正正：","“晏嘉宁七年，本县编审丁口，造册在案。计：户，零。口，零。”","下面还有一行小字：","“本县太平，并无逃亡，并无灾异，并无饥馑。”","“户零，口零……”陈小满念出了声，“这是什么意思？”","“丁口就是人口。”顾阙说，“古代官府每隔几年要清点一次全县有多少户、多少人，登记在册，按人头收税。这张榜的意思是，官府的册子上，这个县一户人家都没有，一个人都没有。”","陈小满回头看了一眼广场。","卖糖人的老头，挑水的汉子，坐在台阶上晒太阳的老太太，追鸡的小孩。光这个广场上就有几十个人。","“可他们明明就在这儿啊。”","“所以，”顾阙说，“官府的册子和眼前的人，有一边是错的。”","“会不会是写错了？”郝建国挠挠头，“少写个一、多写个零啥的，我们物业天天出这种错。”","“官榜盖了印，”顾阙说，“就算错，也是故意错的。”","“账不平。”","所有人都回过头。","是裴照。他还站在那儿，两手插着口袋，看着那张榜。","“册子上是零，人却有几千。”他说，“账不平，就有人要把它做平。”","“怎么做平？”陈小满问。","裴照没有回答。他看了顾阙一眼，转身走了。","“这人……”郝建国压低声音，“是不是有点瘆人？”","“嗯。”顾阙掏出笔记本，把榜上的字一个一个抄下来，连官印的位置都画上了。抄完，他在页脚签了个名。","陈小满凑过来看：“抄个东西还要签名？”","“习惯。”顾阙说，“修复记录单，每张都要签。”","“你这个‘阙’字好怪。”陈小满指着那个字，“门里头那一撇，怎么起得那么早？跟急着出门似的。”","“从小就这么写。”顾阙说，“改不过来。”","周铎说得对，在这种地方，脑子靠不住。","周铎和贾三元找的客栈不在广场上，在往东去的一条街里，叫安居客栈。","掌柜是个胖子，五十来岁，脸圆圆的，笑起来眼睛眯成一条缝。他坐在柜台后面打算盘，一把黑檀木算盘，珠子被摸得油光发亮。","“住店。”周铎说。","“几位客官？”","“六个。”","掌柜笑眯眯地点头，左手按住算盘，右手开始拨珠子。他一边拨，一边抬眼看这几个客人，看一个人，拨一颗珠子。","郝建国，一颗。陈小满，一颗。贾三元，一颗。周铎，一颗。裴照，一颗。","最后，掌柜看向顾阙。","他的手指搭在第六颗珠子上，往上一推。","珠子没动。","他又推了一下，那颗珠子像是被焊在了横梁上，纹丝不动。","掌柜脸上的笑容一点没变。他收回手，把顾阙从头到脚又看了一遍。","“这位客官，”他说，“您算几个人？”"]},{"id":"ch-1795214173103-0-0","title":"第5章 墨色","paragraphs":["样稿，用于确定文风，请勿直接发布","所有人都看着那颗拨不上去的珠子。","顾阙知道它为什么拨不上去。","那本残志上写着：顾阙，本县人，卒于本月十七亥时。在这个县的账上，他已经是个死人了。死人，不算丁口。","可还有一件事，他想不通。他在衡泽省长大，二十六年，从没听说过丁溪这个地方。这本书凭什么说，他是本县人？","“一个。”顾阙说，“我算一个人。”","他说得很慢，很清楚，像在跟一个耳背的老人说话。","掌柜眯着眼看了他一会儿，又伸出手指，轻轻一推。","啪。","第六颗珠子上去了。","“那就好。”掌柜笑眯眯地说，“小店最怕的，就是算不清的客人。”","郝建国长出一口气，小声嘀咕：“吓我一跳，我还以为他要说‘查无此人’呢。”","“郝哥，”陈小满拽了拽他的袖子，“你别乌鸦嘴。”","掌柜从柜台底下摸出一本发黄的册子，又摸出一支毛笔，蘸好墨，推到他们面前：“几位客官，登个名号。本店不收银子，留个名就行。”","“这个好说。”贾三元已经伸手去拿笔了，“入乡随俗嘛。”","“别动。”","周铎的声音不大，贾三元的手一下子缩了回去。","“在这种地方，”周铎说，“名字是最值钱的东西。凡例上没让你写的，一个字都别写。”","他把笔放回笔架，从夹克口袋里摸出一块旧手表。表带是皮的，磨得发白，表盘上有一道裂纹。","“这个抵房钱。”","掌柜拿起来，放在耳边听了听，眉开眼笑地收进了抽屉：“楼上左手第二间，大通铺，够六位歇的。”","上楼的时候，贾三元凑到周铎身边：“周老师，那表挺贵的吧？”","“我女儿送的。”周铎说，“上一回，我拿它换了一条命。这一回，只换一间屋子，值了。”","贾三元“哦”了一声，过了一会儿又说：“周老师，以后有什么事，您吩咐，我跟着您走。”","顾阙听得出来，贾三元是在押注。他在这群人里挑了一个最可能活下来的。","大通铺很简陋：一张长炕，几床打补丁的被子，一张缺角的桌子。窗户正对着广场，能看见远处的照壁。","周铎关好门，把大家叫到桌边，翻开本子。","“现在说正事。”他推了推老花镜，“每个这种地方，都会有一份凡例，就是这里的规矩。城门上贴了一份，衙门前面照壁上也贴了一份。我刚才路过的时候对过了，两份一字不差，连第一条都是一样撕掉的。”","他的字很小，很工整：","“一、日落后，有人唤名，勿……","二、入夜闭户，不得燃灯。","三、凡外来人等，须于日落前赴县衙投名入册。入册者为本县丁口，官唤其名，应之即安。","四、更鼓三响，天明方可出户。","五、本县太平，勿妄言灾异。”","“我翻译一下。”周铎用红笔一条一条地点，“第二条，天黑以后关门，不许点灯。第四条，半夜打完三更鼓以后，一直到天亮，都不许出门。第五条，不许说这个县有灾有难。这三条好办，照做就行。”","“第一条又是撕掉的。”郝建国说。","“对，所以要紧的是第三条。”周铎在第三条下面重重地画了一道，“我们是外来人，官府的册子上没有我们。没有登记的人，在这种地方就是多出来的，多出来的东西，它会想办法收掉。”","“它？”郝建国问，“它是谁？”","周铎的笔停了一下。","“我不知道。”他说，“前两次我都没见过。我只知道，这种地方，账对不上的时候，总有东西来把它对上。”","“是县令？还是官差？”陈小满问。","“官差是来喊名字的。”周铎说，“喊名字的，不一定就是收东西的。”","角落里，裴照低着头，一直没出声，这时候说了一句：“最好别知道。”","周铎看了他一眼，没接话，拿红笔把第三条又描了一遍：“总之，天黑之前去衙门登记，我们就算本县人了。到时候官差来喊名字，我们答应一声，就平安无事。”","“就这么简单？”郝建国问。","“凡例上写的，就是规矩。”周铎说，“我前两次，就是一条一条照着凡例做，才活着出去的。”","“那我听周老师的。”贾三元第一个表态。","“我……”郝建国看看周铎，又看看其他人，“咱们是不是得一块儿行动？别分开。”","陈小满没说话。她把周铎的本子拉到自己面前，盯着那几行字看了很久，手指在纸面上比画着什么。","“周老师，”她忽然说，“您抄的时候，第三条是不是比别的条挤？”","周铎愣了一下：“是。那一条字多，写得密。”","“不对。”陈小满抬起头，“我刚才在照壁那儿也看了。每一条占的宽度都一样，都是两行，可第三条的字数是别的条的两倍。它不是写得密，它是硬塞进去的。就像……就像一张表格里，有人把一格的内容删了，又往这一格里硬塞了一大段话。”","所有人都看向她。","她的脸一下子红了：“我、我是学测绘的嘛，看图纸看习惯了，哪儿的比例不对，一眼就看出来了。”","顾阙站了起来：“我想去看看原件。”","衙门前的照壁上，那份凡例就贴在大榜旁边。上午顾阙只顾着抄大榜，没细看它。","陈小满说得一点没错。五条凡例，每条都占两行，其他四条的字疏密均匀，只有第三条，挤得密密麻麻，字都快贴在一起了。","顾阙凑近了看纸。","第一、二、四、五条的墨是灰褐色的。老墨就是这样，放的年头久了，黑色会慢慢褪成灰褐。只有第三条的字是漆黑的，墨面上还带着一层油光，像是新写上去的。","他侧过头，让阳光斜着扫过纸面。","第三条所在的那块纸，比周围微微凹下去了一层，边缘有一圈毛糙的刮痕。","“这叫挖改。”顾阙对大家说，“有人用刀把原来的第三条刮掉了，纸被刮薄了一层，然后在刮薄的地方写上了新的字。就像在作业本上用涂改液涂掉一行，再写上自己想写的答案。从墨色看，这一条至少比其他几条晚写了一两百年。”","“所以第三条是假的？”郝建国问。","“我不知道它是真是假，”顾阙说，“我只知道它被人改过。有人费这么大劲改一条规矩，一定是想让看到的人照着做。”","“改的人，”裴照在旁边开口了，“就是想让外来人去投名。”","他说完这句，就退到了一边，靠着石狮子，不再说话。","周铎站在照壁前，盯着第三条看了很久。","“刮了重写，那也是凡例。”他终于开口，声音很平静，“小顾，你看纸比我准，我承认。可这种地方不讲修书的道理。规矩贴在这里，它就是规矩。我前两次，凡例上写的，我照做，我活了。凡例上没写的，我自作聪明，害死了别人。”","他看着顾阙，眼神里没有生气，只有一种很深的疲惫。","“我比你多来过两次。这一次，我还是信纸。”","顾阙想起陆游的两句诗：纸上得来终觉浅，绝知此事要躬行。","意思是，从书本上学来的东西终究是浅的，要真正弄明白一件事，得自己亲手去做。","他修了七年书，最信这个道理。可眼前这个老人，恰恰就是要亲手去试那张纸。","他转身走向衙门的大门。","“周老师！”郝建国喊了一声。","“你们自己决定。天黑之前，我在客栈等你们。”","周铎侧身进了大门。","贾三元往前走了两步，又停下了。他回头看着大家，笑了一下，笑得有点不自然：“我……我先看看周老师那边怎么样。他有经验，咱们不急这一会儿。”","他站在门口，一步也没再往里走。","几个人在广场上等了大概一盏茶的工夫，周铎出来了。","“登记好了。”他说，“名字写进了丁册。”","他的表情很轻松。","顾阙却盯着周铎身后的照壁。","那张写着“户，零。口，零”的大榜，“口”字后面那个“零”不见了。","现在那里写着一个“一”，墨迹还是湿的。","顾阙明白了。周铎刚刚在官府的册子上登了记，所以这个县的人口，从零变成了一。","而在这个县，没有一个本地人在册子上。","在册子上的人，只有周铎一个。","他掏出笔记本，在抄榜的那一页底下飞快地补了一行：周铎投名后，口零变一。","顾阙还没来得及开口，天就黑了。","和早上天亮时一样，不是慢慢黑的，是一眨眼，整个县城就沉进了一片灰蓝里。","广场上的人一下子散光了，一扇扇木门砰砰关上。","远处传来一声梆子响。","“回客栈！”周铎说。","顾阙走在最后面，回头又看了一眼那张榜。","天已经暗了，榜上的字糊成了一片灰影。只有那个“一”字，墨是新的，还没干透，泛着一点湿光。"]},{"id":"ch-1795214173105-0-0","title":"第6章 勿应","paragraphs":["样稿，用于确定文风，请勿直接发布","客栈的大门是掌柜亲手闩上的。","两根门闩，一根横着，一根斜顶在地上。他又搬了张条凳抵在门后，这才拍拍手上的灰，笑眯眯地对客人们说：“客官早些歇着。夜里不管听见什么，都别开窗，别点灯。”","“会听见什么？”陈小满问。","掌柜只是笑，提着算盘回了后屋。","楼上的大通铺一点光都没有。窗纸上有几个破洞，透进来一点灰白的光，刚好能看清彼此的轮廓。","郝建国摸出手机，屏幕亮了一下，他又赶紧按灭：“手机算不算灯啊？”","“别试。”周铎说。","周铎选了靠窗的位置坐下。贾三元主动说：“我守门。”然后坐到了离门最近的炕角。裴照一个人坐在炕的另一头，背靠墙，脸对着窗。","剩下顾阙、郝建国和陈小满三个，挤在中间。","过了一会儿，郝建国窸窸窣窣地拧开了保温桶，一股韭菜鸡蛋的味道散开来。","“凉透了。”他说，“你们谁饿，吃两个。”","“那是给你闺女的。”陈小满说。","“我闺女……”郝建国顿了顿，“等我出去，我再给她包，包一百个。”","他把桶递过来。","陈小满拿了一个，咬了一口，眼泪啪嗒就掉下来了。她赶紧用袖子擦掉，含混不清地说：“这是我这辈子吃过最好吃的凉饺子。虽然我这辈子也就吃过这一回凉饺子。”","郝建国被她逗笑了。","贾三元也拿了一个：“郝哥，出去以后我请你吃饭，地方你挑，算我的。”","“行啊，”郝建国说，“我要吃海鲜自助。”","桶递到裴照面前，他摇了摇头。","“你闺女的，”他说，“留着。”","这是裴照第一次说一句不像结论的话。郝建国愣了一下，把桶收了回来。","周铎拿了一个，没吃，用手帕包好，揣进了夹克口袋：“留着，路上吃。”","顾阙拿了一个。饺子皮有点硬了，馅里能吃出虾皮。他这才想起来，自己今天一整天什么都没吃过。","“谢谢郝哥。”","“客气啥，咱们现在也算一家子了。”","顾阙摸出笔记本，借着窗纸透进来的那点光，开始写字。他写得很慢，一笔一画都写清楚：","“郝建国，四十六岁，保安，保温桶里是韭菜鸡蛋饺子，女儿高三。","陈小满，大二，学测绘，紧张就数东西，穿兔子拖鞋。","贾三元，三十出头，卖保险，名片上没有名字。","裴照，二十七八岁，灰大衣，鞋上没有泥。","周铎，五十多岁，戴老花镜，镜腿缠胶布，第三次入卷。人会忘，纸不会。","顾阙，二十六岁，修古籍。”","周铎看见了，点点头：“好习惯。”","然后他把自己那个硬皮本子也递了过来。","“你先替我拿着。”他说，“上面有我前两次的笔记。万一我有什么事，你们用得上。”","“你不是说，照凡例做就没事吗？”顾阙问。","“我信凡例。”周铎说，“但我也信你说的，那张纸被人动过。两样都信，就两样都准备。”","顾阙接过本子，沉甸甸的。","梆子响了第二遍。","然后，他们听见了锣声。","当，当，当。","很慢，从街的那一头传过来。锣声后面，跟着一个人的声音，拖得很长，像在唱：","“丁——溪——县——点——名——”","屋里所有人都不动了。","那个声音一户一户地往前走。走到一家门口，就停下来，喊一个名字。","“王——有——田——”","隔了几秒，远处一扇门里，一个男人闷闷地应了一声：“在。”","然后，那扇门后面就再也没有声音了。","锣声继续往前走。","“李——氏——”","“在。”","“赵——二——狗——”","“在。”","每喊一个名字，就有一个人答应。每答应一次，就是一片死寂。","“答应了的，”顾阙压低声音，“都没声了。”","陈小满一把抓住了顾阙的胳膊，指甲掐进了肉里。郝建国把橡胶棍横在膝盖上。贾三元贴着门，大气都不敢出。裴照还是那个姿势，背靠着墙，一动不动。","锣声停在了客栈门口。","“周——铎——”","周铎站了起来。","“周老师！”顾阙一把抓住他的手腕，“你听见了，答应的人都没声了。”","“他们是本地人，没登记。”周铎说得很慢，很稳，“我登记了。凡例第三条，入册者，官唤其名，应之即安。”","“那一条是被人改过的！”","“周老师你别去……”陈小满的声音带了哭腔。","郝建国也站了起来，一把抱住了周铎的胳膊：“老哥，咱不去，咱听小顾的，啊？”","“让他去。”","是裴照。他没动，也没看任何人，只是看着窗户。","“拦不住的。”他说，“名字已经在册子上了。他不答，他们就会一直喊下去，喊到他答为止。”","周铎看了裴照一眼，又低头看了看顾阙抓着他的手。","“建国，松手。小顾，你也松手。”他说，“本子你收好。”","“周——铎——”","那个声音又喊了一遍，近得像贴在窗外。","周铎轻轻地把手抽了出来，走到窗前，推开一条缝。","“在。”","就在那个字落下的一瞬间，顾阙的脑子里，像是有一块地方被人用橡皮擦了一下。","很轻，很快，一点都不疼。","他眨了一下眼睛。","他站在窗户前面，窗户开着一条缝，夜风灌进来，凉飕飕的。他的手往前伸着，好像要抓什么东西，可手里什么也没有。","“顾阙，你站那儿干嘛呢？”陈小满在身后小声喊，“快把窗户关上啊！”","他赶紧关上窗，插好窗栓，回到炕边。","“刚才咱们在说啥来着？”郝建国揉着太阳穴，“我脑子怎么一下子空了。”","“我也是。”贾三元说。","顾阙看了一圈。郝建国，陈小满，贾三元，裴照，还有他自己。五个人。","靠窗的位置，空着一块，正好能坐下一个人。","“我们一直是五个人？”顾阙问。","“对啊，”陈小满说，“城门口就是我们三个先到的，你和郝大哥后到。”","“那掌柜问几位的时候，是谁回答的？房钱是谁付的？”","没有一个人答得上来。","顾阙低头，发现自己左手攥着一个硬皮本子。不是他的，他从来没见过这个本子。","他又翻开自己的笔记本，凑到窗纸透进来的光下面。","郝建国，陈小满，贾三元，裴照，最后是他自己。","在裴照和他自己中间，还有一行。","是他的字。他写金字旁的时候，最后那一提总是挑得太长，七年都没改掉。这一行里有两个“镜”字，两个都挑得老长。","“周铎，五十多岁，戴老花镜，镜腿缠胶布，第三次入卷。人会忘，纸不会。”","顾阙盯着这个名字，看了很久。","他不认识这个人。"]},{"id":"ch-1795214173107-0-0","title":"第7章 别答","paragraphs":["样稿，用于确定文风，请勿直接发布","“你们看这个。”","顾阙把笔记本递给陈小满。她借着窗纸的光看了半天，抬起头，脸色一点一点白了。","“周铎……是谁？”","“不知道。”顾阙说，“但这是我写的。”","本子在几个人手里传了一圈。","郝建国看完，把本子翻过来又翻过去：“这字……是你的吧？跟上面写我那行一个样。”","“也许你写错了？”贾三元说，“写着写着，脑子一糊涂，多写了一个人？”","“我修了七年书，”顾阙说，“我不会多写一个连眼镜腿缠着胶布都知道的人。”","贾三元不说话了。","“还有这个。”顾阙举起左手那个硬皮本子，“我手里一直攥着它，可我不记得它是从哪来的。”","他翻开它。","里面的字很小，很工整，一页一页记得密密麻麻。前面几十页记的是别的地方：一个叫“白沙渡”的渡口，一座叫“青石观”的道观，每一页都标着日期，记着那里的凡例、死了谁、怎么出去的。","翻到最后几页，记的是这里。","“丁溪县。街人互称不以名。”","“官榜：户零，口零。”","然后是凡例全文，五条，抄得一字不差。第三条下面用红笔画了一道粗线。","最后一页，只有一行字，也是红笔写的：","“若我应名后消失，勿信第三条。周铎。”","顾阙念出来的时候，屋里没有一个人出声。","“他知道。”陈小满的声音发抖，“他知道第三条可能是假的，他还是去了。”","“他不是知道，”顾阙说，“他是两样都信，所以两样都准备了。他照着凡例去答应，又怕自己错了，就把本子留给了我们。”","陈小满低下头，半天没说话。","顾阙想起陶渊明写给自己的挽歌里有两句：亲戚或余悲，他人亦已歌。","意思是，一个人死了，亲人也许还在伤心，别的人却已经唱起歌来了。","可在这个县，连伤心的人都没有。周铎答应那一声之后，他们五个人照样坐在炕上，照样喘气，好像这间屋子里从来就只有五个人。只有一行字记得他。","他把两个本子并排摊在炕上。","“现在事情很清楚了。”他说，“第一，晚上会有人沿街喊名字，答应了的人，就会消失，所有人都会忘了他。第二，凡例第一条后面被撕掉的那两个字，应该是‘勿应’，意思是有人喊你名字，别答应。第三，第三条叫人答应，是有人故意改的，是个陷阱。周铎就是照着第三条答应的。”","“那现在怎么办？”郝建国问。","“熬到天亮。”顾阙说，“第四条说，更鼓三响以后，就不许出门了。我猜喊名也是到三更为止。不管谁喊，都别答应。”","“那咱们定个规矩。”贾三元马上说，“从现在起，谁都别出声。谁的名字被喊了，旁边的人就捂住他的嘴。行不行？”","他说得很快，很果断。顾阙听得出来，贾三元最怕的是别人出声连累自己。但这个办法是对的。","“行。”郝建国说，“谁要是犯迷糊，我第一个上去捂。”","“我数数，”陈小满小声说，“我紧张就数数，数着数着就不会乱说话了。”","“我们没去登记，”郝建国又说，“册子上没咱们，他们喊不出咱们的名字吧？”","“他们知道。”","是裴照。他背靠着墙，眼睛看着窗户。","“只要还有一个人记得你叫什么，他们就能把你的名字喊出来。”","“你怎么知道？”陈小满问。","裴照没回答，闭上了眼睛。","锣声又近了。","这一次，它是从街的另一头绕回来的，走得比刚才快，在客栈门口停住了。","楼下传来掌柜的声音，隔着门板，笑眯眯的，和白天一模一样：","“官爷辛苦。小店今日住了五位客人，都是外乡来的，不在册上。”","“不在册上的，”那个拖长的声音说，“也有名。”","当。","“顾——”","顾阙的后背一下子贴紧了墙。","“——阙——”","就在他的名字被喊出来的那一刻，顾阙看见同伴们的脸变了。","就像周铎答应的时候，他脑子里被擦掉一块一样。只不过这一次，被擦掉的是他自己。","陈小满原本抓着他的胳膊，现在，她的手一下子松开了。她看着他，先是茫然，然后是害怕，整个人往后一缩，缩到了郝建国身后。","“你……你是谁？”她的声音在抖，“你怎么在我们屋里？”","郝建国一下子站起来，把陈小满挡在身后，橡胶棍对准了顾阙：“你什么时候进来的！说！”","“郝哥，是我，顾阙。你那桶饺子……”","“别叫我哥！”","贾三元已经贴着墙挪到了门口，他的声音又尖又急：“把他推出去！他是这里的东西！外面喊的就是他！他在这儿，会把咱们都害死！”","只有裴照没动。","裴照睁开眼睛看着顾阙，眼神很深，没有害怕，也没有敌意，像是在看一道早就知道答案的题。","顾阙闭上了嘴。","他明白了。同伴们不是不信他，是已经不记得他了。在他们眼里，他是一个半夜突然出现在屋子里的陌生人。","“可是……”陈小满从郝建国背后探出头，盯着顾阙手里那个硬皮本子，“他手上那个本子……我好像……”","她说到一半，皱着眉头，说不下去了。","“顾——阙——”","那个声音又响了一遍。","然后，它变了。","它不再拖着长腔，它变得很近，很熟悉，有点沙哑，有点不耐烦。","“小顾。”","顾阙浑身的血一下子凉了。","是闻老师的声音。","“小顾，开门，是我。”那个声音在楼下说，“你修的那本书，我看过了，有些话我得当面跟你说。”","顾阙知道这不是老师。他知道。","它在用他最想听见的声音喊他。","可它太像了。像到他能想起老师说这句话时的样子：把老花镜推到额头上，揉一揉眼角，手里端着一杯放凉了的茶。","“小顾？”那个声音又叫了一声，声音里有一点担心，“你在不在？”","在。","这个字已经到了嘴边。","顾阙不知道自己是怎么走到门口的。他的手已经搭在了门闩上，嘴已经张开了。他只想说一个字。说完了，老师就不用在楼下等了。","一只手从他身后伸过来，捂住了他的嘴。","那只手很凉，凉得像刚从井水里捞出来，硬生生把那个字按了回去。","一个女人的声音贴着他的耳朵，很轻，很快：","“别答。”","顾阙僵在原地。","“这里还记得你名字的，”她说，“只剩我一个了。你答了，就没了。”"]},{"id":"ch-1795214173109-0-0","title":"第8章 宋氏","paragraphs":["样稿，用于确定文风，请勿直接发布","那只手没有松开。","“别回头，也别出声。”她在顾阙耳边说，“心里数数，数到我说停。”","顾阙在心里数。一，二，三。","这是他的老办法。揭一张粘连的书页，镊子进去几毫米，等几秒，全靠数。数着数着，手就不抖了。","“小顾？”楼下的声音还在叫，“你在不在？”","屋里，郝建国还举着橡胶棍，可他的眼神变了。郝建国看看顾阙，又看看顾阙身后，眉头拧成一团。","“你……你干嘛自己捂着自己的嘴？”","顾阙这才明白，屋里的人看不见她。在他们眼里，一个陌生男人半夜站在门边，抬起手死死捂住了自己的嘴。","“出去。”她说，“他们现在怕你。留在这儿，他们迟早会冲你喊‘你是谁’，在这种地方，被人当面否认一次，你就会再淡一层。”","她拉着顾阙往后退，伸手在身后的门上一拨，那扇闩着的门就开了。","“别开门！”贾三元在屋里尖叫，“让他走！快闩门！”","门在他面前砰地关上了，门闩落下的声音很响。","是郝建国闩的。","可在门关上之前，他听见陈小满很小声地说了一句：“郝大哥，他刚才……好像是想跟我们说什么……”","走廊里伸手不见五指。她的手一直捂着他的嘴，另一只手攥着他的手腕，拽着他往走廊尽头走。她走路一点声音都没有，他却跌跌撞撞，踢到了什么东西，哐当一声。","七十八，七十九，八十。","走廊尽头是一间杂物间，堆着扫帚、木桶和几床发霉的旧被子。她把他推进去，反手关上门，用后背抵住。","楼下那个声音还在叫。","“小顾。”","“小顾，是我啊。”","“你不在吗？”","一百二十，一百二十一。","最后一声叫得很轻，带着一点失望，像一个老人在楼下仰着头等了很久，终于等累了。","远处传来了鼓声。","咚。咚。咚。","三更了。","鼓声落下，那个声音就没有了。锣声也没有了。整个丁溪县安静得像一口盖上了盖子的井。","“停。”她说，松开了手。","顾阙大口喘气，这才发现自己一直憋着，憋得胸口发疼。他扶着墙转过身。","杂物间有一扇小窗，窗纸透进一点灰白的光。借着那点光，他看清了她。","一个年轻女人，二十四五岁的样子，个子不高，穿一件洗得发白的青布衫，袖口挽到小臂，头发随便挽了个髻，插着一根木簪子。眉毛很淡，嘴唇有点薄。","她也在打量他，从上到下，一点都不客气。","“修书的？”她问。","“你怎么知道？”","“你刚才往门口走的时候，嘴里一直念叨‘镊子进去，等三秒’。”她撇撇嘴，“不是修书的，难道是拔牙的？”","顾阙张了张嘴，没说出话来。","杂物间的墙上挂着一面铜镜，镜面发乌，边上一圈绿锈。","他从镜子前面走过，余光扫了一眼，停住了。","镜子里只有他一个人。她就站在他旁边，不到一尺远，可镜子里那个位置，是空的。","“别看了。”她说，“我照不出来。”","“你到底是……”","“活人。”她说，“至少我自己觉得是。”","“刚才到底是怎么回事？”顾阙问，“我的朋友们，为什么突然不认识我了？”","“你的名字被喊出来了。”她靠在门上，抱着胳膊，一条一条地说，像是早就讲过很多遍，“这里的规矩是这样的：官差喊谁的名字，谁身边的人就会开始忘了他。你要是答应了，那就彻底没了，谁也想不起来，连你自己留下的东西都会变成别人的。你要是一直不答应，熬到三更鼓响，喊声就停了。”","“那他们……”","“明天天亮，他们会想起你的。”她说，“只要你今晚还活着。”","“可是……”","“你想问，头一个被喊的那个姓周的，为什么喊他的时候，你们个个都还认得他？”她没等他问完，“你不记得他了，我替你记着。他入了册。册子替他记着名字，旁人忘不掉他，要等他自己答应了，才一笔划干净。你不在册上，这县里记得你名字的，就只有你身边那几个人。官差喊你，就是把那几个人的记性往回收。”","顾阙不记得什么姓周的。可他想起笔记本上那一行自己写的字，没有再问。","顾阙松了一口气，靠在墙上，腿有点软。","“那你呢？你为什么记得我？”","“因为我早就被所有人忘干净了。”她说，“我不在任何一本册子上，官差喊不出我的名字，我也就不会被谁忘掉。一个没人记得的人，反倒能记住别人。”","她说得很轻快，像在说今天天气不错。","“你叫什么名字？”","她想了一下：“姓宋。”","“宋什么？”","“就姓宋。”她下巴一抬，“你们修书的不是最会查吗？想知道，自己查。”","她不肯说，顾阙就不再问了。他看得出来，那不是故弄玄虚，是她不想提。","“你包里那本东西，”她朝他的工具包抬了抬下巴，“拿出来。”","“你知道那本书？”","“你们这些外来的，都是被什么东西拽进来的。”她说，“你是被什么拽进来的？”","“一本书。”顾阙说，“书里夹着一张纸，写着我今晚的死期。顾阙，本县人，卒于……”","他说到“本县人”，停住了。","本县，是哪个县？","那本书的县名被刮掉了，他查了一下午，没查出来。可城门上那张凡例告示的纸，跟这本书是同一种竹纸。凡例被撕掉一条，这本书被刮掉县名。","“丁溪。”他说，“这本书，写的就是丁溪。”","“这个县里的东西，都缺一块。”宋氏说，“凡例缺第一条，榜上缺人，你这本书缺什么？”","顾阙想起来了。下午在修复室，他把这本书从头翻到尾，最后一叶和封底粘死了，浆糊老化，结成了硬块。硬揭会撕坏，他本来打算第二天用蒸汽慢慢揭。","“最后一叶。”他说，“粘在封底上了，还没揭。”","“缺的地方，就是要紧的地方。”宋氏说，“揭开。”","“这里没光，没水……”","“你有喷壶，我闻到了。”","顾阙没再争，把工具包摊在地上，摸出喷壶、骨刀和镊子。光太暗，几乎看不见纸面，他只能靠手摸。","他用指腹慢慢摸到最后一叶和封底粘连的边缘。纸很脆，浆糊老化以后结成了硬块。他轻轻喷了两下水，等，一，二，三，四，五。等浆糊软了，他用骨刀的刀尖贴着纸边，一点一点地往里探。","不能急。急了，纸就碎了。","她蹲在他对面，一声不吭，连呼吸都放轻了。","大概过了一刻钟，最后一叶整张揭了下来。","他把它平放在膝盖上，凑到窗前。","那是一张修志职名表。","古代修一部县志，要列一张表，写明这部书是谁主持编修的、谁编写的、谁校对的，就像现在一本书的版权页。这张表一般放在卷首，这部书的卷首缺了，表就被装在了书尾。这一页上，大部分名字都被刀刮掉了，只剩一道一道的刮痕。","只有一行没被刮。","“主修：顾阙。”","下面是年份：","“晏嘉宁七年。”","顾阙盯着那几个字。","他签过几千张修复记录单，落款都是这两个字。他写“阙”字，门字框里那一撇总是起笔太早。陈小满在照壁前面还笑过他，说跟急着出门似的。","这一行里的“阙”，那一撇也起得太早了。","是他的字。","本县人。他一直想不通的这三个字，原来是这个意思。他不是被这本书随手抓来的。这本书上，三百年前就有他的名字。","可嘉宁七年，就是照壁上那张榜的年份，就是这个县的人口变成零的那一年。","那是三百年前。","他抬起头。","宋氏蹲在他对面，盯着那张纸看了很久。然后，她慢慢抬起眼睛看向他。她脸上那副漫不经心的表情，一点一点地收了起来。","“你到底是谁？”她问。"]},{"id":"ch-1795214173111-0-0","title":"第9章 孤证","paragraphs":["样稿，用于确定文风，请勿直接发布","“顾阙。”他说，“多闻阙疑的阙。”","宋氏眨了眨眼：“什么疑？”","“《论语》里的话。多闻阙疑，慎言其余。”顾阙说，“意思是，要多听，拿不准的地方先空着，别乱说；剩下有把握的，也要小心地说。”","“谁给你起的？”","“我爸。”","他记得父亲说这话时的样子：坐在老房子的藤椅上，手里摇着一把蒲扇，说做人最要紧的，是知道自己哪里不知道。","宋氏看着他，忽然笑了一下：“那你爹起错了。你这个人，拿不准的事也要管。”","她低头又看了一眼那张职名表，把它推回给他：“收好。三百年前有人用你的字写了你的名字，我不知道是谁，也不知道为什么。但我知道一件事：主修，是能在这部志上写字的人。”","“写字？”","“写下去的，会成真。”","顾阙还没来得及问，楼梯响了。","吱呀。吱呀。","很慢，很重，一级一级地往上走。","宋氏的脸色一下子变了。她贴到门缝边往外看了一眼，又退回来，压低声音：“来收账的了。”","“收什么账？”","“喊了名字、却没人答应的，叫挂账。”她说得很快，“三更以后，喊声停了，差役就会挨间屋子来找挂账的人。被他们看见，你答不答应都没用，直接收走。”","“刚才你怎么不说？”","“说了你能睡得着？”","顾阙闭了一下眼睛。很好，他想，这个女人说话比他还噎人。","他凑到门缝边。","走廊尽头的楼梯口，上来了两个人。说是人，又不太像。他们穿着黑色的长褂，个子很高，高得要弯着腰才能过楼梯口。脸上没有五官，蒙着一张发黄的纸，纸上用墨写着一个大字：差。","一个手里提着锣，另一个捧着一本厚厚的册子。","他们走到第一间客房门口，捧册子的那个伸手推门。门是闩着的。他把纸脸贴到门板上，像是在闻，过了一会儿，门闩自己从里面滑开了。","两个差役走了进去，过了一会儿又出来，走向第二间。","“他们怎么知道哪间屋子有人？”顾阙问。","“凡例第二条，入夜闭户。”宋氏说，“这县里有人住的屋子，晚上门一定是关着的。门关着，就说明里面有人，他们就进去找。门开着的，就是空屋，他们看都不看。”","顾阙回头看了一眼杂物间的门。","关着的。","他伸手去拉。门把手像焊死了一样，纹丝不动。他又用肩膀去顶，门板连晃都不晃。","“没用。”宋氏说，“入了夜，这县里的门，关上了就只能关着。”","“你刚才不是一拨就开了？”","宋氏伸手推了一下门。门果然开了一条缝。她一松手，门又自己慢慢合了回去，咔哒一声，关得严严实实。","“看见了？我推得开，可这县里的东西不认我。”她说，“我一松手，它就当我没来过。想让门一直开着，得让这个县认账。”","她看着他手里的残志。","“你写它开，它就认。”","差役已经推开了第二间的门，就是大通铺那间。","顾阙从门缝里看过去。郝建国一下子站了起来，橡胶棍横在胸前，把陈小满挡在身后。陈小满缩在他背后，嘴唇在动，是在数数。贾三元整个人钻进了被子里，被子在发抖。裴照还坐在原地，背靠着墙，抬头看着那两张纸脸，一动不动。","捧册子的差役看了他们一圈，纸脸慢慢转动，像在数人头。","“四。”它说。声音又干又哑，像两张纸在互相摩擦。","册子翻了一页。","“少一个。”","“快。”宋氏抓住他的手腕，“怎么写，我告诉你。写下去的东西要有出处，就是证据。证据有三种：东西是物证，人说的是人证，书上写的是文证。三样都有，写下去的就永远是真的。”","“我现在一样都没有。”","“那就找一样。”她说，“只有一样证据的，叫孤证。”","顾阙知道这个词。古人做考据有个老规矩，叫“孤证不立”：只有一条证据，不能下结论。他做修复鉴定，也守这个规矩。","“孤证在这里也能写，”宋氏说，“但只管一炷香的工夫。而且，你要拿自己的一样东西垫上。”","“什么东西？”","“一段记忆。”她看着他，“哪一段，你自己挑不了。”","脚步声出了大通铺，往走廊这头来了。","顾阙蹲下来，盯着那扇门。","他是修书的，修书的人看东西，先看哪里坏了。","门板是老榆木的，没什么问题。门轴有点锈，也还好。他把目光移到门闩上，门闩插在门框的木槽里。他凑近看那个木槽，心跳一下子快了起来。","木槽烂了。","里面密密麻麻全是细小的虫眼，像一块被蛀空的海绵。门闩看着是插在里面的，其实底下早就空了，根本卡不住任何东西。","这扇门，本来就是关不严的。","“这算不算证据？”","宋氏凑过来看了一眼，点头：“物证。一样。”","“拿什么写？”","“用你那行死讯的墨。”她说，“它还没干。”","顾阙翻开残志，找到夹着死讯的那一页。那行字还泛着湿光。他咬了一下牙，伸出食指在“卒”字上抹了一下，指尖沾满了墨。","他在那页的空白处写字，一笔一画，写得很慢：","“安居客栈杂屋一间，门闩朽，夜不闭。”","最后一笔落下，指尖忽然一凉，像是有什么东西顺着手指被抽走了。","吱呀一声。","杂物间的门，自己开了。","不是被人推开的，是慢慢地、自己转开的，一直开到贴着墙才停下。","脚步声到了门口。","顾阙屏住呼吸，宋氏拽着他往墙角一缩，两个人挤在发霉的旧被子后面。","两个差役站在门口。","纸脸对着屋里，纸面上的那个“差”字微微鼓起又瘪下去，像是在呼吸。门开着，屋里黑着，扫帚和木桶歪在地上。","捧册子的差役停了很久。","顾阙听见自己的心跳，一下，一下，响得他怕被听见。","“空户。”纸脸说。","两个差役转过身，脚步声沿着走廊往回走，下了楼梯，越来越远。","过了不知道多久，那扇门忽然又慢慢地转了回来，咔哒一声，关上了。","一炷香到了。","顾阙靠着墙，一下子瘫坐在地上。","“写成了。”宋氏松开他，长长出了一口气，“你运气不错，第一次就写对了。”","“垫上的是什么？”顾阙问，“我拿什么换的？”","“你自己想想。”","他闭上眼睛，一样一样地想。修复室，闻老师，小葛，老王，那条土路，郝建国的饺子，周铎的本子。都在。","他又想起刚才跟宋氏说的那句话：多闻阙疑。是父亲给他起的名字。父亲坐在藤椅上，摇着蒲扇，说做人最要紧的，是知道自己哪里不知道。","他记得那把藤椅，记得那把蒲扇，记得父亲说过的每一个字。","可他想不起父亲的脸了。"]},{"id":"ch-1795214173113-0-0","title":"第10章 代价","paragraphs":["样稿，用于确定文风，请勿直接发布","天是一下子亮的。","和前一天一样，像有人把盖在县城上的黑布猛地扯掉，窗纸一眨眼就白了。","差役走后，顾阙再没合过眼。从后半夜到天亮，两个多时辰，他靠着杂物间的墙，一直在想父亲的脸。","他记得父亲个子不高，记得他左手有一道烫伤的疤，记得他笑起来会先咳嗽一声。这些都是“知道”，像一份档案上的记录。可他就是“看”不见那张脸。闭上眼，藤椅在，蒲扇在，藤椅上坐着的人，是一团模糊的影子。","他想起李商隐的两句诗：此情可待成追忆，只是当时已惘然。","意思是，这份感情，本该留到以后慢慢回忆；可就在当时，就已经恍恍惚惚，说不清楚了。","他以前一直觉得这两句太伤感，现在才知道，它写得一点都不夸张。","“走吧。”宋氏推开门，“天亮了，他们该想起你了。”","大通铺的门一开，四个人同时抬起头来。","陈小满第一个跳了起来。","“顾阙！”她扑过来，又在半步外刹住，脸一下子红了，眼圈也红了，“我、我昨天晚上……我们居然想把你推出去，我还躲在郝大哥后面看你，跟看鬼一样……对不起，我真的……”","“没事。”顾阙说，“你们不记得我，换我也会这样。”","郝建国挠着后脑勺，憋了半天才开口：“兄弟，昨晚那门……是我闩的。”","“我知道。”","“我那会儿真不知道你是谁。”他看了陈小满一眼，“我寻思着，屋里还有小满这丫头，万一门外那个不是人……”","“郝哥，你闩得对。”顾阙说，“换了别人站在门口，我也希望你闩上。”","郝建国眼眶一热，用力拍了拍他的肩膀，拍得他差点咳出来。","贾三元已经从被子里钻出来了，西装皱巴巴的，头发也乱了，脸上却又挂上了那种恰到好处的笑：“误会，都是误会。这地方的规矩太邪门了，大家都是身不由己嘛。”","顾阙看了他一眼。昨晚喊“把他推出去”喊得最响的，就是这个人。","他没说什么。","裴照没有过来。他坐在原来的位置，目光落在顾阙的右手上。","顾阙的食指上，还沾着一层干掉的墨。","“你写了。”裴照说。","不是问句。","屋里一下子安静了。","顾阙想了想，决定把事情说清楚。在这种地方，大家知道得越多，活下来的可能就越大。","他把昨晚的事一样一样讲了：被喊了名字却不答应，就会变成“挂账”；三更以后，脸上蒙着纸的差役会挨间屋子来收挂账的人；他们只进关着门的屋子，因为凡例规定有人住的屋子晚上必须关门，开着门的就是空屋。","然后他讲了那本残志，讲了“主修”，讲了他用死讯的墨，在书上写了一句“门闩朽，夜不闭”，那扇门就真的开了一炷香。","“写下去的会成真？”贾三元的眼睛亮了，“那你写一句‘我们都出去了’不就完了？”","“要有证据。”顾阙说，“证据越少，管的时间越短，代价越大。我只有一样证据，所以只管了一炷香，还要拿我自己的一段记忆去换。”","“换了啥？”郝建国问。","“我想不起我爸长什么样了。”","郝建国张着嘴，半天没合上。","“那、那以后可别乱写了。”他说，“记性这东西，丢一点少一点。”","“还有一件事。”顾阙犹豫了一下，“昨晚救我的人，现在就在这间屋子里。她姓宋，你们看不见她。”","四个人面面相觑。","陈小满小心翼翼地往他身边看了看，又看了看他，压低声音：“顾阙，你……你是不是吓着了？要不你先躺会儿？”","宋氏靠在门框上，笑得肩膀直抖：“你看，我说什么来着，没人信。”","“她在。”","裴照忽然开口。","他看着顾阙左边的空气，正好是宋氏站的位置。","“在你左边，靠着门。”","宋氏的笑一下子收住了。她盯着裴照，眼神变得很冷。","“你看得见她？”顾阙问。","“看不见。”裴照说，“但那里的空气，比别的地方凉。”","他说完就把目光移开了，好像刚才什么都没说。","众人下楼的时候，宋氏走在最后，跟顾阙并排。","“那个穿大衣的，你离他远点。”她低声说，“他不是普通人。”","“我知道。”顾阙说，“你呢？你又是什么人？”","“我早说了，活人。”","“那你为什么帮我？”","宋氏停下脚步，看着他。","“因为你是主修。这部志里有我，有我的名字。”她说，“你把这个县写回来，顺便把我的名字也找回来。”","“我只想出去。”","“这个县不写回来，你就出不去。”宋氏说，“你帮我找名字，我帮你活过今晚。这笔账，你不亏。”","顾阙想了几秒。","“成交。”","宋氏伸出手。顾阙握了一下，凉得像井水。","“丑话说前头，”她说，“你要是敢乱写我，我先把你从这本书里撕出去。”","“你打算怎么撕？”","“你可以试试。”","街上已经有人了，卖早点的、挑水的、扫地的，和昨天一模一样。","陈小满一出客栈的门就开始数步子。她说这是测绘的习惯，到一个新地方，每天都要把同一条路重新量一遍。","从客栈门口到照壁，昨天是三百一十二步。","她数到二百四十步的时候，就已经站在照壁前面了。","她愣在原地，又回头看了一眼来路。","“不对。”她的声音有点抖，“少了七十二步。中间少了一段。”","顾阙也回头看。","昨天这条街上，客栈和照壁之间，有一家铁匠铺、一家卖针线的小铺子，还有一排三户人家的院子。铁匠铺的炉子烧得很旺，打铁的声音一下一下，整条街都听得见。","现在，客栈的隔壁，直接就是照壁前的广场。","中间那一段，没了。没有废墟，没有空地，像是被人从纸上裁掉了一条，两头又严丝合缝地粘在了一起。","贾三元拦住一个挑水的汉子：“大哥，问一下，昨天这儿是不是有家铁匠铺？”","汉子奇怪地看着他：“什么铁匠铺？这儿一直就是这样啊。”","他说完，挑着水桶走了，一路上跟熟人点头打招呼：“那谁，早啊。”“他婶子，吃了没？”","顾阙抬头看照壁上那张大榜。","他翻开笔记本。第一天抄榜的那一页底下，有一行他自己补的小字，写得很急：“周铎投名后，口零变一。”","他不记得自己写过这一行。可现在，“口”字后面，又是一个“零”。","昨晚被喊走的不只是一个人，是一整条街。可整个县城，没有一个人觉得奇怪。"]},{"id":"ch-1795214173114-0-0","title":"第11章 七千","paragraphs":["样稿，用于确定文风，请勿直接发布","照壁前的台阶上，坐着一个小女孩。","七八岁的样子，梳着两个歪歪扭扭的小辫，穿一件改小了的大人褂子，袖子挽了好几道。她面前的石阶上摆着两堆小石子，一堆多，一堆少。","广场上每走过一个人，她就从多的那堆里拿一颗石子，放到少的那堆里。","一颗，一颗，又一颗。","陈小满在她旁边蹲了下来。","“你在数人？”","小女孩看了她一眼，没停手：“嗯。”","“我也爱数东西。”陈小满说，“我数步子。从客栈到这儿，昨天三百一十二步，今天两百四十步。”","小女孩的手停了一下。","她抬起头，第一次认真地看陈小满：“你也发现了？”","“发现什么？”","“少了。”小女孩说，“每天都在少。”","她叫阿七。问她为什么叫阿七，她说不知道，大家都这么叫，她就这么叫了。","顾阙在心里记了一笔。这县里的人互相不叫名字，可这个孩子有个名字。虽然只是个小名。","“你每天都数？”他问。","“每天早上都数。”阿七说，“这广场，一天里每个人都会走过一回。我数完一天，就知道县里还剩多少人。”","“还剩多少？”","阿七低头看了看那两堆石子，掰着手指头算了算：“前天是七千零五十二个。昨天是七千零三十九个，少了十三个。今天……”","她又拨了一颗石子过去。","“今天到现在，是六千九百八十七个。比昨天少了五十二个。”","郝建国倒吸了一口凉气：“少了五十二个，就没人觉得奇怪？”","“他们不记得。”阿七说，“我跟他们说，昨天卖针线的婶子不在了。他们问我，什么婶子？”","她说这话的时候，口气很平静，像是早就习惯了。","“那你怎么记得？”陈小满问。","“我不记名字。”阿七说，“我只记数。数是不会少的。”","顾阙心里一动。","名字会被喊走，被抹掉，可数字不会。“少了一个”这件事本身，没有名字可以喊。这孩子的笨办法，恰好躲过了这个县的规矩。","“晚上有人敲锣喊名字，”他问，“你怕不怕？”","“不怕。”阿七说，“我娘教过我。晚上有人叫，就把耳朵堵上，在心里数数，一直数到天亮。数着数着，就听不见了。”","陈小满愣了一下，看了顾阙一眼。她自己紧张的时候也数数，顾阙也是。","“你娘呢？”郝建国问。","阿七拨石子的手停了。","她想了很久，很认真地想，小眉头皱成一团。","“我娘是第四千三百零六个。”她说，“那天早上，我数到四千三百零五，就停了。”","她低下头，又开始拨石子，拨得比刚才快。","顾阙听懂了。那天早上，她娘没有从广场上走过。这个孩子记不得娘的名字，也记不得娘的脸，只记得娘是第几个。","郝建国转过脸去，看着别处，喉结上下滚了好几下。","贾三元也蹲了下来，难得地没有笑。","“小妹妹，”他问，“前天夜里少了十三个，昨天夜里少了五十二个，再往前呢？”","“再往前，一个都没少过。”阿七说，“我从会数数起，天天数，天天都是七千零五十二。是前天夜里才开始少的。”","顾阙在心里算了一下。前天夜里，正是他翻过修复室窗台的那一晚。","贾三元从西装内兜里掏出一支笔，在自己那张空白名片的背面飞快地写写算算。他做保险的，算数很快。","“十三，五十二。”他嘴里念叨着，“差不多每天翻四倍。照这个速度，今晚少两百多，明晚少八百多，后天晚上三千多……”","他的笔停住了，抬起头，脸色有点发白。","“大概第六天、第七天，这个县就一个人都不剩了。”","没人说话。","广场上，卖糖人的老头还在吆喝，挑水的汉子还在跟人打招呼。他们一个个从照壁前走过，阿七一颗一颗地拨着石子。","顾阙看着这些人，想起一句诗：年年岁岁花相似，岁岁年年人不同。","意思是，每一年开的花都差不多，可每一年来看花的人，都不一样了。","写这句诗的人，感慨的是人会老、会走。可在这个县，花还是那些花，街还是那些街，人却是一夜一夜地少下去，连看花的人自己都不知道。","“第七天。”陈小满小声说，“凡例上没写有几天。可周……那个本子上，有没有写？”","顾阙翻开周铎的本子。前面记着白沙渡和青石观的事，每一处后面都写着一个期限：白沙渡，五日；青石观，九日。","丁溪县这一页，期限那里是空的，后面画了一个问号。","“他也不知道。”顾阙说，“但贾三元算出来的，八九不离十。”","“账要平。”","裴照站在离他们几步远的地方，看着阿七那两堆石子。","“她在记账。”他说，“一堆是还在的，一堆是没了的。等多的那堆拨完，账就平了。”","阿七抬头看了他一眼，往陈小满身边缩了缩。","“那个哥哥好凶。”她小声说。","“他就那样，”陈小满揉揉她的脑袋，“其实……其实我也不知道他是不是好人。”","郝建国一直站在后面没说话。这时候他走过来，在阿七身边蹲下，拧开了保温桶。","“丫头，吃过早饭没？”","阿七看着桶里的饺子，摇了摇头。","郝建国拿了一个，又想了想，拿了两个，放在她手心里：“凉了，你将就吃。”","阿七捧着饺子，看了他好一会儿，小口小口地咬。","“好吃吗？”","“好吃。”","郝建国笑了，眼睛弯成一条缝，伸手想摸她的头，手伸到一半又缩了回去，在自己裤子上擦了擦。","“我闺女小时候，也这么吃东西。”他说。","宋氏一直站在顾阙身边。别人看不见她，她也不出声，只是看着阿七。","“这孩子，我见过。”她忽然说，声音很轻，“我每次走到这儿，她都坐在这个台阶上数。”","“每次？”顾阙低声问，“你来过很多次？”","宋氏没回答。","阿七吃完了饺子，舔了舔手指，把手在褂子上蹭干净，又开始拨石子。","拨着拨着，她抬起头，看着他们几个人，一个一个地看过去。","顾阙，陈小满，郝建国，贾三元，裴照。","她伸出小手指，一个一个地点了一遍，点完，皱起了眉头。","“哥哥。”她看着顾阙，“昨天你们是六个。”"]},{"id":"ch-1795214173116-0-0","title":"第12章 郝大哥","paragraphs":["样稿，用于确定文风，请勿直接发布","第二个晚上，他们早早回了客栈。","这一次，大家都知道要面对什么了。","顾阙把规矩又讲了一遍，讲得很慢，确保每个人都记住：天黑后有人沿街喊名字，被喊到的人，绝对不能答应；名字一被喊出来，旁边的人就会开始忘记他，所以喊到谁，谁旁边的人就伸手捂住他的嘴，不管认不认识他；熬过三更，喊声就停；可是没答应的人会变成“挂账”，四更天差役会上门来收。","“上回是顾阙落笔开了门，躲过去了。”陈小满说，“这回要是喊到别人呢？”","“我再写一次。”顾阙说。","“再写一次，你又得丢一段记性。”郝建国皱着眉，“上回丢的是你爹的脸，下回丢啥？丢你自己叫啥？”","顾阙没说话。他也不知道。","贾三元一直在翻周铎的本子。他做保险的，看条款很仔细，一页一页往下翻，翻到白沙渡那一部分，忽然停住了。","“这里有一条。”他指着一行小字念，“‘白沙渡夜点名。有人替应，应者去，被唤者留。’”","“什么意思？”郝建国问。","“替应，就是替别人答应。”顾阙接过本子看了一眼，“喊的是甲的名字，乙替他答了一声‘在’。那么走的是答应的乙，被喊的甲就留下来了。”","屋里安静了一会儿。","“也就是说，”贾三元慢慢地说，“喊到谁，只要有人肯替他答，他就没事。”","他说这话的时候，眼睛在屋里每个人脸上扫了一圈，最后低下头，把本子合上了。","没人接这个话。","“替应的人，”裴照忽然开口，“以后谁也想不起他。被他救下来的那个，也想不起。”","他坐在炕的另一头，脸朝着窗户，声音很淡。","“救了人，连个谢字都拿不到。”贾三元干笑了一声，“这买卖，谁做谁亏。”","郝建国瞪了他一眼，没吭声。","天黑了。","和前一晚一样，掌柜闩好了大门，叮嘱完不许点灯，就回了后屋。窗纸透进来一点灰白的光。宋氏靠在门边，抱着胳膊，她说她今晚就守在这儿。","郝建国坐在窗边，看着窗纸，忽然问了一句：“兄弟，你说这儿的月亮，跟咱们那儿的，是一个月亮吗？”","顾阙想了想：“露从今夜白，月是故乡明。”","“啥意思？”","“杜甫的诗。”顾阙说，“意思是，从今天晚上起，露水就变白了，天要凉了；月亮还是家乡的最亮。”","郝建国嘿嘿笑了一声：“这老杜，说得在理。我那儿的月亮，就挂在我闺女她们学校的楼顶上，比这儿亮多了。”","他拍了拍怀里的保温桶：“等出去了，我包一百个饺子，给我闺女送去，也给你们送。”","“我要两个。”陈小满说。","“给你包二十个。”","梆子响了第二遍，锣声来了。","“丁——溪——县——点——名——”","和昨晚一样，那个拖长的声音一户一户地往前走。这一晚喊的名字多了很多，一个接一个，几乎不停。每喊一个，远处就有一声“在”，然后就是死寂。","贾三元白天算过，今晚会少两百多个。","他缩在门边，每喊一个名字，他的肩膀就抖一下。喊过去的不是他，他就悄悄松一口气，松完又赶紧捂住自己的嘴，像是怕这口气也被人听见。","裴照还是那个姿势，背靠着墙，一动不动，只有眼睛在黑暗里亮着，看着屋里的每一个人。","锣声停在了客栈门口。","所有人都屏住了呼吸。","“陈——小——满——”","陈小满整个人一抖。","就在那一瞬间，顾阙感觉到了。像是脑子里有一块地方被橡皮轻轻擦了一下。他看着身边这个穿着白色羽绒服、扎着歪丸子头的女孩，知道她是谁，可那份“认识”正在一点点变淡，像一张褪色的照片。","他咬紧牙，在心里死死地抓住几个词：陈小满，测绘，数步子，兔子拖鞋。","郝建国坐得离她最近。","顾阙看见郝建国的眼神先是一愣，然后变得茫然。他看着陈小满，像是在看一个陌生人，眉头慢慢皱了起来。","可他的手，已经伸了出去，捂住了陈小满的嘴。","这是今天下午定好的规矩：喊到谁，谁旁边的人就捂住谁，不管认不认识。","“满满。”","楼下的声音变了，变成一个温柔的中年女人的声音。","“满满，妈妈来接你了。外面冷，你开开门。”","陈小满的眼泪一下子涌了出来。她在郝建国的手底下拼命地摇头，喉咙里发出呜呜的声音，身体却一点一点地往窗户那边挣。","“满满，你答应妈妈一声。”","“陈——小——满——”","两个声音交替着，一声比一声急。","宋氏在门边低声说：“不行。她撑不到三更，就算撑到了，四更差役来收挂账，这回他们会守在门口。上回顾阙躲过去了，他们记得。”","顾阙伸手去摸残志。","“你写什么？”宋氏一把按住他的手，“你连证据都没有。”","郝建国低头看着怀里这个哭得发抖的女孩。","他已经不记得她是谁了。顾阙看得出来，他眼睛里一点熟悉都没有了。","可他还是没松手。","“丫头。”郝建国开口了，声音很低，很哑，“我不记得你是谁了。”","陈小满在他手底下拼命摇头。","“可你跟我闺女，差不多大。”","他松开捂着她嘴的手，换成一把将她按进自己怀里，按得死死的，让她的脸贴着他的胸口，一个字也喊不出来。","然后他转过头，朝着窗户，用他这辈子最大的嗓门喊了一声：","“在！”","炕的另一头，裴照闭上了眼睛。","锣声停了。","楼下那个温柔的女人声音，也停了。","顾阙眨了一下眼睛。","窗边那个位置空着，正好能坐下一个人。","陈小满跪坐在炕上，怀里抱着一个不锈钢的保温桶，两层的，桶身上贴着一张褪了色的卡通贴纸。","她不知道这个桶是谁的。","可她抱着它，哭得浑身发抖，怎么也停不下来。"]},{"id":"ch-1795214173117-0-0","title":"第13章 保温桶","paragraphs":["样稿，用于确定文风，请勿直接发布","天亮的时候，陈小满还抱着那个保温桶。","她哭了大半夜，哭到后来没有声音了，只是抱着它，下巴搁在桶盖上，眼睛肿得睁不开。","“这是谁的？”她哑着嗓子问，“为什么我一看见它，就想哭？”","没有人答得上来。","顾阙看着炕边。窗户底下的地上，躺着一根黑色的橡胶棍，旁边是一个对讲机，红色的指示灯早就灭了。","他翻开自己的笔记本。","第一行，是他自己的字，金字旁挑得老长：","“郝建国，四十六岁，保安，保温桶里是韭菜鸡蛋饺子，女儿高三。”","他念了出来。","屋里一点声音都没有。","“保温桶……”陈小满低头看着怀里的东西，“韭菜鸡蛋饺子。”","她拧开桶盖。里面还剩七个饺子，凉透了，挤在一起。","贾三元盯着那行字看了很久，又翻开周铎的本子，翻到白沙渡那一页，把那一行指给大家看：","“有人替应，应者去，被唤者留。”","“昨晚喊的是陈小满。”贾三元说，声音有点发干，“她还在。那就说明，有人替她答了。”","陈小满整个人僵住了。","“是他。”她小声说，“是这个郝建国，替我答的。”","她说完这句，把脸埋进保温桶里，哭得比昨晚还厉害。","她不记得他是谁，不记得他长什么样，不记得他说过的任何一句话。她只知道，有一个叫郝建国的人，在她被喊名字的时候，替她喊了一声“在”。","顾阙想起苏轼写给亡妻的词：十年生死两茫茫。不思量，自难忘。","意思是，生死相隔已经十年，什么都看不清了；可是就算不去刻意想念，也自然而然忘不掉。","苏轼说的是“忘不掉”。可在这个县，连这都是奢侈的。他们想念一个人，却连想念的是谁都不知道。","“他最后说的话，我记得。”","宋氏站在门边。她的声音很轻，可顾阙听得清清楚楚。","“你记得？”顾阙转头看她，“你没忘？”","“我说过，我不在任何一本册子上。”她说，“这个县的规矩管不到我，所以我什么都忘不掉。前天晚上那个姓周的，那一整条街，还有昨晚的这个人，我全记得。”","她走到陈小满身边，蹲下来，虽然陈小满看不见她。","“你告诉她。”宋氏对顾阙说，“他最后说，丫头，我不记得你是谁了。可你跟我闺女，差不多大。”","顾阙把这句话，一字一字地转述给陈小满。","陈小满抬起头，眼泪挂在脸上，呆呆地看着顾阙身边那块空气，好像那里站着一个看不见的人。","“谢谢你。”她对着那块空气说，“谢谢你……还记得他。”","宋氏的手指动了一下，像是想替她擦眼泪，最后还是收了回去。","贾三元看着那块空气，第一次认真地朝那个方向点了点头：“宋……宋小姐。以后有什么事，您吩咐。”","顾阙知道他是怎么想的。一个能记住所有事的人，在这个县里，比什么都值钱。","宋氏翻了个白眼：“告诉他，少来这套。”","顾阙没转述这一句。","“那根棍子，”宋氏指了指地上，“让她拿着。”","“为什么？”","“答应了的人，留下的东西会变成别人的，这你知道。”宋氏说，“可要是一个人拼了命护着什么，他的东西里就会留下一点他的‘门’。”","“门？”","“县志是分门类的。地理归舆地门，打仗守城归兵防门，收税归赋役门，一门一门往下分。这部志里的人也一样，每个人身上都有一门。”她说，“这个人拼了命护人，他是兵防门的。他的棍子现在还记着他的门。拿着它的人，被喊名字的时候，能替你挡一次。”","“只能挡一次？”","“一次。挡完了，这根棍子就只是根棍子了。”","顾阙捡起橡胶棍，递给陈小满。","陈小满愣了一下，伸手接过来。棍子比看起来沉，握手的地方被磨得发亮，还留着一点体温似的温度。","她把它抱在怀里，和保温桶抱在一起。","过了一会儿，她拧开桶盖，把剩下的七个饺子拿出来，一人分了一个。顾阙一个，贾三元一个，她自己一个。裴照摇头，她就硬塞进他大衣口袋里。最后剩下三个，她找掌柜要了一张油纸，仔细包好。","“给阿七留着。”她说，“我觉得……他会这么做。”","没人问她为什么这么觉得。","“他没死。”顾阙说。","所有人都看向他。","“周铎、郝建国、那一整条街，都不是死了，是被销了。”顾阙说，“销账，就是把账上的一笔划掉。可是划掉的账，是能重新记上的。我是这部志的主修，等我们把这个县的账查清楚，我能把它写回来。把他们也写回来。”","他说这话的时候，自己也不知道有几分把握。可他看见陈小满的眼睛一点点亮了起来。","“前提是，我们得活到那一天。”贾三元说，“今天是第三天。还剩四个晚上。”","“最后一个晚上，”裴照说，“不会只是喊名字。”","他说完，又不说了。","陈小满擦干眼泪，从顾阙手里拿过笔记本，翻到郝建国那一行下面，用自己的字又工工整整地写了一遍：","“郝建国。替我答了一声‘在’。我不记得他长什么样，我记得他的饺子。”","然后，她把本子递给了贾三元。","贾三元接过来，犹豫了一下，在自己那一行下面添了很长一段：生日、住址、公司名字、手机号，写得满满当当，生怕少了一个字，以后就没人记得他了。","本子传到裴照面前。","裴照看了一眼，没接。","“我的，不用记。”","“为什么？”陈小满问。","裴照没回答。","最后，本子回到了顾阙手里。","宋氏凑过来看了一眼，说：“我的你也别写。”","“为什么？”","“你又没真的看清我。”她说，“没看清的东西，写下来就是错的。错的东西，写在这本子上，比不写还糟。”","顾阙把本子合上，揣进了贴身的口袋里。","从那天起，这个本子，就成了他们几个人的命。"]},{"id":"ch-1795214173118-0-0","title":"第14章 账房","paragraphs":["样稿，用于确定文风，请勿直接发布","“那个掌柜，你不觉得他知道得太多了吗？”","宋氏靠在楼梯扶手上，看着楼下柜台后面那个胖子。","顾阙站在她旁边：“哪里多？”","“第一天，他用算盘数你们，数到你就拨不上去。他知道你在账上是个死人。”宋氏说，“头一天晚上，差役来了，他在楼下说‘住了五位’，一个不多一个不少。这县里谁都不记得少了人，就他记得。”","顾阙想了想：“他在记账。”","“对。”","“那就去问问他。”","陈小满从屋里探出头来：“问谁？我也去！”","“我也去。”贾三元整了整皱巴巴的西装领子，“跟人谈条件，我比你们在行。”","裴照没说话，跟在最后面下了楼。","掌柜还在打算盘，噼里啪啦。看见他们过来，他抬起头，笑得眼睛眯成一条缝。","“几位客官，起得早。”","“掌柜的，”顾阙说，“想跟你打听点事。”","“客官请讲。”","“这县里，每天晚上少多少人？”","算盘声停了。","掌柜脸上的笑一点没变：“客官说笑了。小店只管住店，不管人数。”","“你那天晚上跟差役说，我们住了五位。”","“客官记性好。”","“你还拨了一颗珠子，数我算不算人。”","“小店做生意，总得把客人数清楚嘛。”","他每句话都接得滴水不漏。","贾三元往前凑了一步，换上他那副谈业务的笑脸：“掌柜的，咱们明人不说暗话。您要什么条件，开个价。”","“客官要买什么？”","“消息。”","“小店不卖消息。”掌柜笑眯眯地说，“小店只认账。”","“那您这儿有什么账？”","“住店的账。”","贾三元碰了个软钉子，退了回来，冲顾阙摇摇头。","顾阙没再问话。他的目光落在掌柜手底下那把算盘上。","黑檀木的框，珠子磨得发亮。框子侧面靠下的地方，刻着几个很小的字，被手摸了太多年，几乎平了。","“掌柜的，你这算盘能借我看看吗？”","“客官要算账？”","“我是修旧东西的。”顾阙说，“看见老物件，手痒。”","掌柜犹豫了一下，把算盘推了过来。","顾阙把算盘侧过来，对着门口的光，用指甲轻轻刮了刮那几个字缝里的黑垢。","字露出来了。","“丁溪县署，簿书房。”","他念出声来。","陈小满凑过来看：“簿书房是什么？”","“县衙里管户口册、管账的地方。”顾阙说，“在那儿干活的小吏，就叫簿书。”","他抬起头看着掌柜：“这把算盘，是县衙的公物。你不是掌柜，你是当年县衙的簿书。”","柜台后面安静了很久。","掌柜脸上的笑，终于慢慢收了起来。没了笑，他那张圆脸看起来一下子老了十岁。","“客官好眼力。”他说。","“你为什么在这儿开客栈？”","“县衙里不需要簿书了。”掌柜说，“册上一个人都没有，还要簿书干什么？我就出来，找了个地方，接着记账。”","“记谁的账？”","“记这个县的账。”","裴照在后面开口了：“账，是谁做的？”","掌柜看了他一眼，眼神闪了一下：“做账的人，不在账上。”","“那就是不肯说。”裴照说。","“是不能说。”掌柜说，“说了，小店就开不下去了。”","顾阙把算盘推了回去：“那你能给我们看什么？”","掌柜盯着他看，像在掂量什么。","“客官姓顾。”他慢慢地说，“那天晚上，差役喊了你的名字，喊的是‘顾阙’。我在楼下听见了。”","“是。”","“县里有一本书，书的最后一页，写着主修的名字。”掌柜说，“我当簿书那几年，见过那一页。上面也写着‘顾阙’。”","宋氏在顾阙耳边轻轻吸了一口气。","“簿书只认账，账不能乱给人看。”掌柜说，“可主修不一样。主修是修这部志的人，账，本来就该给主修看。”","他弯下腰，从柜台最底下摸出一本很厚的账簿。封皮是蓝布的，边角磨烂了，用麻绳捆了好几道。","他解开麻绳，翻到最后几页，转过来，推到顾阙面前。","“客官自己看吧。”","账页上的字是工工整整的小楷，一行一行：","“丁溪县，嘉宁七年，编审丁口。","册载：零。","实有：七千零五十二。","差：七千零五十二。","应销：七千零五十二。","已销：二百八十。","余：六千七百七十二。”","陈小满一个字一个字地念完，声音越来越小。","“二百八十……”她说，“是这三天晚上没了的人。”","贾三元的脸色也变了：“已销，余……这不就是在算还剩几个人没被销吗？”","“这不是住店的账。”顾阙说，“这是销人的账。”","掌柜没否认。","“那我们呢？”贾三元盯着账页，“我们几个，算在这七千里头吗？”","“客官们不是本县的人，记不进这本。”掌柜说，“客官们是外账。”","他又从柜台底下抽出一张对折的黄纸，打开。纸上只有三行字：","“外账：六。","已销：二。","余：四。”","“二……”陈小满喃喃地说，“一个是周铎，一个是郝建国。”","“余四。”贾三元的声音发紧，“我们四个。”","四个：顾阙、陈小满、贾三元、裴照。","顾阙本来是账上的死人。第一天他亲口说了一句“我算一个人”，掌柜那颗珠子才拨上去。从那一刻起，他就被记进了这本外账。","宋氏在他耳边轻声说：“你那句话，人家记得比你还清楚。”","顾阙的手指顺着账页往下移，停在最后一行。","那一行有几个字缺了，纸上留着几个不规则的小洞，边缘毛毛糙糙的，像是被什么东西一口一口啃掉的。","“这里怎么了？”","“虫吃的。”掌柜说，“老账本了，总有虫。被虫吃掉的字，补不回来。”","“补不回来？”顾阙是修书的，他知道虫蛀的纸是能补的，“纸能补，字也能照着上下文补上。”","“客官，”掌柜看着他，“被这种虫吃掉的字，谁都想不起来原来写的是什么。我想不起来，县令也想不起来。补，拿什么补？”","顾阙低头又看了一眼那几个小洞。","他想起客栈杂物间那根门闩，木槽里也是这样密密麻麻的小洞。","他没再追问。","缺字后面，只剩最后几个字没被啃掉，墨色很新，像是今天早上才添上去的：","“限七日。余四日。”","“限什么？”陈小满问。","“限账平。”掌柜说，“七日之内，上头这一栏，跟下头这一栏，要对得上。”","上头一栏，是册上的零。下头一栏，是还活着的人。","贾三元掰着指头算了一遍，没算出声，脸先白了。“还剩四个晚上。”他说，“跟我算的一样。”","“这墨怎么是新的？”顾阙指着那行字，“谁添的？”","掌柜笑眯眯的，跟平时一样。","“账自己长的。”他说，“每天天一亮，这一行就重写一回。昨天早上，写的是余五日。”"]},{"id":"ch-1795214173119-0-0","title":"第15章 对账","paragraphs":["样稿，用于确定文风，请勿直接发布","回到楼上，顾阙把那页账抄在了笔记本上，摊在桌子中间。","“我们把这笔账从头捋一遍。”他说，“小满，你先说，照壁上那张榜写的是什么？”","“户零，口零。”陈小满说，“官府的册子上，这个县一个人都没有。”","“账本上呢？”","“实有七千零五十二。”","“一边是零，一边是七千。”顾阙说，“差出来这七千，就是一笔错账。”","贾三元抱着胳膊：“这我听懂了。问题是，为什么会有这笔错账？好端端一个县，怎么就报成零了？”","“丁口，是收人头税用的。”顾阙说，“古代官府按人头收税，叫丁税。册上记了多少人，就要交多少份税。”","“所以……”陈小满眨了眨眼，“报成零，就一分钱税都不用交了？”","“对。”","“这也太敢了吧？”","宋氏靠在窗边，忽然开口：“那年没下雨。”","顾阙转头看她。","“我记得。”宋氏的声音很轻，“那一年，一整个夏天都没下雨。地里的苗全干死了，井也干了。可是丁税一文钱都不能少。交不上的，男人抓去服役，女人和孩子卖掉抵税。”","“你怎么记得？”顾阙低声问。","宋氏没有回答。","陈小满看看顾阙，又看看他旁边那块空气：“她……说什么了？”","顾阙把宋氏的话转述了一遍。","屋里静了一会儿。","“我想起一篇古文。”顾阙说，“柳宗元写的《捕蛇者说》。里面有个人，祖孙三代都去山里抓一种剧毒的蛇，因为抓到蛇能抵税。爷爷被蛇咬死了，爹也被蛇咬死了，他还是要去抓。”","“为什么？”陈小满问。","“因为不抓蛇，就得交税。交税比被蛇咬还可怕。”顾阙说，“文章最后有一句：孰知赋敛之毒有甚是蛇者乎。意思是，谁知道苛捐杂税的毒，比这种毒蛇还厉害呢？”","贾三元没说话，低头摆弄着他那张空白名片。","“所以那个县令，是为了救人？”陈小满问。","“一开始可能是。”顾阙说，“报个零，全县的人头税就免了，那一年就熬过去了。”","“那后来呢？”","“后来，册子上一直是零。”","宋氏接过话头：“在这部志里，写下来的才算数。册上说这个县没有人，那这个县，就不该有人。”","顾阙把这句话也转述了。","贾三元的脸一下子白了：“你是说，这个县……在自己纠错？”","“对。”顾阙在笔记本上画了一条线，“册上是零，实际有七千。这部志要把账对平，有两个办法：要么把册上的零改成七千，要么把这七千个人销成零。”","“它选了第二个。”裴照说。","他一直坐在角落里，到这会儿才开口。","“每天晚上点名，答应的就销掉一个。”顾阙说，“账本上写着已销两百八十，余六千七百七十二。周铎投名那天，官榜上的零变成了一，当天晚上他就被销了，第二天官榜又变回了零。都对得上。”","“限期七日。”陈小满喃喃地说，“第七天，销完了，就……”","“账平了。”顾阙说，“全县归零。”","“那我们呢？”贾三元的声音有点抖，“我们是外账，外账也要平吧？”","“外账余四。”顾阙说，“就是我们四个。”","屋里谁都没再出声。","过了好一会儿，陈小满小声问：“那反过来呢？刚才你说的第一个办法，把册上的零改成七千？”","“这就是我们要干的事。”顾阙说，“我是主修，我能往这部志上写字。只要我能证明这个县真的有七千零五十二个人，把这个数写上去，账就平了，用不着再销任何人。”","“那就写啊！”","“要证据。”顾阙说，“上次那扇门，我只有一样证据，只管了一炷香。七千个人，一炷香不够。我需要三样证据：真实的户口册，这是文证；实打实的东西，这是物证；还要有人亲眼见过、站出来作证，这是人证。三样齐了，写下去，就永远是真的。”","“真实的户口册……”陈小满皱起眉头，“上哪儿找？”","门外有人敲了两下。","是掌柜。他端着一壶茶站在门口，脸上又挂上了那种笑眯眯的表情。","“几位客官，喝口茶。”","他把茶壶放在桌上，没走，眼睛落在顾阙摊开的笔记本上。","“簿书造册，从来都造两本。”他像是在自言自语，“一本往上报，写的是县太爷想让上面看见的数。一本留底，写的是实数。”","顾阙一下子抬起头：“留底那本在哪儿？”","“县衙后堂，东边那面墙，是夹墙。”掌柜说，“县太爷亲手砌进去的。”","“你为什么告诉我们？”","掌柜沉默了一下。","“账要清。”他说，“假账做了三百年。我这个当簿书的，三百年没睡过一个踏实觉。”","裴照开口了：“县令还在吗？”","掌柜看了他一眼。","“在。”他说，“天黑了，他就出来坐堂。”","说完，他笑了笑，退出门去，轻轻带上了门。","贾三元第一个站起来，拍了拍西装上的灰：“那我去广场一趟，找阿七问问今天的数。多知道一点总没坏处。天黑前回来。”","他说完就下楼了，走得很快。","陈小满看着门口：“他今天怎么这么积极？”","没人回答她。","她转过头，盯着顾阙旁边那块空气看了一会儿，忽然小声问：“顾阙，宋姐姐……长什么样啊？”","顾阙愣了一下：“问这个干什么？”","“我天天跟一个看不见的人待在一个屋里，总得知道她长什么样吧。”","顾阙想了想：“个子不高。眉毛很淡。说话很冲。”","宋氏在他旁边冷笑了一声：“你就不会说一句好看？”","“她让我说好看。”顾阙面无表情地转述。","陈小满“噗”地笑出了声，这是她两天来第一次笑：“眉毛淡，说话冲……那跟你挺配的。”","“配什么？”","“没什么。”陈小满憋着笑，低头去倒茶。","宋氏把脸扭向窗外，好半天没说话。顾阙看见她的耳朵尖，红了一点点。","顾阙低头看笔记本上那条线。一头写着“零”，一头写着“七千零五十二”。","他在线的中间，写下了三个字：","夹墙后。"]},{"id":"ch-1795214173121-0-0","title":"第16章 夹墙","paragraphs":["样稿，用于确定文风，请勿直接发布","太阳落山之前，贾三元还没回来。","陈小满趴在窗口往广场上看，看了好几遍：“阿七还在台阶上数石子，可贾三元不在她旁边。他说去找阿七的。”","“他不会回来了。”裴照说，“至少今晚不会。”","“你怎么知道？”","裴照没回答。","顾阙把工具包背好，残志塞进贴身的口袋：“我和宋氏去县衙。你们俩留在这儿。”","“晚上出门？”陈小满急了，“凡例说入夜闭户！门打不开的！”","“她打得开。”顾阙看了一眼身边，“她推门，门会开；她一松手，门就自己关上。只要我跟紧她，就能出去。”","陈小满咬着嘴唇，把怀里的橡胶棍抱紧了：“那你们一定要回来。”","“棍子你拿好。”顾阙说，“今晚要是喊到你，它能替你挡一次。挡完了，就靠你自己数数了。”","“我知道。”","她又转头看裴照：“你……会保护我吧？”","裴照看了她一眼：“我会看着你。”","“这算什么回答……”","天黑了。","宋氏走在前面，推开房门，顾阙跟着侧身出去，门在他背后咔哒一声合上。下楼，客栈大门，也是一样。","街上一点光都没有。只有路面泛着一层灰白，和第一天晚上那条土路一样。","远处，锣声已经响了。","“丁——溪——县——点——名——”","“在东边。”宋氏低声说，“我们往西绕。”","两个人贴着墙根走，走得很快。","“你说的残影，”顾阙压低声音，“到底是什么？”","“被刮掉的字，被改掉的字，不会一下子没干净。”宋氏说，“它们会在原地留个影子，像墨渗进了纸背面。人也一样。一个地方发生过的事，被抹掉了，影子还在。我看得见影子。”","“看了有什么代价？”","宋氏顿了一下：“眼睛发涩。”","“就这样？”","“就这样。”","县衙的大门半开着。","不对，顾阙想，入夜闭户，整个县的门晚上都是关着的，只有这扇是开的。","“这是县令的地方。”宋氏说，“县里的规矩，管别人，不管他。”","他们没走正门，从侧边一道小门进去。穿过一条窄窄的夹道，经过正堂的后窗时，顾阙停住了。","正堂里点着一盏灯。","这是三天来，他在这个县里见到的第一盏灯。","灯下坐着一个穿官服的老人，背对着窗户，面前摊着一本厚册子。他手里拿着一支朱笔，慢慢地念：","“王四喜。”","隔了一会儿，远处的锣声跟着响起来，那个拖长的声音喊：","“王——四——喜——”","更远的地方，传来一声：“在。”","老人提起朱笔，在册子上轻轻划了一道。","“刘张氏。”","“刘——张——氏——”","“在。”","又是一道。","顾阙的后背一阵发凉。","“喊名字的不是差役。”他用气声说，“是他。他念一个，差役就去喊一个。答应了，他就划掉一个。”","“那就是杜明堂。”宋氏的声音冷得像冰，“县令。”","“他在销账。”","“走。”宋氏拽了他一把，“别让他看见你。他要是念到你的名字，就不用等差役了。”","后堂比正堂小，里面堆着破旧的桌椅，灰积了很厚。","宋氏一进门就停住了。她站在屋子中间，眼睛慢慢睁大，像在看一出只有她能看见的戏。","“你看见什么了？”顾阙问。","“三个人。”宋氏说，“一个穿官服的，就是外面那个，那时候还没这么老。一个小吏，胖胖的，手里拿着算盘。”","“掌柜。”","“对。还有一个……”她顿了顿，“穿青衫的年轻人，坐在桌边，手里拿着笔。”","“他们在干什么？”","“穿官服的在说话。他说：写零。小吏的手在抖，算盘都拿不稳。他又说了一遍：写零，出了事我担着。”","“那个拿笔的呢？”","“他写了。”宋氏说，“写完，又在最后一页落了自己的名字。然后把笔一扔，站起来就走了。”","“你看得清他的脸吗？”","宋氏摇了摇头。","“看不清。可是他落名的时候……”她转过头，看着顾阙，“他写‘阙’字，门字框里那一撇，起笔太早了。”","顾阙站在原地，很久都没动。","他想起杜牧的两句诗：折戟沉沙铁未销，自将磨洗认前朝。","意思是，一支断掉的戟埋在沙子里，铁还没有烂掉；我把它捡起来磨洗干净，认出了这是前朝的东西。","他修了七年古籍，干的就是“磨洗认前朝”的活。可他从来没想过，有一天，他会从三百年前的灰里，认出自己的笔迹。","“顾阙。”宋氏叫他。","他回过神来。宋氏正揉着眼睛，眼眶有点红。","“你眼睛怎么了？”","“说了，发涩。”她放下手，“看完了。走，去东墙。”","借着窗纸透进来的那点灰光，顾阙看见她的眼白上，好像有一个很小的黑点，像宣纸上溅了一滴墨。","他眨了一下眼，再看，又好像没有。","东边那面墙，看起来和别的墙没什么两样。","顾阙沿着墙一路敲过去，敲到中间，声音变了，从实的变成了空的。","“就是这儿。”","他蹲下来，用手指去摸砖缝。","砖缝里的灰泥是松的。","不是老化的松，是被人撬开过，又随手塞回去的松。几块砖歪歪扭扭地垒着，最下面一块甚至没塞严，露出一道黑洞洞的缝。","“有人动过。”顾阙说。","“什么时候？”","顾阙低头看地面。","后堂的地上积着很厚的灰，他们俩进来时踩出了一串脚印。可在墙根底下，还有另一串脚印，从侧门一直走到这面墙前，就断了，没有往回走的。","脚印很新，灰被踩出了清清楚楚的边。","那是皮鞋印。鞋尖很窄，前脚掌踩得深，后跟几乎没有落地。走路的人是踮着脚的，生怕弄脏了鞋。","“这县里穿皮鞋的，有两个。”宋氏说。","“裴照的鞋，从第一天起就一点泥都不沾。”顾阙说，“他走过的地方，不留脚印。”","他站起来，看着那串踮着脚的鞋印，一直延伸到夹墙跟前。","“只剩下一个人了。”"]},{"id":"ch-1795214173122-0-0","title":"第17章 贾三元","paragraphs":["样稿，用于确定文风，请勿直接发布","“贾三元。”顾阙对着那道砖缝说，“出来吧。”","墙里面没有声音。","“你的鞋印一直走到这儿，没有往回走。”顾阙说，“你还在里面。”","过了好一会儿，砖缝里亮起了一点白光。是手机屏幕的光。","“凡例第二条，不得燃灯。”顾阙说，“你胆子真大。”","“手机不算灯。”贾三元的声音从墙里传出来，闷闷的，“我试过了。”","几块松动的砖被从里面推开，掉在地上。夹墙里面是一个很窄的暗格，只够一个人侧身站着。贾三元就挤在里面，西装上全是灰，怀里抱着一本很厚的册子。","册子的封皮是黄色的，上面写着四个字：丁口实册。","“你找到了。”顾阙说。","“下午就找到了。”贾三元说，“掌柜早上那话，我听见了。我想，与其天黑了你们来，不如我先来。”","“为什么不拿回客栈？”","贾三元笑了一下。不是他平时那种谈业务的笑，是一种很累的笑。","“我拿着它刚要走，天就黑了。正堂里有人跟我说话。”","“县令？”","“对。”贾三元说，“天一黑，他就坐在那儿了，隔着墙跟我说话。声音不大，可每个字都钻进耳朵里。”","“他说了什么？”","“他说，入了他的册、站在他那边的人，他不念。”贾三元说，“他只要一样东西。”","顾阙已经猜到了：“我的笔记本。”","“对。”贾三元看着他，“上面有我们每个人的名字、年纪、长相、干什么的。有了它，他就能把我们一个一个念出来。”","宋氏在顾阙身后冷笑了一声。","“你就答应了？”顾阙问。","“我还没答应。”贾三元说，“我在这儿等你们，就是想跟你谈一笔买卖。”","“什么买卖？”","“你要文证，我手里有。”贾三元拍了拍怀里的丁口实册，“我要活命，你手里有。你把笔记本给我，我把这本册子给你。两全其美。”","“我把笔记本给你，你拿去给县令。”顾阙说，“然后他照着本子，把小满、裴照、我，一个一个念掉。”","“你是主修，”贾三元说，“你有这本册子，就能把整个县写回来，到时候大家都能回来，对吧？你自己说的，销掉的账能重新记上。”","“前提是我活着写完。”","“那就是你的事了。”","顾阙看着他。","“你算过吧。”他说，“跟着我们，活下来的几率有多少？”","贾三元沉默了一下：“不到一成。”","“跟着县令呢？”","“五成。”贾三元说，“他说话算不算数，我不知道。可五成总比一成多。”","“小满今天早上还给你分了个饺子。”","贾三元的脸抽动了一下。","“我知道。”他说，“我吃了。挺好吃的。”","他低下头，又抬起来：“顾阙，我卖了十年保险。我这辈子学会的最重要的一件事，就是人活着，得先算清楚自己的账。我不是坏人，我只是不想死在这儿。”","顾阙想起一句老话：画虎画皮难画骨，知人知面不知心。","意思是，画老虎，能画出它的皮毛，画不出它的骨头；认识一个人，能看清他的脸，看不清他的心。","可是这一刻，他觉得自己看清了。贾三元的心不黑，也不白，就是一本算得清清楚楚的账。","“笔记本，我不会给你。”顾阙说，“还有，你想清楚。入了县令的册，你就成了本县丁口。”","“那又怎么样？”","“周铎也是这么入的册。”顾阙说，“凡例第三条，入册者，官唤其名，应之即安。他照着做了，那天晚上就没了。官榜上的零变成一，第二天又变回零。”","“周铎是自己跑去投名的。”贾三元说，“我是跟县令谈了条件的。不一样。”","“哪里不一样？”","“他是白送上门，我是有筹码的。”贾三元拍了拍丁口实册，“这本册子，县令藏了三百年，现在在我手里。他想要回去，就得跟我谈。”","“他要是不跟你谈呢？”","“那他就永远拿不回这本册子。”","“你的名字，”宋氏在顾阙身边冷冷地说，“只要入了他的册，就是他手里的一根绳子。他什么时候想拽，就什么时候拽。”","顾阙把这句话转述了。","贾三元的嘴唇动了动，没说出话来。他低头看着怀里的册子，像是在重新算一笔账。","可是算了很久，他还是抬起了头。","“五成。”他说，“还是比一成多。”","他又看了顾阙一眼。","“好。”他说，“那我自己去谈。”","他抱紧丁口实册，从暗格里挤出来，转身就往侧门走。","“站住。”顾阙说。","“你拦得住我？”贾三元头也不回，“你又不能打人，你连那个棍子都没带。”","他说得没错。","可是贾三元走了还不到三步，怀里的丁口实册忽然往外一抽。","就像有一只看不见的手，从他怀里抓住了册子，用力往外拽。","“谁？！”贾三元死死抱住册子，整个人往后一缩，手机的光乱晃，“谁在这儿？”","册子停在半空，被两股力气扯着。","宋氏咬着牙，两只手抓着册子的另一头。","“松手！”她骂了一句。","贾三元听不见她，可他看着那本悬在半空、被什么东西往外扯的册子，脸一下子白透了。","“是她？”他声音都变了，“那个姓宋的？她在这儿？”","“把册子给我。”顾阙说。","“不可能！”","贾三元猛地一拽，抱着册子往后一倒，后背撞在墙上，宋氏手一滑，册子被他抢了回去。","他连滚带爬地冲向侧门。","“顾阙，我跟你不一样！”他边跑边喊，声音在空荡荡的后堂里回响，“你是主修，你是要写书的人！我就是个卖保险的，我就想活着回去！”","侧门在他身后晃了两下。","宋氏追了两步，停下来，揉着被册角刮破的手背：“这个人，跑得还挺快。”","顾阙没动。","他听见了，夹道那头，正堂的方向，传来一个苍老的声音。","不大，可每个字都清清楚楚，像是直接钻进了耳朵里：","“进来。”","脚步声停了一下。","然后，皮鞋踩在石板上的声音，一步一步，走进了正堂。"]},{"id":"ch-1795214173123-0-0","title":"第18章 丁册","paragraphs":["样稿，用于确定文风，请勿直接发布","正堂的后窗糊着一层薄纸，被灯光照得发黄。","顾阙用指甲在窗纸角上轻轻戳了一个小洞，凑上去看。","灯下坐着那个穿官服的老人。离近了看，他的官服已经褪了色，补子上的绣线都起了毛。他的脸很瘦，眼窝很深，看起来不像什么恶人，倒像一个很久没睡过觉的老学究。","贾三元站在他面前，抱着丁口实册，腰弯得很低。","“县太爷。”贾三元说，“东西我带来了。”","“放下。”杜明堂说。","贾三元把册子放在桌上，往前推了推，手没松开：“您答应我的事……”","“你叫什么？”","贾三元犹豫了一下。","“贾三元。”","杜明堂提起一支笔。不是那支朱笔，是一支蘸了黑墨的笔。他翻开面前那本册子，在空白的地方，一笔一画地写下了三个字。","顾阙知道那是什么意思。黑笔是记上，朱笔是划掉。","照壁上那张榜，“口”字后面的零，这时候应该又变成一了。","“现在，你是本县丁口了。”杜明堂说。","“您答应过，入了您的册，您就不念我。”","“我不念你。”杜明堂说，“只要你听话。”","贾三元的手抖了一下。","“主修那个本子呢？”","“他……他不肯给。”贾三元赶紧说，“可是我知道他放在哪儿，我能拿到。”","“拿来。”杜明堂说，“拿来了，你就是本县的良民。拿不来……”","他没往下说，只是用笔杆在册子上那三个字旁边，轻轻点了一下。","贾三元的腿一软，差点跪下去。","窗外，宋氏一把抓住顾阙的胳膊，压低声音：“他要烧册子。”","杜明堂已经把丁口实册拿了起来，一页一页地翻，翻得很慢，像在看一本很久没见的老朋友写的信。翻了一会儿，他合上册子，把它往桌角那盏灯的火苗上凑过去。","“这本东西，”他说，“三百年前就该烧了。”","“我去拿。”宋氏说，“他看不见我。”","“他要是喊你呢？”","“他喊什么？我连名字都没有。”宋氏说，“倒是你，在外面别出声。”","她说完，人已经从窗边消失了。","顾阙趴在小洞上，屏住呼吸。","正堂的门轻轻开了一条缝，又合上。贾三元回头看了一眼，什么都没看见。","册子的一角已经凑到了火苗边，纸边微微卷起来，发黄发黑。","就在这时，册子从杜明堂手里飞了出去。","不是掉下去，是被什么东西猛地抽走，在半空中划了一道弧线，直奔门口。","贾三元吓得往后一跳，撞翻了一张椅子。","杜明堂没有动。","他坐在椅子上，看着那本悬在门口、微微晃动的册子，看了很久。","“宋家的丫头。”他慢慢地说，“三百年了，你还在。”","册子在半空停了一瞬。","然后，门被猛地撞开，册子飞了出去。","杜明堂没有追，也没有喊差役。他只是坐在灯下，朝着门外的黑暗说了一句话，声音不大，却清清楚楚地传进了顾阙的耳朵里：","“拿走吧。少了人证，这本册子，就是一堆废纸。”","顾阙一路跑回客栈，宋氏抱着册子跑在前面，推开一道道门，他在门合上之前侧身挤过去。远处的锣声，早就停了。","大通铺的门一开，陈小满就扑了过来。","“顾阙！你们回来了！”她把橡胶棍抱在怀里，“今晚锣只响了一小会儿，就停了！一个都没喊！”","“县令今晚忙着别的事。”顾阙说。","裴照坐在原来的位置，看了一眼那本黄皮的册子，又看了一眼顾阙。","“贾三元呢？”","“他不回来了。”顾阙说。","陈小满愣住了。过了一会儿，她低下头，小声说：“我早上还给了他一个饺子。”","后半夜，其他人都靠着墙睡着了。顾阙坐在窗边，宋氏站在他旁边。","“县令叫你宋家的丫头。”顾阙说，“你认识他？”","“这县里的每一个人，我都认识。”","“他也认识你。”","“认识我的人多了。”宋氏说，“只是他们都忘了。他没忘。”","“为什么？”","宋氏没回答。","过了一会儿，她说：“顾阙，你知道被人记住是什么感觉吗？”","“什么感觉？”","“我也不知道了。”她说，“三百年了，第一个叫出我姓的人，是那个老东西。”","她的声音很轻，听不出是在笑还是在难过。","顾阙想说点什么，可想了半天，一个字也没想出来。他只好说：“天亮了，我帮你找。”","“找什么？”","“找你的名字。”顾阙说，“这是我们说好的。”","宋氏看了他一眼，把脸转向窗外。","“随你。”","天亮之后，四个人围着桌子，一页一页地翻那本丁口实册。","册子很厚，纸是好纸，字是工工整整的小楷，一户一行：户主叫什么，家里几口人，男丁几个，住在哪条街。","陈小满拿着笔，一页一页地加：“三十七，四十二，五十……”","翻到最后，她放下笔，抬起头。","“七千零五十二。”她说，“一个不差。”","“文证。”顾阙说，“我们有了。”","陈小满长长地出了一口气，眼睛亮亮的：“那离三证齐全，就还差两样了！”","顾阙没说话。他又从头翻了一遍，这一次，他只看姓宋的人家。","宋大有，一户五口。宋二，一户三口。宋王氏，寡居，一口。宋家铺子，一户七口……","他一个一个看过去，没有一个能让他确定，是她。","宋氏靠在窗边，没有看册子。她看着窗外，好像对这本书一点兴趣都没有。","顾阙想起《诗经》里那首《蒹葭》：所谓伊人，在水一方。","意思是，我想念的那个人，就在河水的另一边。看得见，却怎么也走不到她身边。","他一直在找她的名字，她就站在离他三步远的地方，可他就是找不到。","他翻到了册子的最后一页。","最后一户人家下面，还有一行字。字写得比前面都小，墨色也淡，像是有人后来补上去的，补得很犹豫：","“宋氏，失其名。”"]},{"id":"ch-1795214173124-0-0","title":"第19章 失其名","paragraphs":["样稿，用于确定文风，请勿直接发布","“宋氏，失其名。”","陈小满把这五个字念了两遍，抬起头：“宋姐姐……在这本册子里？”","没人回答她。","顾阙转过身，看着窗边。","宋氏还靠在那儿，脸朝着窗外，一动不动。平时她嘴最快，谁说一句，她能顶三句。可这一次，她一个字都没说。","“你说过，”顾阙开口，“你不在任何一本册子上。”","宋氏没动。","“我没怪你。”顾阙说，“我只是想知道，这一行是怎么回事。”","屋里静了很久。久到陈小满都开始不安地数桌上的木纹了。","“顾阙，”陈小满小声问，“‘失其名’是什么意思？”","“史书里的老规矩。”顾阙说，“写一个人，知道他是谁，知道他做过什么，可就是不知道他叫什么，就写‘某氏，失其名’。意思是：有这么个人，名字丢了。”","“那不还是记上了吗？”","“记了一半。”","“史书里写‘失其名’，”裴照忽然说，“就是不打算再找了。”","他坐在角落里，说完这句，又低下头去看自己的手。","宋氏猛地转过头，盯着他，眼神冷得能结冰。","“你可以不说话的。”她说。","裴照当然听不见。可他像是感觉到了什么，抬起眼，朝窗边那块空气看了一眼，又移开了。","“她说什么了？”陈小满问。","“她说，裴照可以不说话的。”","陈小满“噗”地差点笑出来，又赶紧憋住，捂着嘴转过脸去。","宋氏终于离开了窗边，走到桌前，低头看着那一行小字。","“我没骗你。”她对顾阙说，“‘失其名’不是名字。官差手里拿着册子，也喊不出一个‘失其名’来。这一行写在这里，跟没写一样。”","“可总有人写了它。”","“是。”","“谁写的？”","宋氏摇了摇头：“我不知道。”","顾阙又低头看那行字。","字是小楷，和整本册子是一个人的笔迹，横平竖直，规规矩矩。只是这一行墨淡，笔画也细，“失”字那一撇，起笔的地方顿了一下，像是写字的人停下来想了很久，才敢往下写。","他见过这种字。修复室里收过很多旧账本，账房先生记一笔拿不准的账，就是这么写的。","整本册子，是县衙的簿书一笔一笔抄出来的。这一行，也是同一个人写的。","“我知道是谁了。”顾阙合上册子，“下楼。”","掌柜正在柜台后面拨算盘。","看见他们几个人下来，他刚要笑，目光落在顾阙怀里那本黄皮册子上，笑就僵住了。","“丁口实册。”他说，“客官真找着了。”","“找着了。”顾阙把册子翻到最后一页，推到他面前，“这一行，是你写的吧？”","掌柜低头看了一眼。","他的手从算盘上拿开了。","“是我。”","“为什么写？”","掌柜沉默了一会儿，伸出一根胖胖的手指，在那行字旁边轻轻点了点，像是在点一颗算盘珠子。","“那年造完册，我核了三遍。”他说，“七千零五十二个，一户一户都对得上，一个不多，一个不少。”","“然后呢？”","“然后，我总觉得少了一个。”掌柜说，“衙门口天天有个丫头转来转去，我认得她，全县的人都认得她。可我翻遍了册子，她不在任何一户底下。不在户下，就不算丁口。按规矩，她就不该记。”","“可你还是记了。”","“簿书只认账。”掌柜说，“账不清，我睡不着。”","陈小满在旁边听得眼眶都红了：“那你为什么不写她的名字？”","掌柜看了她一眼，脸上的肉动了动，露出一个很难看的笑。","“我想写。”他说，“提起笔来，就是想不起她叫什么。我当时就站在她跟前，看着她的脸，想不起来。”","宋氏站在顾阙身边，手指一点一点地攥紧了。","“问他，”她说，声音有点发哑，“宋家，是哪个宋家。”","顾阙把话转述了。","掌柜张了张嘴。","“宋家……”他说，“就是城隍庙后头，那个……那个……”","他停住了。","不是不想说。顾阙看得清清楚楚，那几个字已经到了他嘴边，可就像账本上被虫啃掉的那几个字一样，到了那儿，就没了。","掌柜眨了眨眼，脸上露出一种很茫然的表情：“客官，我刚才要说什么来着？”","没人回答他。","上楼的时候，宋氏走在最后面。","顾阙放慢了脚步，等她跟上来。陈小满很识相，拽着裴照的袖子先进了屋，裴照被她拽得一愣，居然也没甩开。","楼梯口只剩他们两个人。","顾阙掏出笔记本，翻到新的一页。","“干什么？”","“记线索。”顾阙说，“掌柜说到城隍庙后头，就说不下去了。你自己呢？那儿还记得什么？”","宋氏靠在扶手上，看着他手里的笔，想了很久。","“一口井。”她说，“我小时候往里头扔过石子，扔下去，听不见响。”","顾阙写：城隍庙后，井，扔石子无声。","“还有呢？”","“那年没下雨。”","他写：大旱。","“还有……”宋氏的声音低了下去，“我娘给我梳头。梳一下，叫我一声。”","“叫你什么？”","“听不见。”宋氏说，“我记得她张嘴，记得梳子刮着头皮，就是那一声，是空的。”","顾阙的笔停了一下，然后写：母，梳头，唤名。","他把这一页从头看了一遍。最上面一行，他写的是“宋”，后面留了两个字的空，再往下才是那些线索。","宋氏也看见了。","“空着干嘛？”","“多闻阙疑。”顾阙说，“拿不准的地方，先空着，不乱写。”","“我知道，你那天说过。”宋氏说，“我是问你，空两个字干嘛？你怎么知道是两个字？”","顾阙愣了一下。","他也不知道。他落笔的时候，手自己就停在了那儿，像是那个地方，本来就该有两个字。","“猜的。”他说。","宋氏盯着那两个字的空，看了很久。","“猜得还挺准。”她说。","“你想起来了？”","“没有。”宋氏说，“就是看着顺眼。”","她转身往屋里走，走了两步，又回过头。","“那一页，你别撕。”","“不撕。”","“也别乱填。”她说，“填错了，我可不答应。”","门在她身后关上了。","顾阙站在楼梯口，看着那两个字的空。","那天他在杂物间里，用一行死讯的墨写字，写一个字，少一点。这本笔记本上的字，不费什么墨，写多少都行。","可这两个字，他一笔都没敢写。"]},{"id":"ch-1795214173130-0-0","title":"第20章 二证","paragraphs":["样稿，用于确定文风，请勿直接发布","“我们手里有文证了。”顾阙把丁口实册放在桌子正中间，“现在说说，能拿它干什么。”","陈小满第一个举手，像在课堂上：“把郝大哥写回来！”","“写不了。”顾阙说，“写一个人回来，要三证齐全。我们只有一样。”","“那周铎呢？那一条街呢？”","“一样。人，都要三证。”","陈小满的手慢慢放下了。","“不过，”顾阙说，“规矩是这样的：一样证据，叫孤证，只管一炷香。两样证据，叫二证，管的时间就长了，能一直管到这一卷合上。”","“一直管到最后？”","“对。前提是，写的事要小，而且要真。”","“小到什么程度？”","“小到两样证据就能把它钉死。”顾阙说，“人回不来，可总有别的东西能动。”","屋里安静下来，每个人都在想。","宋氏靠着窗，抱着胳膊：“你想动什么？”","“还没想好。”","“灯。”","是裴照。","他还坐在角落里，眼睛看着桌上那本实册：“县令是点着灯，照着册子念名字的。没有灯，他看不见字。看不见字，就念不了。”","顾阙一下子抬起头。","陈小满也反应过来了：“念不了，差役就不知道喊谁！那一晚上，县里就一个人都不少了！”","顾阙想起杜甫的两句诗：射人先射马，擒贼先擒王。","意思是，要射倒骑马的人，先射他的马；要抓一伙贼，先抓他们的头。","他们一直在想怎么躲过点名，怎么熬过三更，怎么捂住彼此的嘴。可点名这件事，是从县令那盏灯底下开始的。","“裴照，”他说，“谢谢。”","裴照没说话，只是朝他点了一下头。","“证据呢？”宋氏问，“写‘县衙不点灯’，你拿什么证明？”","“第一样，凡例。”顾阙说，“第二条，入夜闭户，不得燃灯。我在照壁上看过了，那一条的墨是灰褐色的，是原文，没人改过。这是县里自己的规矩，白纸黑字，文证。”","“可县令自己不守啊。”陈小满说，“规矩要是管得到他，他还点什么灯？”","“所以还要第二样。”顾阙说，“要一个人站出来说：以前，那盏灯是不亮的。”","“人证。”宋氏说，“要册上有名的人。我不行。”","“我知道。”","“那找谁？”","顾阙看向窗外。","照壁前的台阶上，那个小小的身影还坐在那儿，一颗一颗地拨着石子。","“阿七每天都坐在衙门正对面。”他说，“县衙夜里亮没亮灯，她比谁都清楚。”","陈小满已经抱着实册翻了起来：“那我找找，她在不在册子上！”","她翻得飞快，手指一行一行地往下划。测绘专业的人看表格，比看小说还快。","“找到了！”她把册子转过来，“城隍庙街，李家，一户三口。户主李大，妻王氏，女一口，小字阿七，年七岁。”","顾阙凑过去看。白纸黑字，小楷写得端端正正。","阿七在册上。","“我去问她。”陈小满已经站起来了，“她认得我，我跟她说。”","他们下楼的时候，大堂里坐着一个人。","西装皱巴巴的，头发倒是重新梳过了，梳得一丝不乱。他坐在靠门的桌子边，面前摆着一杯茶，看见他们下来，立刻站了起来，脸上挂着那个熟悉的笑。","“顾老师。小满。”贾三元说，“还有……裴先生。”","陈小满一下子站住了。","“你来干什么？”","“来看看大家。”贾三元说，“顺便谈谈。”","“谈什么？”","“谈谈大家怎么都能活下来。”贾三元摊开手，“县太爷那边，其实是讲道理的。只要顾老师肯把笔记本——”","“不给。”顾阙说。","贾三元的笑停了一下，又接上了：“您先别急着说不。笔记本那点东西，说实话，我都记得。我卖了十年保险，客户资料看一遍，就忘不掉。我要是想交，早就交了。”","“那你为什么不交？”","贾三元没回答。他看着陈小满，声音放软了一点：“小满，你还小，犯不着跟着他们拼命。你跟我走，我去跟县太爷说，保你——”","“昨天早上给你的饺子，”陈小满打断他，“好吃吗？”","贾三元的脸抽了一下。","“郝大哥包的。”陈小满说，“他替我答了一声‘在’，我连他长什么样都不记得了。你吃着他的饺子，转身就去帮那个点名的人。”","大堂里安静得能听见算盘珠子的声音。","是掌柜。他在柜台后面，慢悠悠地拨了一颗珠子。","“客官，”掌柜笑眯眯地对贾三元说，“您如今是本县丁口了。小店有规矩，不留本县的人住。茶钱就免了，您请回吧。”","贾三元看了掌柜一眼，又看了顾阙一眼，最后什么也没说，放下茶杯走了。","照壁前的台阶上，阿七听完陈小满的话，想了很久。","“那盏灯啊。”她说，“以前不亮的。”","“什么时候亮起来的？”","阿七掰着手指头算：“头一回少人的那天夜里。我起来尿尿，从窗缝里看见衙门那边亮了一点点。以前，夜里全县都是黑的，一点亮都没有。”","“你确定？”","“我天天看。”阿七说，“我数人，也数灯。以前是零盏，现在是一盏。”","顾阙蹲下来，看着她：“阿七，这句话，你能再说一遍吗？说慢一点。”","阿七点点头，一个字一个字地说：“以前，衙门夜里，不点灯。”","顾阙翻开残志。","死讯那一行的墨，还是湿的。他用食指蘸了，在空白处写：","“县衙正堂，入夜不燃灯。”","最后一笔落下，指尖一凉，比上回轻得多，像有一缕风从手指缝里溜走了。","照壁那边，什么动静也没有。","宋氏去了一趟衙门，很快又回来了，站在他身边轻声说：“成了。正堂那盏灯，灯芯断了。”","顾阙松了一口气，然后开始想，这次垫上的是什么。","他想了很久。修复室在，闻老师在，父亲的蒲扇在。","他想起小葛。","他记得小葛是夏天来的研究生，记得她怕那具骷髅标本，记得她最后一次叫他顾老师。可小葛的全名，他想不起来了。他天天叫她小葛，叫了半年，现在只剩一个“小”字和一个“葛”字。","还好，他想，这次只是一个名字。","天黑了。","四个人坐在大通铺里，谁都没出声。","梆子响了第二遍。","窗外，什么都没有。没有锣声，没有那个拖长的“丁——溪——县——点——名——”。整座县城安安静静，像真的睡着了。","陈小满在黑暗里数着数，数到三百，小声说：“没喊。一个都没喊。”","“今晚，县里一个人都不会少。”顾阙说。","陈小满捂着嘴，眼泪先下来了。","然后，锣声响了。","不是从街那头一户一户过来的。它直接停在了客栈门口，像是早就知道该来哪儿。","“陈——小——满——”","陈小满的眼泪僵在了脸上。","“大——二——，学——测——绘——，紧——张——就——数——东——西——，穿——兔——子——拖——鞋——”","顾阙浑身发冷。","这是他笔记本上的原话，一个字都不差。","在那个拖长的、干哑的唱名声底下，还有一个声音，很轻，很快，一句一句地在前面提词，像一个熟练的业务员在背客户资料。","是贾三元的声音。"]},{"id":"ch-1795214173135-0-0","title":"第21章 刮痕","paragraphs":["样稿，用于确定文风，请勿直接发布","陈小满没有出声。","她把那根橡胶棍死死抱在怀里，抱得指节都白了。","“陈——小——满——”","那个声音又喊了一遍。","顾阙等着脑子里那块橡皮擦过来。上一次喊她名字的时候，他眼睁睁看着郝建国的眼神一点一点变空。","可这一次，什么都没有发生。","“咔。”","很轻的一声，是从陈小满怀里传出来的。","她低头一看，橡胶棍的握把上，裂开了一道细细的缝，从这头一直裂到那头。那根棍子一下子凉透了，凉得像一根冰。","窗外，唱名声断了，断在“穿兔子”的“兔”字上，像是一口气被硬生生噎了回去。","“挡住了。”宋氏说，“兵防门，挡一次。”","陈小满抱着那根裂开的棍子，愣了好一会儿。","“郝大哥……”她的声音发抖，“又救了我一次。”","她把脸埋在棍子上，没有哭出声，肩膀一抖一抖的。","顾阙伸手，在她背上轻轻拍了两下。","窗外，那个提词的声音停顿了一下，又响了起来。","“裴——照——，二——十——七——八——，灰——大——衣——，鞋——上——没——有——泥——”","所有人都转头看向裴照。","顾阙等着。陈小满也等着，她甚至已经伸出手，准备去捂裴照的嘴。","可是，什么都没有发生。","顾阙看着裴照，裴照还是裴照。灰大衣，高领毛衣，干干净净的皮鞋。他记得这个人的每一个细节，一点都没有变淡。","裴照坐在原地，连眼皮都没抬一下。","唱名声又喊了一遍，然后迟疑地停了。","“他没被忘。”陈小满小声说，“为什么？”","“因为他不叫这个名字。”宋氏说。","顾阙转述了这句话。","陈小满瞪大了眼睛，看着裴照：“你……你不叫裴照？”","“现在叫。”裴照说。","“那你本来叫什么？”","裴照没回答。","顾阙想起第三天早上，大家轮流在笔记本上写自己，裴照看了一眼，说“我的，不用记”。","原来不是不想记。是本子上那个名字，本来就不是他。","窗外安静了很久。","然后，那个提词的声音没有再提词。它贴到了窗户底下，压得很低，很客气，像隔着窗户在打电话。","“顾老师。”贾三元说，“县太爷交代了，您不用点。”","顾阙没出声。","“您是要写书的人。”贾三元说，“县太爷说，书总得有人写完。”","锣声响了一下，往远处去了。","三更鼓响的时候，宋氏松开了按在门上的手。","“没人挂账。”她说，“小满那一声被挡回去了，不算没答应；姓裴的那一声，喊的不是他。今晚四更，差役没东西可收。”","第二天一早，照壁前的台阶上，阿七看见他们，第一次主动站了起来。","“哥哥！”她跑过来，手里攥着一把石子，“昨天夜里，一个都没少！”","陈小满一把把她抱起来，抱着转了一圈。","阿七被转得咯咯笑，笑完了又认真地说：“我数了三遍。昨天是五千九百一十一个，今天还是五千九百一十一个。”","顾阙在心里算了一下。从七千零五十二，到五千九百一十一，已经没了一千一百多人。","可是昨天夜里，一个都没少。","这是他们第一次赢。","“可这只是一晚上。”裴照说，“账还没平，县里不会停。”","陈小满放下阿七，瞪了他一眼：“你就不能让人高兴一会儿？”","“可以。”裴照说，“一会儿。”","顾阙没加入他们。他一直在想一件事。","“小满，”他说，“你还记得照壁上那份凡例吗？每一条占几行？”","“两行。”陈小满想都没想，“五条都是两行，我量过的。”","“第一条剩下多少？”","“半行。‘日落后，有人唤名，勿’，就这几个字。”","“那撕掉的部分，能写多少字？”","陈小满愣了一下，在空中比画着算：“撕掉了一行半……按那上面字的大小，少说还能写七八个字。”","“我们一直以为后面只有一个‘应’字。”顾阙说，“可撕掉的地方能写七八个字。剩下那几个字，写的是什么？”","“还有一件事说不通。”宋氏说，“要是规矩只是‘别答应’，县里的人为什么连街坊的名字都不叫了？”","顾阙想起第一天进城，陈小满说过的话：从城门走到广场，二十三个人说过话，没有一个人叫过别人的名字。","“走，”他说，“去城门。”","城门上那份凡例，还是第一天的样子。","纸黄透了，第一条被撕掉了一大半。顾阙这次没有看纸，他看的是纸后面。","告示是糊在一块木榜上的。木榜很老，表面被风吹日晒得发白。顾阙用骨刀的刀尖，轻轻挑起告示翘起来的那个角，往里看。","木头上有字。","不是写的，是刻的。凡例原本是刻在这块木榜上的，后来才在上面糊了一张纸。","他又往里挑了一点。","第一条的位置，木头上全是刮痕。一道一道，又密又深，是用刀一下一下刮出来的。原来刻的字被刮平了，只剩下一些浅浅的、断断续续的笔画底子。","“有人把第一条刮掉了。”顾阙说，“刮掉以后，又糊上一张纸，再把纸撕掉。”","“为什么要这么麻烦？”陈小满问。","“撕掉的纸，大家会以为只是破了。”顾阙说，“没人会想到，纸底下的木头也被动过。”","顾阙想起《论语》里的一句话：名不正，则言不顺。","意思是，名分不正，说出来的话就不顺当，事情也就办不成。","这个县的一切，都是从名字上出的错。有人不让人叫名字，有人不让人答名字。而这一切的源头，就在这块被刮平的木头底下。","“能看出原来的字吗？”宋氏问。","顾阙用放大镜看了很久，摇了摇头：“刮得太狠了。肉眼看不出来。”","“那怎么办？”","“拓片。”顾阙说，“拿纸蒙在上面，用墨轻轻地拍。刻痕再浅，凹下去的地方不沾墨，凸出来的地方沾墨，字就会显出来。”","“你有纸吗？”","“有棉纸。”顾阙拍了拍工具包，“没有墨。”","“残志上那行死讯的墨呢？”","“那墨要留着写字。”顾阙说，“拓片要用一大片墨。我回去自己做。锅底灰兑米汤，能凑合。”","他们回客栈的时候，是上午。","顾阙在后厨蹲了一个时辰，刮了满满一碗锅底灰，又找掌柜要了半碗米汤，调成黑糊糊的一团，用棉布包成一个小墨包。","下午，他们再往城门走。","陈小满走在最前面，嘴里数着步子：“一百，一百五十，两百……”","早上从广场到城门，她数的是八百六十步。","数到八百六十，城门还在前面。","数到一千二，城门还在前面。","数到两千，陈小满停了下来。","她转过头，脸色发白：“顾阙，我们走了两千步了。”","顾阙抬头看。","城门就在长街的尽头，青砖，旗子，那块木榜上的告示在风里一翘一翘。","和他们刚出发的时候一样远。","“城门，”陈小满说，“一步都没近。”"]},{"id":"ch-1795214173138-0-0","title":"第22章 陈小满","paragraphs":["样稿，用于确定文风，请勿直接发布","“再走一次。”顾阙说。","他们又走了五百步。城门还在那儿，不远不近，像挂在长街尽头的一幅画。","陈小满停下来，喘着气：“不是我们走得慢。是路在长。我们往前走一步，它就往后长一步。”","“它不想让我们过去。”宋氏说，“那块木头底下的东西，它怕被人看见。”","顾阙看着城门，脑子转得飞快。","第一天，三里路一段比一段短，是这个县在把他们往里收。现在，同一条街越走越长，是这个县在把他们往外推。","路的长短，这个县说了算。","“宋氏，”他低声问，“上次你说，郝建国是兵防门的。小满是什么门？”","宋氏看了陈小满一眼。","“你早该问了。”她说，“这丫头天天量路，量步子，量墙上的字。她是舆地门的。”","“舆地门能干什么？”","“县志里的舆地门，管的是山川、道路、城池，哪儿到哪儿多远。”宋氏说，“舆地门的人，量过的地，地就认。”","顾阙转过身，看着陈小满。","“小满，你早上量的，广场到城门多少步？”","“八百六十。”","“你确定？”","“我确定。”陈小满说，“我量了两遍，误差不超过五步。”","“那这条街，就是八百六十步。”顾阙说，“不是两千，不是三千。你量过的，就是它本来的样子。”","陈小满愣愣地看着他：“你在说什么？”","“宋氏说，你是舆地门的。你量过的路，路会认。”顾阙说，“它现在在跟你耍赖。你得告诉它，它本来有多长。”","“我……我怎么告诉它？”","“你平时怎么量，现在就怎么量。”","陈小满咬着嘴唇，看了看长街，又看了看顾阙。","“我要是做不到呢？”","“那我们就再想别的办法。”顾阙说，“你先试试。”","陈小满深吸了一口气，站直了身子。","她没有往前走。她站在原地，盯着长街尽头的城门，像盯着一张图纸。","“广场到城门，”她开口，声音还有点抖，“八百六十步。”","风停了。","“我步子小，一步七十公分。八百六十步，六百零二米。”她的声音越来越稳，“这是我早上量的。我量了两遍。我是测绘专业的，我量的数，就是对的。”","她迈出了第一步。","顾阙看见，她脚下的青石板，像一卷布被人从两头往中间一推，整条街一下子挤了过来。两边的铺子一闪而过，快得只剩一片模糊的影子。","第二步。","城门的旗子已经能看清上面的字了。","第三步。","陈小满的脚，落在了城门下的石阶上。","她回过头，看着身后的长街。顾阙、宋氏、裴照，三个人就站在她身后一步远的地方，好像他们一直都在这儿。","“三步。”陈小满喃喃地说，“八百六十步，我走了三步。”","她的鼻子底下，慢慢流出一道红。","“小满，你流鼻血了。”","“啊？”她抬手一抹，满手的血，然后咧开嘴笑了，“没事，我高中跑八百米也流过。”","顾阙想起李白的诗：朝辞白帝彩云间，千里江陵一日还。","意思是，早上告别白帝城，一千多里外的江陵，一天就到了。","李白写的是坐船顺流而下，船走得飞快。陈小满什么船都没坐，她只是认认真真地，把一条路量对了。","“舆地门。”","裴照站在后面，看着陈小满，说了这三个字。","这是他第一次，主动说出一个门的名字。","城门底下，已经有人了。","贾三元站在那块木榜前面，手里拎着一把柴刀，西装袖子挽到了胳膊肘。告示已经被他撕下来了一大半，扔在脚边。","他听见动静，猛地转过身，看见他们四个，脸上的表情像见了鬼。","“你们……”他看看他们，又看看身后那条长街，“这条街，县太爷说了，你们走一天都走不到！”","“县太爷说错了。”陈小满说。","贾三元的脸色变了几变，最后还是挤出了一个笑：“顾老师，您别为难我。县太爷让我来，把这块板子劈了。我劈完就走，大家相安无事。”","“不行。”顾阙说。","“那就没办法了。”","贾三元举起柴刀，转身就朝木榜劈过去。","“站住！”陈小满喊了一声。","贾三元当然没站住。","可是他明明只离木榜两步远，跑了五步，木榜还在两步之外。他又跑了十步，二十步，木榜一直在他前面两步，像一个怎么也追不上的影子。","“从你到那块板子，”陈小满说，鼻血还挂在嘴唇上，“我刚量了，一百步。你慢慢跑。”","贾三元停下来，拄着柴刀，大口大口地喘气。他回头看着陈小满，眼神里第一次有了害怕。","“你……你一个学生……”","“学测绘的。”陈小满说，“贾三元，你不是最会算吗？你算算，你还得跑多少步？”","贾三元张着嘴，没说出话来。","“你要是还想劈，”陈小满说，“我就让你跑到天黑。天黑了，你自己跟差役解释，你为什么在外头。”","贾三元盯着她看了很久。","最后，他把柴刀往地上一扔，转身走了。这一次，路没有为难他，他走得很快，一次都没有回头。","宋氏在旁边笑出了声：“这丫头，比你会吵架。”","顾阙没接这句话。他已经蹲在木榜前面了。","告示被撕掉以后，整块木榜露了出来。第一条的位置，满是密密麻麻的刮痕。","他把棉纸用清水喷湿，平平地贴在木头上，用手掌一点一点按实，等纸半干的时候，拿起那个装着锅底灰的墨包，轻轻地拍。","一下，一下。","纸上慢慢浮出了黑白分明的影子。","“日落后，有人唤名，勿应于官，”","顾阙的手停了。","“于官”后面，还有字。可是那几个字的地方，刮痕比别处深得多，深到木头都凹下去一个坑。墨拍上去，只是一片乌黑。","“勿应于官。”陈小满念出来，“不要答应官府的人……那后面呢？”","“被刮得最狠的地方，”顾阙说，“就是最要紧的地方。”","宋氏一直没说话。","她站在木榜前面，看着那四个字，看了很久。","“我听过这句话。”她忽然说。","顾阙转过头。","“我娘说过。”宋氏的声音很轻，像是怕把什么东西吓跑了，“她给我梳头的时候，一边梳，一边念叨。‘日落后，有人唤名，勿应于官’……后面还有一句。”","“后面是什么？”","宋氏张了张嘴。","她的手慢慢攥紧了，攥得指节发白。","“我想不起来了。”她说。"]},{"id":"ch-1795214173139-0-0","title":"第23章 枯井","paragraphs":["样稿，用于确定文风，请勿直接发布","回到客栈，顾阙把拓片摊在柜台上。","“勿应于官。”掌柜念了一遍，拨算盘的手停住了，“客官从哪儿拓来的？”","“城门的木榜。”顾阙说，“后面的字被刮掉了。你知道是什么吗？”","掌柜看了那张拓片很久，摇摇头：“小人只管账，不管凡例。”","“那说账。”顾阙把拓片收起来，“文证我们有了。还差一样实打实的东西，能证明这个县真有七千零五十二个人。你是簿书，你说，什么东西能证明？”","掌柜没马上回答。他低头拨了两颗珠子，又拨回来。","“丁牌。”他说。","“丁牌是什么？”陈小满问。","“本县的老规矩，每口人一块竹牌。”掌柜伸出手，比了一个巴掌长的大小，“正面烙着姓名、户头，背面烙着县印。出城要验，服役要验，连吃奶的孩子，生下来满月也要领一块。”","“就像身份证。”陈小满说。","“客官说什么？”","“没什么。”陈小满赶紧说，“您继续。”","“那年册上报了零。”掌柜说，“册上没人，牌子就不能有。县太爷下了令，一户一户收，收齐了，全倒进城隍庙后头那口井里。”","“谁倒的？”顾阙问。","掌柜的手停在了算盘上。","“小人。”他说，“七千零五十二块，一筐一筐，是小人亲手倒下去的。”","大堂里没人说话。","“城隍庙后头。”宋氏在顾阙身边轻声说，“那口井。”","顾阙想起她说过的话：我小时候往里头扔过石子，扔下去，听不见响。","“去看看。”他说，“趁天还亮。”","阿七还坐在照壁前的台阶上。","陈小满蹲下来问她城隍庙怎么走，阿七立刻站起来，拍了拍褂子上的土：“我带你们去。我家就在城隍庙街。”","“那口井，你知道吗？”","阿七的脚步慢了一下：“知道。大人不让靠近。”","“为什么？”","“说井里有东西念书。”阿七说，“夜里听得见，沙沙的。”","陈小满握住了她的小手，握得紧了一点。","城隍庙不大，门口的漆掉了一半，里面供着一尊泥塑，脸被烟熏得黑乎乎的，看不出表情。","阿七把他们领到庙后的小院门口，就不肯再往里走了。","“我在这儿等你们。”她说，“你们快点出来。”","“好。”陈小满摸了摸她的头，“你数到一百，我们就出来。”","“我数到一千也行。”阿七说，“我很会数。”","后院荒得厉害，野草长到膝盖。院子正中间，是一口井。","井口是青石的，磨得发亮，上面盖着一块石板。石板上贴着一张封条，纸已经黄透了，字还能看清：","“嘉宁七年 封。”","“别碰。”裴照站在院门口，没进来，“那是县衙的封条。”","“你从来不碰这里的东西。”顾阙说。","“对。”","“为什么？”","裴照看着那口井，过了一会儿才说：“碰了，就是这里的人了。”","这是他头一回解释自己的规矩。可顾阙觉得，他说的不全是封条。","宋氏已经走到了井边。她伸出手，悬在石板上方，没有落下去。","“就是这口。”她说，“我扔过石子的，就是这口。”","“你能推开吗？”","“我推得开。可我一松手，它就会盖回去。”","“那你推，我来撑着。”","宋氏两手按住石板，用力一推。石板发出一声闷响，滑开了一条缝。顾阙赶紧把工具包里的骨刀横着塞进缝里，卡住。","一股凉气从井里冒了出来。","不是井水那种湿凉，是旧书库里那种凉，干的，带着一股陈年的纸味和霉味。顾阙在修复室里闻了七年，一闻就知道。","陈小满捡起一颗石子，看了看大家，扔了下去。","她开始数：“一，二，三，四，五……”","数到二十，没有响声。","数到五十，还是没有。","“没底。”陈小满的声音有点发虚。","顾阙掏出手机，打开手电，把手伸进井口，往下照。","光柱往下照了很深很深，照到了底。","井底是白的。","一开始，他以为是骨头。仔细看，才看出那是竹子。一块一块的竹牌，巴掌长，层层叠叠地堆在井底，堆成一座小山。光照上去，竹牌的边缘泛着一点黄，有几块翻着，能看见上面烙着的黑字。","“七千零五十二块。”宋氏说。","陈小满趴在井沿上往下看，嘴唇动着，下意识地在数。数了一会儿，她停下来：“数不过来。太多了。”","“物证。”顾阙说，“就在下面。”","“可是……”陈小满看看井底，又看看自己的手，“照得见底，那我刚才扔下去的石子，怎么没响？”","没人答得上来。","顾阙想起《庄子》里的一句话：井蛙不可以语于海者，拘于虚也。","意思是，没法跟井底的青蛙讲大海，因为它被困在那一小块地方，一辈子只看得见井口那么大的天。","他看着这口井，忽然有点分不清：到底谁才是井底的那只青蛙。是被困在这个县里三百年的人，还是他们这些以为自己看清了一切的外来人。","“天快黑了。”裴照在院门口说，“今天下不去。”","“明天一早再来。”顾阙说，“要绳子，要筐子。”","他把手机收回来，准备拔出骨刀，让石板盖回去。","就在这时，井底传来了一个声音。","沙。","很轻。","顾阙的手停住了。","沙……沙……","陈小满抓住了他的胳膊。宋氏退了一步，背靠着井沿。院门口，裴照的脸色变了。这是顾阙第一次在他脸上看见这种表情，不是冷淡，是警惕。","那个声音很有规律。停一下，响一下，再停一下。","顾阙听过这个声音几万遍。在修复室里，在图书馆的阅览室里，在他自己的书桌前。","那是翻书的声音。","有人在井底，一页一页地翻着什么。不急，不慢，像是在读一本很长、很长的书。","院门外，阿七的声音远远地传进来，脆生生的：","“九十八，九十九，一百！哥哥姐姐，你们出来了没有？”","井底的翻页声，停了一下。","然后，又翻了一页。"]},{"id":"ch-1795214173140-0-0","title":"第24章 门牌","paragraphs":["样稿，用于确定文风，请勿直接发布","翻书的声音停了。","顾阙又把手电伸进井口，往下照。","竹牌还是那一堆。可这一次，他看清了最上面那几块。","牌子正面烙名字的地方，被啃出了一个个小洞。洞的边缘是白的，很新，像刚刚才被咬开。","“它在吃名字。”顾阙说。","“什么在吃？”陈小满问。","“不知道。”顾阙说，“掌柜那本账上被虫啃掉的字，就是这样的洞。”","宋氏趴在井沿上，看了很久：“今天吃几块，明天吃几十块。等到明早，你下去捞上来的，就只剩一堆没字的竹片。”","“没字的牌子，证明不了任何人。”顾阙说。","院子里安静了一会儿。","“那就今晚下。”陈小满说。","她说完自己也吓了一跳，可是没有收回去。","“天马上就黑了。”裴照在院门口说。","“我知道。”陈小满说，“可郝大哥的饺子，阿七的娘，那一整条街的人，都在等这堆牌子。明天就没了。”","顾阙看了她一眼。","这个第一天见面就哭鼻子的女孩，现在站在一口没有底的井边，说今晚就下。","“好。”他说，“今晚下。”","陈小满先跑到院门口，蹲在阿七面前：“阿七，你先回家。关好门，堵上耳朵，数数，数到天亮。”","“你们呢？”","“我们捞完东西就回去。”","阿七看着她，看了一会儿，伸出小拇指：“明天早上，照壁。”","陈小满勾住她的小拇指：“照壁。”","井边有一架旧辘轳，上面缠着一卷井绳，绳子发黑，摸上去还算结实。顾阙从庙里找来一个装香灰的竹筐，倒干净，拴在绳头上。","“绳子多长？”宋氏问。","陈小满已经在量了。她把绳子一庹一庹地拉开，嘴里数着：“一庹，两庹……十庹。三丈出头，十米左右。”","“井呢？”","陈小满看着那个黑洞洞的井口，咬了咬牙。","“这口井，三丈深。”她说，“我量过了，就是三丈。”","她的鼻子底下，又流下一道红。","顾阙把手电往下照，井底的竹牌，好像一下子近了许多。","“我下去。”顾阙说，“小满摇辘轳。宋氏……”","“我跟你下去。”宋氏说，“井里的东西，你看不见的，我看得见。”","裴照还站在院门口，一步都没有进来。","陈小满回头看他：“你不来帮忙？”","“我不碰这里的东西。”裴照说，“可我在这儿。”","“在这儿有什么用？”","裴照没回答。","顾阙抓着井绳，一点一点地往下滑。宋氏跟在他上面，她下得比他还轻，像一片叶子落进井里。","井壁很干，摸上去是一层一层的旧纸，糊在石头上，一碰就簌簌地掉渣。顾阙越往下，那股旧书库的味道就越浓。","他的脚踩到了竹牌上。","哗啦一声，脚底下的牌子滑开了一片。顾阙蹲下来，用手电照着，捡起一块。","正面烙着三个字：王有田。","顾阙的手顿了一下。","第一天晚上，锣声喊的第一个名字，就是王有田。远处一扇门里，一个男人闷闷地应了一声“在”，然后再也没有声音。","“他在这儿。”宋氏说，“他们都在这儿。”","顾阙不再看名字了。他把牌子一块一块往竹筐里放，挑那些字还完整的，放得很快。","井底很大，比井口大得多，四周都是黑的，手电照不到边。","他没去照。","刚才那个翻书的声音，就是从那片黑里传出来的。","“快点。”宋氏低声说，“天黑了。”","井口那一小块天，一下子就暗了。","顾阙往筐里放了最后一把牌子，拽了拽绳子：“小满，拉！”","上面没有回答。","“小满？”","井口探出了一个脑袋。","不是陈小满。那是一张纸脸，发黄的纸上，写着一个墨黑的“差”字。","它看着井底，看了一会儿，然后，整个身子倒过来，头朝下，手脚贴着井壁，一节一节地往下爬，像一只很大很大的蜘蛛。","宋氏一把把顾阙拽到身后。","“县衙的封条破了，”她说，“它们是来收人的。”","顾阙的心跳得飞快，手在工具包里乱摸。","骨刀插在井口的石板缝里，没带下来。镊子，放大镜……他摸到了一个塑料瓶子。","喷壶。","那张纸脸已经爬到了半截，离他们不到两米。墨写的“差”字一鼓一瘪，像在喘气。","顾阙举起喷壶，对着那张纸脸，按了下去。","嗤。","一片细细的水雾扑在纸上。","纸脸上的“差”字，一下子洇开了。墨顺着湿透的纸往下淌，像一张哭花了的脸。那个差役僵在井壁上，手脚一软，整个身子像一张泡了水的纸，啪地拍在井壁上，慢慢滑下来，瘫成了一团。","顾阙又补了两下，才停手。","“纸怕水。”他喘着气说，“修书的人，最知道纸怕什么。”","宋氏看了他一眼，嘴角翘了一下：“你倒是会挑东西带。”","井口上面，传来了陈小满的喊声：“顾阙！还有一个！它要推石板！”","顾阙抬头。石板正在一点一点地往井口这边滑，要把井口盖上。","然后，他听见陈小满的声音，又急又抖，却一个字一个字地喊得很清楚：","“从你到那块石板，一百步！”","石板停住了。","井口外面，传来一阵很奇怪的脚步声，一直在走，一直走不到。","“拉！”陈小满喊。","辘轳吱呀吱呀地转了起来。","顾阙抱着竹筐爬出井口的时候，看见院子里的情形。","一个差役在院子另一头，一步一步地朝石板走，走了很久，还在原地。陈小满用两只手摇着辘轳，满脸都是鼻血，摇得胳膊都在抖。","裴照站在她身边。","他没有碰辘轳，也没有碰差役。他只是站在陈小满和差役中间。刚才那个差役朝这边走过来的时候，走到裴照面前，停了一下，纸脸对着他，像是在辨认什么，然后绕开了他，去推石板。","“它为什么绕开你？”顾阙问。","“它认得我。”裴照说。","他没有再解释。","那一夜，他们没有回客栈。","四个人躲进城隍庙的正殿，关上门。庙门一关，就是一户，入夜闭户，规矩也算守了。","顾阙把竹筐放在供桌下面。一筐竹牌，三百多块，每一块上面，都烙着一个人的名字。","屈原有两句诗：路漫漫其修远兮，吾将上下而求索。","意思是，路又远又长，我要上上下下，到处去寻找。","今晚，他们真的是上上下下，从井口到井底，又从井底到井口，找回了这三百多个名字。","宋氏坐在他旁边，从筐里拿起一块竹牌，借着窗纸透进来的那点灰光看。","“阿七她娘的。”她说，“李王氏。”","她把牌子递给顾阙。","顾阙伸手去接，然后停住了。","窗纸的光，从宋氏拿牌子的那只手上透了过来。","他能隔着她的手指，看见她手里那块竹牌上的字。","宋氏低头看了一眼自己的手，很快地把牌子塞给他，把手缩回了袖子里。"]},{"id":"ch-1795214173141-0-0","title":"第25章 四十九","paragraphs":["样稿，用于确定文风，请勿直接发布","天亮的时候，阿七已经坐在照壁前的台阶上了。","她看见他们从街口走过来，一下子站起来，又不好意思跑，就站在台阶上等。等陈小满走近了，她才小声说：“五千九百一十一。又没少。”","“真棒。”陈小满蹲下来，“阿七，我们给你带了个东西。”","顾阙从竹筐里拿出一块竹牌，递给陈小满。陈小满用袖子把上面的灰擦干净，放进阿七手里。","阿七低头看着牌子上的三个字，看了很久。","“我不认字。”她说。","“李王氏。”陈小满说，“这是你娘的牌子。”","阿七没说话。","她用小手指，一笔一画地去摸牌子上烙出来的字，摸了一遍，又摸一遍。","“我娘叫王……”她说，“王什么？”","“牌子上没写。”陈小满说，“就写了王氏。”","“那我就记王氏。”阿七说，“第四千三百零六个，叫王氏。”","她把牌子贴在胸口，抱得紧紧的，又开始拨她的石子。拨得很慢，一颗一颗，眼泪掉在石阶上，她也不擦。","陈小满别过脸去，使劲眨眼睛。","裴照站在后面，看了一会儿，从大衣口袋里摸出一个东西。","是一个饺子，用油纸包着，已经硬了。","陈小满愣住了：“这是……那天我塞给你的？”","“我不吃。”裴照说。","他蹲下来，把饺子放在阿七的石子堆旁边，站起来，走了。","阿七看看饺子，又看看他的背影，小声说：“那个哥哥，好像也没那么凶。”","客栈里，掌柜正在擦柜台。","“几位客官，一夜没回啊。”他抬起头，笑眯眯的，“昨夜差爷来过了。”","“喊谁了？”顾阙问。","“在小店门口，喊了这位姑娘。”掌柜看了陈小满一眼，“喊了三遍。小店里没有姑娘，喊给谁听？差爷站了一会儿，就走了。”","陈小满后背一凉。","“唱名是一户一户喊的。”宋氏在顾阙身边说，“人在哪户，就在哪户门口喊。昨晚他们不知道你们在庙里。”","“今晚就知道了。”顾阙说。","“对。”","“还有一件事。”掌柜放下抹布，“昨夜差爷走的时候，跟着他提词的那位客官，在小店门口站了很久。他说，城隍庙后头的封条，破了。”","顾阙明白了。贾三元已经知道他们去过井边。","上楼之前，顾阙看了宋氏一眼。","“后院。”他说，“我有话问你。”","客栈的后院很小，晾着几条发白的床单，墙角堆着劈好的柴。","宋氏靠在墙上，抱着胳膊，两只手都缩在袖子里。","“手。”顾阙说。","“什么手？”","“你的手。”","宋氏看了他一会儿，叹了口气，把右手从袖子里伸出来。","阳光照在上面，穿过去了。顾阙能透过她的手掌，看见后面墙上的砖缝。从指尖到手腕，整只手淡得像一层薄纱。","“什么时候开始的？”","“昨晚，摸到那堆牌子以后。”","“为什么？”","宋氏没马上回答。她拔下头上那根木簪子，递给他。","簪子是普通的木头，磨得发亮。簪身上，刻着一道一道细细的划痕，密密麻麻，排得很整齐。","“数数。”她说。","顾阙数了。","“四十八道。”","“今天是第四十九。”宋氏拿回簪子，用指甲在上面又划了一道，“每回有人入卷，我就刻一道。”","顾阙看着那根簪子，一时说不出话来。","“四十八回。”宋氏说，“每一回，都有人从那条三里路走进来。有的一回来了三个，有的一回来了八个。每一回，他们都没能把账做平。人死光了，第七天一过，县里就从头再来一遍。七千零五十二个，一个不少，阿七又坐回台阶上数石子。”","“然后你再刻一道。”","“对。”","顾阙想起第一天晚上，那条土路两边摆着的鞋。布鞋，胶鞋，断了跟的高跟鞋，还有一只虎头鞋。","“三里路边上那些鞋，”他说，“四十七只。”","“是他们的。”宋氏说，“有的人连城门都没走到。走不到的，就剩一只鞋，摆在路边，鞋尖朝着县城。”","“那只虎头鞋呢？”","宋氏沉默了一会儿。","“有一回，一个当娘的抱着孩子走进来。”她说，“孩子还不会走路。”","顾阙没有再问下去。","“这一回呢？”","“这一回不一样。”宋氏说，“这一回，来了主修。灯灭了，文证有了，物证也有了。三证，你已经拿到两证。”","她看着自己那只透明的手。","“账要平了。”","“账平了，不是好事吗？”","“对县里是好事。”宋氏说，“对我不是。”","“为什么？”","“你算过账的。”宋氏说，“七千零五十二，是一个整数。我不在这七千零五十二里头。我是零头，是那个多出来的、记不进任何一户的人。”","顾阙忽然明白了。","“账不平的时候，零头还能挂在那儿。”宋氏说，“账一平，不管是归零，还是你把七千零五十二个人写回去，零头都得抹掉。到第七天，账平了，我就没了。”","“所以，”顾阙的声音有点发紧，“我们写得越好，你就消失得越快。”","“对。”","顾阙想起李白写过的一句话：夫天地者，万物之逆旅；光阴者，百代之过客。","意思是，天地就像一家客栈，世上万物都只是来住一晚；时间就像一个过路的客人，一代一代地走过去。","这个县有一家安居客栈，住过四十九回过路的人。而宋氏，在这家客栈里一住就是三百年，看着每一回的客人来了又走。","这一回，轮到她走了。","“你帮我找名字，我帮你活过今晚。”宋氏把簪子插回头上，“这是我们说好的。你活过了好几晚了，我这笔账，不亏。”","“名字还没找到。”","“找不到，也没关系。”","顾阙盯着她。","第一天晚上，她捂住他的嘴说“别答”；在夹墙里，她跟贾三元抢那本册子，手背都刮破了；在井底，她一把把他拽到身后。","她一直都知道。从第一天起，她就知道，他越往前走，她就越快消失。","可她一直在帮他往前走。","“宋氏。”顾阙说。","“嗯？”","“你怎么不早说？”"]},{"id":"ch-1795214173142-0-0","title":"第26章 裴照","paragraphs":["样稿，用于确定文风，请勿直接发布","宋氏没有马上回答。","她看着晾衣绳上那几条发白的床单，风一吹，床单鼓起来，又落下去。","“早说了，”她说，“你还会往前走吗？”","顾阙张了张嘴。","“你会停下来。”宋氏说，“你这个人，嘴毒，心软。你会想，再等等，再想想，有没有两全的办法。可这个县等不起。阿七等不起，那五千九百一十一个人等不起。”","“那你呢？”","“我等了三百年了。”宋氏说，“不差这几天。”","“她撑不到第七天。”","后院门口，有人说话。","是裴照。他靠在门框上，不知道站了多久。","顾阙转过身：“你听见了？”","“听见你那一半。”裴照说，“另一半，我猜得到。”","“你早就知道？”","“知道。”","“从什么时候？”","“从第一天。”裴照说，“这种零头，我见过不止一个。”","陈小满从楼梯上探出头来，看看裴照，又看看顾阙：“你们在说什么？什么零头？”","顾阙没有瞒她。他把宋氏的手、木簪子上的四十九道刻痕、账平了零头就会被抹掉，一样一样地说了。","陈小满听完，站在楼梯上，半天没动。","然后她冲下楼，冲到裴照面前，仰着头瞪着他：“你从第一天就知道？你知道宋姐姐会没，你一个字都不说？”","“说了，没用。”","“有没有用，是你说了算的吗？”","裴照低头看着她，难得地没有移开目光。","“小满。”顾阙说，“让他说完。”","他看着裴照：“你不叫裴照。差役认得你。你不碰这里的东西，鞋上从来没有泥。你到底是谁？”","裴照沉默了一会儿。","“修志会。”他说，“校勘。”","“修志会是什么？”陈小满问。","“一群从这种地方活着出去，又一次一次回来的人。”裴照说，“像周铎那样的，进过两三回，就算老手了。我们这些人，进过几十回。”","“几十回……”陈小满喃喃地说。","她忽然想起什么：“周老师……周铎，也是你们的人吗？”","“不是。”裴照说，“他要是修志会的，就不会信那张被挖改过的纸。”","“那你就看着他去答应？”","“我说过，拦不住。”裴照说，“他的名字，已经在册上了。”","陈小满咬着嘴唇，没再说话。","“我们不走那条三里路。”裴照说，“修志会有自己的门，从书页的缝里直接进卷。所以我鞋上没泥。”","“名字呢？”顾阙问。","“进卷的人，名字是最值钱的东西。周铎教过你们。”裴照说，“修志会的人，进卷从来不用真名。在这一卷，我叫裴照。下一卷，就不叫了。”","“差役为什么认得你？”","“县里的东西，闻得出谁是常客。”裴照说，“它们知道，碰我，划不来。”","顾阙想了想：“你说你是校勘。那主修是什么？”","裴照看着他，第一次笑了一下。很淡，几乎看不出来。","“主修，就是你。”他说，“一部志，只有一个主修。只有主修，能在志上落笔。我们这些校勘，能看出哪里错了，可动不了一个字。”","“所以你跟着我。”","“我是来找你的。”裴照说，“修志会找主修，找了很多年。”","“那我们呢？”陈小满忍不住问，“我，郝大哥，周老师，贾三元，我们又不能写，拉我们进来干什么？”","“修一部志，不是一个人的事。”裴照说，“古时候官府开局修志，主修底下，有人量地画图，有人管兵防，有人算钱粮，有人下乡采访。一个萝卜一个坑。”","“所以……”","“你是舆地，量路的。郝建国是兵防，护人的。贾三元是赋役，算账的。”裴照说，“这部志要定稿，就到外面去抓人。抓的，就是这一门一门的人。凑齐一个班子，七天之内，把账修平。”","陈小满愣住了：“那前面那四十八回……”","“每一回，它都把人凑齐了。”裴照说，“就差一个主修。没有主修，谁也落不了笔。七天一到，账一平，进来的人，跟着一起平掉。”","院子里安静了一会儿。","“为什么是我？”","“因为残志最后一页，那个落款。”裴照说，“三百年前，在这个县写下‘零’的主修，落的名字是顾阙，笔迹也是你的。”","他顿了一下。","“别人进来，工牌上只是没了名字。只有你，书里夹的是死讯，写的是‘本县人’。”裴照说，“这部志认得你。前四十八回，它一直在凑人；这一回，它把主修叫来了。为什么等了三百年才叫到你，修志会也想知道。”","“我不知道。”","“我知道你不知道。”裴照说，“所以我跟着你，看你怎么写。”","“那天在井边，你站在小满前面，”顾阙说，“也是为了看我怎么写？”","裴照沉默了一下。","“那天是因为，她在摇辘轳。”他说，“摇辘轳的人倒了，井底的人就上不来。”","陈小满愣了愣，瞪他的眼神软了一点点，嘴上还是不饶人：“你就不能说一句，是怕我出事？”","裴照没接这句话。","“找我干什么？”","“请你入会。”裴照说，“你这一卷能写平，修志会认你。以后每一卷，我们帮你挑路，帮你找证据，帮你挡差役。你只管写。”","“条件呢？”","裴照看了他一会儿。","“修志会只有一条规矩。”他说，“只修，不增。”","“什么意思？”陈小满问。","“错的，改对；丢的，找回。”裴照说，“可是志上本来没有的东西，一个字都不许加。”","顾阙听懂了。","“宋氏。”他说。","“对。”裴照说，“她不在七千零五十二里头，不在任何一户底下。你把七千个人写回去，是修。你把她写进去，是增。”","“增了会怎么样？”","裴照没马上回答。他看了一眼顾阙身边的空气，正好是宋氏站着的地方。","“加进去的字，会招东西。”他说。","“什么东西？”","“你在井底听见过。”","顾阙后背一阵发凉。","一页一页翻书的声音。不急，不慢。","宋氏在他身边冷笑了一声：“说得好听。你们这一会，修了几十回志，有没有一回，问过志里的人愿不愿意被抹掉？”","顾阙把这句话转述了。","裴照沉默了很久。","“没问过。”他说。","“那我们，就不是一路人。”宋氏说。","顾阙想起《论语》里的一句话：道不同，不相为谋。","意思是，走的路不一样，就没法在一起商量事情。","他看着裴照，又看看身边的宋氏。一边说，只许修，不许增；一边说，人不是账上的零头，说抹就抹。","“我不入会。”顾阙说。","“不急。”裴照说，“卷终之前，你都可以改主意。”","“我不会改。”","“你会想改的。”裴照说，“因为还有一件事，你还没想到。”","“什么事？”","裴照的目光落在顾阙怀里那本丁口实册上。","“你要三证。文证有了，物证有了，还差人证。”他说，“你心里打算让谁来作证？”","顾阙没有回答。","他心里想的，就是宋氏。这个县里，只有她什么都记得。","裴照看着他，像是早就知道了答案。","“宋氏不算人证。”他说。"]},{"id":"ch-1795214173144-0-0","title":"第27章 人证","paragraphs":["样稿，用于确定文风，请勿直接发布","“为什么不算？”陈小满问。","“宋氏自己说过。”顾阙替裴照回答了，“人证，要册上有名的人。她不在任何一户底下。”","“可她什么都记得啊！”","“记得没用。”裴照说，“志只认志上有的人。志上没有的人说的话，在志里，就跟风吹过去一样。”","宋氏靠在门框上，一句话都没说。这件事，她比谁都清楚。","“那就找别人。”陈小满说，“这县里还有五千九百多个人呢，总有一个能作证吧？”","“先说清楚，作证要证什么。”顾阙把丁口实册摊在桌上，翻开笔记本，写下一行字：","“嘉宁七年，丁溪县实有丁口七千零五十二，册报为零。”","“这是我最后要写进志里的话。”他说，“文证，是这本实册，证明有七千零五十二个人。物证，是井里的丁牌，证明这些人真的活过。人证，要一个人站出来说：我亲眼看见了，这个县有七千人，可是册上报了零。”","“阿七！”陈小满马上说，“她天天数人，她数过七千零五十二！”","顾阙摇了摇头。","“为什么不行？她在册上啊！上回写灯，不就是她作的证吗？”","“灯那一回，是二证，只管到这一卷合上，志收了她的话。”顾阙说，“这一回是三证，要永久写进志里，规矩就严了。她七岁。古代的律法里有一条：八十岁以上，十岁以下，不能让他作证。唐朝的律书里写得清清楚楚。老人怕糊涂，孩子怕说不清。这部志是照着古代的规矩办事的，阿七的话，它不收。”","“这什么破规矩！”陈小满气得拍了一下桌子，“七岁怎么了？七岁的孩子数数比我都准！”","“我也觉得是破规矩。”顾阙说，“可我们现在，是在别人的规矩里写字。”","陈小满憋着气，不说话了。","“掌柜呢？”她又想到一个，“他是簿书，当年就是他造的册！他什么都知道！”","顾阙想了想：“去问问。”","楼下，掌柜听完他们的话，拨算盘的手停了很久。","“客官要小人作证？”","“对。”顾阙说，“你只要说一句：嘉宁七年，本县实有七千零五十二人，册上报了零。”","掌柜看着他，脸上的笑一点一点地没了。","“小人说。”他说。","他清了清嗓子，站直了身子，两只胖手规规矩矩地按在柜台上，像在公堂上回话。","“嘉宁七年，本县实有丁口……”","他停住了。","顾阙看见他的嘴还在动，可是一点声音都没有。他又张了张嘴，脸憋得通红，额头上冒出了汗。","“……册报，零。”","最后那个“零”字，倒是说得清清楚楚。","掌柜愣在那儿，低头看着自己的手，手在发抖。","“小人……说不出那个数。”他的声音哑了，“小人心里记得清清楚楚，七千零五十二，可就是说不出来。”","“为什么？”陈小满急了。","顾阙看着柜台上那把刻着“簿书房”的算盘，明白了。","“因为实册就是他写的。”他说，“我们的文证，本来就是他的字。同一个人，写过一遍，再出来说一遍，在志里只算一样证据。三证要三样，不能让一个人凑两样。七千零五十二这个数，他已经用笔‘说’过了，志不让他用嘴再说一遍。”","“那他怎么说得出‘零’？”陈小满问。","“‘零’不是证据。”顾阙说，“那是他认的错。”","掌柜慢慢坐回椅子上，看起来一下子老了很多。","“账要清。”他喃喃地说，“可这本账，是小人自己做脏的。”","没人说话。","县令不可能作证。阿七太小。掌柜说不出口。整个县五千九百多个人，一个都没见过当年的事，他们连彼此的名字都不记得。","顾阙想起《论语》里，孔子说过的一段话。孔子说，夏朝和殷朝的礼，我能讲出来，可是没法证明，因为“文献不足故也”。","意思是，书上的记载不够，懂这些事的人也不够。","“文献”这个词，现在说的是书。可在孔子那时候，“文”是书，“献”是人，是那些记得旧事的老人。光有书不行，还得有人。","他手里有“文”，有实册，有拓片，有丁牌。","缺的是“献”。","“宋氏。”他回过头。","宋氏一直站在楼梯口，没有跟下来。她看着掌柜，眼神很复杂。","“我有件事，一直没说。”她开口了，声音很轻。","“什么事？”","“那天在县衙后堂，我看残影，看见了三个人。”她说，“县令，簿书，还有那个写字的主修。”","“对。”","“其实是四个。”","顾阙一愣。","“残影里，看不见我自己。”宋氏说，“就像镜子里照不出我。可我昨晚在井底，摸到那些牌子的时候，想起来了。”","她看着掌柜。掌柜听不见她，只是呆呆地坐着。","“那天夜里，我在后堂。”宋氏说，“我躲在屏风后头，我看见县令说‘写零’，看见簿书的手在抖，看见那个主修写完，把笔一扔。”","“你为什么在那儿？”","“我不记得了。”宋氏说，“我只记得，我被发现了。县令看着我，看了很久，什么都没说，让我走。第二天，我回家，我家的门还在，院子还在，可是街坊看见我，都觉得面熟，谁也叫不出我是谁家的。”","“你家的户……”","“没了。”宋氏说，“从那天起，哪一本册子上，都没有宋家了。”","顾阙听懂了。","县令没杀她。他只是把她从每一本册子上划掉了。一个看见了一切的人，被划成了一个谁都不记得的人。她说的话，从此就跟风一样。","这个县里，唯一亲眼看见过“写零”的人，就站在他面前。","可这部志，不认她。","“所以，”陈小满的声音发抖，“要让宋姐姐能作证，就得先让她……上册？”","“上志。”裴照说，“主修落笔，把她写进志里，有名有姓。她就成了志上的人，她的话，就算数。”","他顿了一下。","“这就是我说的‘增’。”","楼下安静得能听见算盘珠子轻轻晃动的声音。","顾阙低头看着笔记本上那行字：嘉宁七年，丁溪县实有丁口七千零五十二，册报为零。","三样证据，差一样。","能补上这一样的人，只有一个。","唯一的办法，是写她。"]},{"id":"ch-1795214173145-0-0","title":"第28章 只许写见的","paragraphs":["样稿，用于确定文风，请勿直接发布","下午，客栈的大通铺里只剩下他们四个人。","阳光从窗纸透进来，照在桌上那本丁口实册上。顾阙坐在桌边，宋氏坐在他对面。陈小满抱着那根裂了的橡胶棍，坐在炕沿上。裴照还在他的角落里。","“我想写你。”顾阙说。","宋氏没说话。","“把你写进志里，有名有姓。”顾阙说，“你成了志上的人，你的话就算数，人证就齐了。三证齐全，七千个人就能写回来。”","“还有呢？”","“还有，你就不是零头了。账平了，你也不会被抹掉。”","宋氏看着他，看了很久。","“你知道写一个人进志，是怎么回事吗？”她问。","“你说。”","“你在志上写下几行字。”宋氏说，“从那一刻起，我就是那几行字。”","顾阙没听懂。","“志上写的，就是真的。”宋氏说，“你写我是宋家的女儿，我就是宋家的女儿。你写我二十四岁，我就是二十四岁。你写了的，我都有。”","她顿了一下。","“你没写的，我就没有了。”","屋里一下子安静了。","“什么意思？”陈小满小声问，“宋姐姐说什么了？”","顾阙把话转述了一遍，转述到最后一句，声音有点发紧。","陈小满也愣住了。","“这三百年，”宋氏说，“我记得这个县里七千零五十二张脸。卖糖人的老头少一根指头，铁匠打铁的时候哼小曲，阿七她娘骂孩子整条街都听得见。我记得四十八回进来的人，记得他们每一个是怎么走的。那只虎头鞋，是一个当娘的抱着孩子走进来的时候掉的。”","她看着顾阙。","“你能把这些全写进去吗？”","顾阙张了张嘴。","他写不进去。一部志里，一个人的条目，最多几行，几十个字。三百年，七千张脸，四十八回，怎么写？","“写不进去的，”宋氏说，“我就全忘了。”","陈小满听完转述，眼眶一下子红了。","“那、那就写多一点！”她急急地说，“顾阙，你写一大段，写满一整页！”","“写多了，也不行。”裴照在角落里开口了。","“为什么？”","“主修落笔，要有出处。”裴照说，“每一个字，都得有证据撑着。他没见过的事，没证据的事，写下去就是假的。志上的假话，比没写还糟。”","“那他见过什么？”","裴照没回答，只是看着顾阙。","顾阙低下头，开始在心里数。","他见过的宋氏。","第一天晚上，一只冰凉的手捂住他的嘴。杂物间里，她靠在门上，抱着胳膊，说话比他还噎人。她镜子里照不出来。她推得开门，一松手门就关上。她跟他握手成交，手凉得像井水。她看残影，眼睛发涩，眼白上有一个墨点。她在夹墙里抢册子，手背被刮破。她在井底，一把把他拽到身后。","还有今天，她的右手，透明得能看见后面的砖缝。","就这些。","五天。他认识她，只有五天。","“只许写你见的。”宋氏说。","她的声音很平静，像是早就想过很多遍。","“我早跟你说过。”她说，“你没真的看清我，没看清的东西写下来就是错的。你要写我，只能写这五天里，你亲眼看见的那个我。”","“那你以前的事——”","“就没了。”宋氏说，“我娘给我梳头，那七千张脸，四十八道刻痕，全没了。我就只剩下一个，五天前才认识你的我。”","“还有名字。”她又说，“志上写人，要有名有姓。我的名字，我自己都想不起来，你拿什么写？”","“我……”","“你给我起一个？”宋氏笑了一下，“你起的名字，是你的，不是我的。我顶着你起的名字活下去，那是你书里的一个人，不是我。”","陈小满听完转述，抹了一把眼泪，忍不住插嘴：“可是名字本来就是别人起的啊！我叫小满，是我奶奶起的，因为我是小满那天生的。谁的名字不是别人给的？”","宋氏愣了一下。","她转过头，看着陈小满。陈小满看不见她，只是对着那块空气，眼睛红红的，倔强地等着回答。“这丫头，”宋氏说，声音软了一点，“嘴比你还快。”","可她最后还是摇了摇头。","“给我起名字的人，是我娘。”她说，“我想不起来，可那是她起的。别人起的，不一样。”","顾阙想起李清照的一句词：物是人非事事休，欲语泪先流。","意思是，东西都还是原来的样子，人却已经不是原来的人了，什么事都完了；想开口说点什么，眼泪先流了下来。","如果他落了笔，这个县还在，客栈还在，阿七还在台阶上数石子。可坐在他对面的这个人，就不是她了。","“你不写我，”宋氏说，“我第七天会没了。可我走的时候，还记得他们。”","“你写了我，”她说，“我能活下去。可我会忘了他们。”","她站起来，走到窗边，背对着他们。","“这三百年，”她说，“这县里没有一个人记得别人。只有我记得。我要是也忘了，就真的没人记得了。”","陈小满听完，抱着橡胶棍，眼泪一颗一颗地往下掉。","“可是你会死啊……”她哽着嗓子说，“宋姐姐，你会没的……”","宋氏没回头。","“我宁可记着他们没了，”她说，“也不要忘了他们活着。”","顾阙把这句话转述给陈小满。","陈小满哭得说不出话来。","裴照在角落里，低着头，很久都没有动。过了一会儿，他说了一句，声音很低，像是说给自己听的：","“修志会里，没有人这么想过。”","顾阙看着宋氏的背影。","窗纸的光照在她身上，她的右手垂在身侧，从指尖到手腕都是透明的。透明的地方，比早上又往上爬了一点。","“宋氏。”顾阙说，“时间不够了。明天就是第七天。”","“我知道。”","“没有人证，三证就不齐，七千个人写不回来。”","“我知道。”","“你知道，你还是不让我写？”","宋氏转过身来。","她看着他，眼睛很亮，眼白上那个墨点，已经有黄豆那么大了。","“对。”她说。","“我不让你写。”"]},{"id":"ch-1795214173147-0-0","title":"第29章 拓片","paragraphs":["样稿，用于确定文风，请勿直接发布","宋氏说完那句话，就从屋里出去了。","没人去追她。陈小满抱着膝盖坐在炕沿上，眼睛还是红的。裴照看着窗外。","顾阙坐在桌边，盯着笔记本上那行字，看了很久。","然后他站起来，把工具包背上了。","“你去哪儿？”陈小满问。","“城门。”顾阙说，“那块木榜上，还有字没拓出来。”","“拓出来又能怎样？人证还是没有啊。”","“我不知道能怎样。”顾阙说，“可那是被刮得最狠的地方。被刮得最狠的，就是最要紧的。我们一直被这个县牵着鼻子走，它不让我们看什么，我们就偏要看什么。”","陈小满看了他一会儿，抹了一把脸，跳下炕：“我送你过去。城门那条路，它肯定还会耍赖。”","裴照也站了起来，没说话，跟在后面。","下楼的时候，掌柜叫住了他们。","“客官要去拓那块榜？”","“对。”","“上回客官用的锅底灰，太粗了。”掌柜从柜台底下摸出一个木匣子，打开，里面是一锭墨，乌沉沉的，边上已经磨出了一个斜面，“这是小人当年造册用的墨。松烟的，细。客官拿去。”","顾阙接过来，掂了掂。是好墨，放了这么多年，一点都没裂。","“你不怕县太爷知道？”","掌柜笑了笑，笑得很难看。","“小人的嘴，作不了证。”他说，“这锭墨，总能替小人说一句话。”","城门那条路，果然又在耍赖。","陈小满站在长街这头，深吸一口气：“广场到城门，八百六十步。我量过的。”","三步。","她站在城门下，鼻血又流了出来。这一次，她仰着头，用袖子按着鼻子，瓮声瓮气地说：“没事，没事，就是有点晕。”","“你坐着歇会儿。”顾阙说。","“我不。”陈小满说，“我要看。”","木榜还立在那儿，第一条的位置，“勿应于官”四个字后面，是一个被刮得凹下去的浅坑。","宋氏已经在了。","她站在木榜旁边，不知道等了多久。看见顾阙来，她没说话，也没走。","顾阙走到她身边，低声说：“你来了。”","“我来看我娘那句话。”宋氏说，“不是来看你。”","“我知道。”顾阙说，“你不点头，我不会写你。”","宋氏看了他一眼：“那你最好别等我点头。”","顾阙没再说什么。他蹲下来，拿放大镜对着那个坑，看了很久。","“上回为什么拓不出来？”陈小满问。","“因为墨包太大了。”顾阙说，“坑是凹下去的，我拿一个拳头大的墨包往上拍，只能拍到坑边，拍不到坑底，所以拓出来一片黑。”","“坑底还有字？”","“你看。”他把放大镜递给她。","陈小满凑过去，眯着眼看了半天：“坑底有几道更深的细缝……”","“原来的字刻得很深。”顾阙说，“刮的人把表面刮掉了一层，可刻得最深的笔画底子，还留在坑底。上回我拓的是坑，这回要拓的是坑底。”","他从工具包里拿出棉纸，撕下一小块，用喷壶喷湿，用骨刀的刀背，一点一点把纸往坑底按，按得纸紧紧贴住坑底那几道细缝。","然后他用棉花和一小块布，扎了一个只有拇指大的小墨包，把掌柜那锭墨磨在一块石头上，蘸了一点，轻轻地，一下一下地点。","不是拍，是点。像用笔尖往纸上点墨。","陈小满屏住了呼吸。","纸上，一个字的影子，慢慢浮了出来。","“当。”","顾阙的手没停。","“应。”","“于。”","最后一个字的笔画最浅，他点了很久，额头上全是汗。","“邻。”","他放下墨包，把那张小小的拓片从坑底揭下来，和上次那张拼在一起。","“日落后，有人唤名，勿应于官，当应于邻。”","城门下一点声音都没有。","“当应于邻……”陈小满念了一遍，“邻居喊你，你要答应？”","“对。”顾阙的声音有点哑，“官差喊你，不能答应。可邻居喊你，你必须答应。”","“为什么？”","“你想想这个县。”顾阙说，“第一天进城，你数过的，没有一个人叫别人的名字。他们不叫，所以也没人答。没人叫你，没人记得你，那你在这个县里，就只剩官册上的一个名字。官册说你没有，你就没有。”","陈小满慢慢睁大了眼睛。","“可要是街坊天天喊你，你天天答应……”","“那就有人记得你。”顾阙说，“官册上没你，街坊心里有你。这个县，销不掉一个被人记着的人。”","顾阙想起《孟子》里的一句话：出入相友，守望相助。","意思是，邻里之间，进进出出都像朋友一样，有事的时候互相看着、互相帮着。","这条凡例，三百年前写的就是这个道理。可它被人刮掉了，全县的人就再也不叫彼此的名字，一个一个，变成了谁也不记得的人。","“我娘说的。”","宋氏开口了。她看着那张拓片，眼睛一眨不眨。","“我娘给我梳头的时候，念的就是这句。”她说，“日落后，有人唤名，勿应于官，当应于邻。她念完，就喊我一声，我就答一声。天天都是这样。”","“她喊你什么？”","宋氏张了张嘴。","“还是想不起来。”她说，“可我想起来她喊我的那个调子了。先低，后高，尾巴往上一挑。”","她低下头，好像在心里一遍一遍地听那个调子。","裴照一直站在后面，这时候开口了：“这条规矩，有没有用，要试过才知道。”","“你就不能说点好听的？”陈小满瞪他。","“我是说，”裴照顿了一下，“值得试。”","陈小满愣了愣，没想到他会这么说，一时不知道该接什么。","“你们拓得很好。”","一个苍老的声音，从他们身后传来。","所有人都转过身。","长街上，站着一个穿官服的老人。官服褪了色，补子上的绣线起了毛。他的脸很瘦，眼窝很深，像一个很久没睡过觉的老学究。","贾三元撑着一把伞，站在他身后，低着头，不敢看他们。","杜明堂。","太阳还没落，他就站在大白天的街上，看着顾阙手里那两张拼在一起的拓片。","“主修。”他说，“你知道这一句，是谁刮的吗？”"]},{"id":"ch-1795214173147-0-0","title":"第30章 杜明堂","paragraphs":["样稿，用于确定文风，请勿直接发布","“你刮的。”顾阙说。","“是我。”杜明堂说，“刀是我拿的。”","他慢慢走过来，走到木榜前面，伸出一只干瘦的手，摸了摸那个被刮得凹下去的坑。动作很轻，像在摸一个老朋友的脸。","“可让我刮的，”他说，“是全县的人。”","陈小满忍不住了：“你胡说！谁会求你把自己的名字弄没？”","杜明堂看了她一眼，没生气。","“姑娘，你见过饿死的人吗？”","陈小满愣住了。","“嘉宁七年，一整个夏天没下一滴雨。”杜明堂说，“地里的苗，到六月就枯了。井干了，河干了。到了秋天，府里的公文下来，丁税一文不能少。”","他的声音很平，像在念一份旧公文。","“交不上的，男人抓去修河堤，死在河堤上。女人卖到外县，孩子卖给人牙子。城东有一户，一家五口，男人被抓走，女人带着三个孩子，吃了半个月的观音土，最后一个都没剩下。”","“所以你报了零。”顾阙说。","“我报了零。”杜明堂说，“报上去，册上没有人，就不用交税。可是府里不信，派人来查。”","“查验。”顾阙说。","“对。查验的人要来县里走一趟，看看是不是真的一个人都没有。”杜明堂说，“县里明明住着七千人，人是藏不住的。可是有一样东西，能藏。”","顾阙明白了。","“名字。”","“名字。”杜明堂说，“官府认人，只认名字。看见一个人不算数，叫得出他的名字、对得上册子，才算数。查验的人走在街上，只要听见一声‘王有田’，一声‘李大’，就知道这县里有人，有名有姓，报的零是假的。”","“所以你让全县的人，不许叫名字。”","“我把乡老都叫到县衙。”杜明堂说，“六十多个白头发的老人，跪在堂下。我跟他们说了，他们哭着点头。从那天起，谁也不叫谁的名字。凡例上那一句‘当应于邻’，是我当着他们的面，一刀一刀刮掉的。”","“查验的人来了，走了一圈，满街的人，没有一个叫得出名字。他回去报：丁溪县，并无丁口。”","他转过身，看着顾阙。","“那一年，丁溪没有一个人因为交税饿死。”","城门下很安静。","顾阙想起《诗经》里的一首歌：硕鼠硕鼠，无食我黍。","意思是，大老鼠啊大老鼠，别再吃我种的黄米了。古时候的老百姓，把收税收得太狠的官，比作偷粮食的大老鼠。","三千年前的人就在这么唱。三百年前，丁溪县的人，连唱都不敢唱，只敢不叫自己的名字。","“你问过他们吗？”","是宋氏。她站在杜明堂面前，离他不到一步，声音冷得发抖。","顾阙把这句话转述了。","杜明堂沉默了一会儿。他的眼睛没有看宋氏站的地方，可是他好像知道她在那儿。","“问过。”他说，“六十多个乡老，一个一个问过。”","“我娘没被问过。”宋氏说，“我没被问过。阿七没被问过。那七千个人，你问了几个？”","顾阙转述了。","杜明堂没有回答。","“那后来呢？”陈小满问，“熬过了那一年，为什么不改回来？为什么现在还要一个一个地销人？”","“因为写下来的才算数。”杜明堂说，“册上是零，县就要对账。这本志自己会纠错，你们都看见了。我不点，到了第七天天亮，它也会一口把账吞平。你们灭了我的灯，这几天县里是没少人，可明天一早，剩下的五千九百一十一个，一个都留不住。我一个一个地点，至少每一个，我都看着他走。”","“那郝大哥呢？”陈小满的声音一下子拔高了，“他不是你们县的人！他就是来给闺女送饺子的！”","杜明堂看着她。","“外账也要平。”他说，“这是志的规矩，不是我的。”","陈小满气得浑身发抖，说不出话来。","一直撑着伞的贾三元，这时候小声开口了：“小满，县太爷说的……其实也有道理。他也是没办法……”","“你闭嘴。”陈小满说。","贾三元闭上了嘴，伞往下压了压，挡住了自己的脸。","“我只是想活着回去。”过了一会儿，他在伞底下小声说，不知道是说给谁听的，“我妈还在老家等我过年。”","没人接他的话。","“主修。”杜明堂转向顾阙，“你要把七千零五十二个人写回去，对吧？”","“对。”","“你写回去，册上就有了七千零五十二个人。”杜明堂说，“有了人，就要交税。嘉宁七年的丁税，嘉宁八年的，九年的，三百年的丁税，一文不少，全记在册上。”","顾阙的心往下一沉。","“你把他们写回去，”杜明堂说，“就是把他们写回那个没有雨的夏天。你让阿七她娘，再去吃一次观音土。”","“那也不是你替他们决定的理由！”陈小满喊。","“那是谁替他们决定？”杜明堂问，“你？还是他？”","他看着顾阙。","“零，是他们的太平。”他说，“不疼，不饿，不交税。答应一声，就过去了。”","裴照一直站在后面，这时候说了一句话。","“他说的，都是真的。”","陈小满猛地回头看他。","“他没撒谎。”裴照说，“修志会见过很多旧说。撒谎的，一眼就看得出来。他不是。”","顾阙握着那两张拓片，手心里全是汗。","他一直以为，这是一个坏人做了一件坏事，他要做的，就是把它改回来。","可是现在，他不知道了。","杜明堂看着他，眼神里没有得意，只有一种很深很深的疲惫。和周铎当时站在照壁前说“我还是信纸”的时候，一模一样。","“你不信我，也没关系。”杜明堂说，“三百年前，你也不信。”","顾阙愣住了。","“你也站在这儿。”杜明堂说，“站在这块榜前面，问我同样的话。我跟你讲了一遍，就是今天这一遍。”","他转过身，慢慢往县衙的方向走。走了几步，停下来，没有回头。","“然后你回到后堂，自己提起笔，写了那个零。”"]},{"id":"ch-1795214173148-0-0","title":"第31章 第七夜","paragraphs":["样稿，用于确定文风，请勿直接发布","回客栈的路上，谁都没说话。","走到一半，陈小满终于忍不住了：“顾阙，他说的……是真的吗？你真的写过那个零？”","“我不知道。”顾阙说。","“你不记得？”","“我不记得。”顾阙说，“可残志最后一页，落款是我的字。宋氏在残影里看见的那个人，写‘阙’字的毛病，跟我一模一样。”","陈小满不说话了。","宋氏走在顾阙身边，过了很久，才开口：“三百年前那个你，听完他那一番话，回去写了零。”","“嗯。”","“今天这个你，也听完了。”宋氏说，“你会写什么？”","顾阙没有回答。","太阳落得很快。他们走进客栈的时候，天边只剩最后一道灰白。","大通铺里，裴照把话说得很清楚：","“今晚是最后一夜。天一亮，第七天，账就要平。县里五千九百一十一个人，归零。外账上剩下的，顾阙、陈小满、我，也一样。”","“贾三元呢？”陈小满问。","“他现在是本县丁口。”裴照说，“县太爷保不保他，看县太爷。”","“那我们怎么办？”","“两个办法。”顾阙说，“第一，天亮之前，我把三证凑齐，落笔，写七千人回来。可人证还差一样。”","他没有看宋氏。宋氏也没有看他。","“第二，”顾阙说，“试一试‘当应于邻’。如果街坊之间互相喊名字、互相答应，就能让一个人被记住，那也许，天亮的时候，这个县就吞不掉他们。”","“也许？”","“我不知道有没有用。”顾阙说，“没人试过。”","“那就先在我们身上试！”陈小满说。","她站起来，看着顾阙，清了清嗓子：“顾阙！”","顾阙看着她。","“你得答应啊。”陈小满说，“当应于邻。我是你邻居。”","“在。”顾阙说。","陈小满笑了，眼睛还肿着：“好，该你喊我了。”","“陈小满。”","“在！”","她又转向角落：“裴照！”","裴照看着她：“那不是我的名字。我答了，也没用。”","“那你真名叫什么？”","裴照沉默了一会儿：“卷终再说。”","“小气。”陈小满撇撇嘴，又转向顾阙身边那块空气。她犹豫了一下，还是喊了出来：“宋姐姐！”","宋氏愣住了。","“宋姐姐”不是名字。这一声，什么都证明不了。","可她还是轻轻答了一声：“在。”","陈小满听不见。顾阙听见了。","“还有一个人。”陈小满忽然说。她抱起丁口实册，翻到县衙那几页，手指一行一行地往下找，“找到了。县衙簿书房，钱守仁，一口。”","她抱着册子跑下楼。掌柜正在柜台后面收拾算盘，准备关门。","“钱守仁！”陈小满站在楼梯上喊。","算盘珠子哗啦一声，散了一桌子。","掌柜抬起头，看着她，脸上的肉一抖一抖的，嘴张了半天，没出声。","“你得答应啊。”陈小满说，“当应于邻。我们住你店里五天了，也算你邻居。”","掌柜的眼眶一点一点地红了。","“三百年了……”他说，声音哑得厉害，“三百年，没人叫过小人的名字。”","他站直了身子，两只胖手按在柜台上，像在公堂上回话一样，郑重地答了一声：","“在。”","陈小满跑回楼上，冲顾阙比了一个剪刀手：“又多一个。全县五千九百一十一个，我们先喊上一个。”","天黑了。","掌柜闩好了大门。顾阙想起一件事：要是今晚真要出门挨家挨户去喊，那扇大门，只有宋氏推得开。","“我下楼看看门。”他说，“宋氏，你跟我来。小满，你待在屋里，别出去。”","“知道啦。”陈小满挥了挥手，“我数数。”","楼下黑漆漆的。掌柜不在柜台后面，后屋的门关着。","宋氏走到大门前，伸手推了推。门开了一条缝，她一松手，门又合上了。","“推得开。”她说，“可一个一个推，推到天亮，也推不完全县的门。”","“我知道。”","锣声响了。","从街那头，直直地朝客栈过来，停在了门口。","“陈——小——满——”","隔着一道门板，顾阙听见那个拖长的声音。声音底下，是贾三元在提词，又快又轻。","顾阙的手攥紧了。","他想起曹植的两句诗：本是同根生，相煎何太急。","意思是，豆子和豆秸本来是从同一条根上长出来的，豆秸在锅底下烧，豆子在锅里煮，为什么要这么急着互相残害？","贾三元跟他们，是一起从那条三里路走进来的人。吃过同一个保温桶里的饺子。","楼上没有声音。小满没有答。","“好丫头。”宋氏低声说。","唱名声又喊了一遍，又停了。","然后，门外换了一个声音。","不是差役的干哑嗓子，也不是贾三元。那个声音不高，有点冷淡，说话很短，像是不太愿意多说一个字。","“小满。”","顾阙浑身的血一下子凉了。","那是他自己的声音。","“小满，下来一下。”门外那个声音说，“帮我量一下这扇门。”","楼上，传来一阵脚步声，停在了大通铺的门后。入了夜，门打不开，她只能隔着门板听。","“别答！”顾阙冲着楼上喊。","几乎在同一个瞬间，门外那个声音也喊了起来，一模一样的调子，一模一样的冷淡：","“别答！楼下那个是假的。小满，答我。”","顾阙一下子明白了。他喊什么，它就学什么。两个顾阙在喊她，她隔着门板，分不清哪一个是真的。","他转身往楼梯冲。","楼梯在黑暗里很长。他一步跨两级，膝盖撞在扶手上，疼得眼前发黑。","门外那个声音，不紧不慢地说：","“小满，当应于邻。我是你邻居。”","那是她一个时辰前，亲口跟他说的话。","贾三元在门外，压着嗓子，小声说了一句：","“对不起，小满。我得活。”","顾阙冲到了楼梯口。","大通铺的门还关着。门后面，他听见裴照的声音，第一次那么急：“等一下——”","太晚了。","陈小满听见了“当应于邻”。听见了那个熟悉的、冷淡的、她今晚刚刚喊过一遍的声音。","她隔着门板，大声答了一个字：","“在！”"]},{"id":"ch-1795214173149-0-0","title":"第32章 喊回来","paragraphs":["样稿，用于确定文风，请勿直接发布","那个“在”字落下去的瞬间，顾阙脑子里又被橡皮擦了一下。","比前几次都重。","他站在大通铺门口，看着那扇关着的门，忽然想不起来，自己为什么要跑上楼。","门后面有一个人。他知道。可那个人是谁？","“推门。”宋氏在他身后说，“快。”","她伸手一推，门开了。","屋里很暗，窗纸透进来一点灰光。一个女孩站在门后面，穿着白色的羽绒服，扎着一个歪掉的丸子头。","她的样子很奇怪。不像周铎那样，一答应就没了。她还站在那儿，可是整个人淡得像一张被水泡过的画，从脚往上，一点一点地变透明。透过她的羽绒服，能看见后面的炕沿。","裴照站在屋子中间，看着她，眉头拧得很紧。","“她是谁？”裴照说。","顾阙心里一沉。连裴照都忘了。","女孩看着他们，嘴唇动了动，声音轻得像从很远的地方传过来：","“顾阙……刚才是你喊我吗？”","她认得他。可他想不起她了。","顾阙伸手去摸口袋里的笔记本，摸到了，却看不清上面的字。屋里太暗了。","“宋氏。”他的声音在发抖，“她叫什么？”","“陈小满。”","宋氏一个字都没有犹豫。",
