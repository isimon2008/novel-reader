"“陈小满，大二，学测绘的。”她说得又快又稳，“紧张就数东西，从客栈到照壁数过三百一十二步。穿兔子拖鞋。郝建国替她答过一声‘在’，她抱着他的保温桶哭了一夜。今天下午，她把广场到城门八百六十步，三步走完了，流了一脸鼻血还说没事。一个时辰前，她站在这屋里喊你的名字，让你答应，说‘当应于邻，我是你邻居’。”","宋氏是这个县里唯一一个规矩管不到的人。她什么都不会忘。","顾阙听着这些话，一句一句，像有人把被擦掉的字，重新一笔一笔描了回来。","陈小满。","兔子拖鞋，歪丸子头，紧张就话多，一边哭一边说“这是我这辈子吃过最好吃的凉饺子”。","他想起来了。","“为什么她还没走？”顾阙问，“周铎答应了，一下子就没了。”","裴照盯着陈小满那半透明的身子，忽然明白了什么。","“因为今晚，她被人喊过。”他说，声音很快，“你喊过她，她答过你。她喊过掌柜，掌柜答过她。她是被邻居记着的人。官差一下子，销不干净。”","“周铎呢？”顾阙问，“郝建国呢？”","“进城这几天，你们叫他周老师，叫他郝哥。”裴照说，“周铎、郝建国，这两个名字，除了官差，谁当面喊过一声？他们又答过谁？”","顾阙答不上来。","“没人喊过，账上就轻。”裴照说，“官差一喊，一答，一笔就划干净了。她不一样。今晚你喊过她，她答了；她喊过掌柜，掌柜也答了。她在这个县里，有人记着。”","“那就是说——”","“当应于邻。”裴照说，“是真的。”","陈小满的身子又淡了一层。她低头看着自己的手，手已经透明到手腕了。","“顾阙……”她小声说，“我好像……有点冷。”","“小满，你听好。”顾阙说，“刚才门外那个，不是我。现在这个，是我。”","“我知道。”她笑了一下，笑得很淡，“你刚才在楼下喊‘别答’，我听出来了。可外头那个，也喊‘别答’……我就分不清了。”","“这次你分得清。”","顾阙走到她面前。","他想起《楚辞》里有一篇，叫《招魂》，里面一遍一遍地喊：魂兮归来。","意思是，魂啊，你回来吧。","古时候，一个人病得快不行了，家里人就爬到屋顶上，拿着他的衣服，朝着北边喊他的名字，一遍一遍地喊，想把他的魂喊回来。","那时候的人相信，名字被亲近的人喊着，人就走不远。","顾阙深吸了一口气。","“陈小满。”","他喊得不大声，可是一个字一个字，都喊得很清楚。","陈小满看着他。她的嘴唇动了动，声音很轻很轻，像是从水底浮上来的：","“……在。”","什么都没有发生。","顾阙的心一下子揪紧了。","然后，他看见了。","从她的手腕开始，那层透明慢慢地往下退。像退潮一样，手掌有了颜色，手指有了颜色，羽绒服重新白了起来，兔子拖鞋上的泥点也看得见了。","一眨眼，她整个人，结结实实地站在了他面前。","陈小满低头看看自己的手，又摸摸自己的脸，愣了好几秒。","然后“哇”的一声哭了出来。","“我回来了？”她一边哭一边说，“我是不是回来了？”","“你回来了。”顾阙说。","裴照站在旁边，看着她，眉头一点一点地松开了。","“陈小满。”他说。","陈小满抽抽搭搭地抬起头：“干嘛？”","“没什么。”裴照说，“我记得了。”","陈小满愣了一下，哭得更厉害了。","楼梯上响起一阵急促的脚步声。掌柜提着算盘，气喘吁吁地爬了上来，入了夜门推不开，他就隔着门板问。","“客官们……都还在？”","“钱守仁！”陈小满带着哭腔喊了一声。","“在，在。”掌柜在门外连声答应，长长地出了一口气，“姑娘方才答应那一声，小人在楼下，算盘上一颗珠子自己掉下去了。小人还当姑娘也跟外账上销掉的那两位一样了……”","门外传来算盘珠子哗啦哗啦的响声。","“刚才又自己跳回来了。”掌柜说，“小人打了三百年算盘，头一回见珠子往回跳。”","窗外，门口的锣声乱了一下，敲错了一个拍子。","那个学顾阙说话的声音，没有再响起来。","顾阙走到窗边，从窗纸的破洞往下看。客栈门口，两个纸脸差役站在那儿，“差”字一鼓一瘪，像是在算一笔怎么也算不清的账。","贾三元站在它们旁边，仰着头，看着楼上这扇窗户。","他脸上的表情，顾阙看清了。","不是失望。是害怕。","一个答应了官差的人，被邻居喊了一声，就回来了。","那他自己呢？他答应过县太爷，入了县太爷的册。这个县里，还有没有一个邻居，会喊他一声？","锣声响了一下，往远处去了。贾三元跟在后面，走得很慢，回头看了好几次。","顾阙转过身。","屋里，陈小满已经不哭了，正在用袖子使劲擦脸。裴照靠在墙上。宋氏站在门边，看着陈小满，嘴角翘着，眼睛却是红的。","“真的有效。”顾阙说。","他看向窗外那片黑漆漆的县城。","五千九百一十一个人，关在一扇一扇的门后面，谁也不叫谁的名字，已经三百年了。"]},{"id":"ch-1795214173150-0-0","title":"第33章 满街","paragraphs":["样稿，用于确定文风，请勿直接发布","“五千九百一十一个人。”陈小满说，“一千多户。我们四个，一户一户去喊，喊到天亮也喊不完。”","“不用我们喊完。”顾阙说，“我们只要喊第一声。”","“什么意思？”","“我们隔着门喊‘王有福’，整条街的人都听得见。”顾阙说，“隔壁那户，就知道了，原来隔壁住的叫王有福。他们三百年没叫过彼此的名字，不是不想叫，是不知道叫什么。我们把名字递给他们，让他们自己喊。”","“一传十，十传百。”裴照说。","“可我们也不知道名字啊。”陈小满抱着那本厚厚的实册，“一千多户，我一页一页翻，翻得过来吗？”","门外传来一个声音。","“小人背得出来。”","是掌柜。他还站在门外，没走。","“全县七千零五十二口，是小人一笔一笔造的册。”掌柜说，“哪条街，哪一户，户主叫什么，家里几口人，小人闭着眼睛都背得出来。三百年了，夜里睡不着，就背这个。”","陈小满看看顾阙，顾阙点了点头。","“那，钱守仁，”陈小满说，“你跟我们一起走。”","门外安静了一会儿。","“在。”掌柜说。","宋氏推开了客栈的大门。","夜里的县城，黑得像一口井。路面泛着那层熟悉的灰白，两边的门一扇一扇紧闭着，没有一点声音。","“从哪儿开始？”陈小满问。","“城隍庙街。”顾阙说，“李家。”","陈小满站在客栈门口，看着黑漆漆的长街，深吸了一口气：“客栈到城隍庙街，我白天量过，五百四十步。”","三步。","他们站在了城隍庙街口。陈小满抹了一把鼻子底下的血，咧嘴笑了笑：“还行，这次流得少。”","李家的门关着，和别的门一样。","陈小满走到门前，清了清嗓子，喊：","“阿七！”","门里没有声音。","“阿七，是我，小满姐姐！”她又喊，“当应于邻，我是你邻居！你答应我一声！”","过了好一会儿，门里传来一个很小、很迟疑的声音：","“……在。”","陈小满一下子捂住了嘴，眼泪先下来了。","“小满姐姐，”门里的声音又问，“那我娘呢？我喊她，她能答吗？”","陈小满张着嘴，说不出话来。","“你娘已经不在县里了。”顾阙替她回答，“等天亮，我想办法把她写回来。到时候，你喊她，她就能答你。”","门里安静了一会儿。","“那我天天喊。”阿七说，“王氏，第四千三百零六个。我天天喊。”","“阿七，你听好。”顾阙在旁边说，“你左边那户，户主叫什么？”","掌柜马上接上：“左边，赵家。户主赵大成，妻孙氏，子二人，赵小栓，赵二栓。”","“阿七，”顾阙说，“你喊一声，赵大成。”","门里安静了一会儿。然后，那个小小的声音，用尽全身力气，喊了出来：","“赵——大——成——！”","隔壁的门里，有人猛地一动，撞翻了什么东西。","过了很久，一个男人的声音，哑哑地、像是很多年没说过话一样，答了一声：","“……在。”","紧接着，那扇门里，一个女人带着哭腔喊：“大成？你叫大成？你叫大成啊！”","“在！在！”","顾阙想起陶渊明的《桃花源记》，里面写那个与世隔绝的村子：阡陌交通，鸡犬相闻。","意思是，田间的小路四通八达，这家的鸡叫，那家的狗叫，彼此都听得见。","那是一个邻里相闻、彼此都知道的地方。丁溪县三百年来，什么都听不见。","现在，它听见了。","“下一户！”陈小满已经跑到了赵家门口，“赵大成，你右边那户，叫什么？”","掌柜报出名字，赵大成在门里喊出来，那户人答应了，又去喊下一户。","一户，又一户。","声音像一串鞭炮，从城隍庙街的这头，一路炸到那头，又拐进了旁边的巷子。","“孙二娘！”","“在！”","“刘老栓！”","“在！在！”","有人喊着喊着，忽然哭了：“我想起来了！我叫周顺！我爹叫我顺子！”","有人隔着墙喊：“对门的！你叫什么？你告诉我，我喊你！”","陈小满跑在最前面，掌柜跟在她后面，胖胖的身子跑得直喘，嘴里一刻不停地报着名字。他一边报，一边哭，眼泪顺着圆圆的脸往下淌，声音却一点都没有乱。","“小人造了三百年的假账。”他边跑边说，“今晚，总算报了一回真数。”","裴照站在巷子口。","他没有碰任何东西，也没有往门前凑。他只是站在那儿，听着满街的名字。","然后，顾阙听见他开口了，声音很低，对着巷子里最后一扇没人喊到的门：","“吴老三。”","门里，一个老人颤巍巍地答了一声：“在。”","裴照站了一会儿，什么都没说，转身去了下一条巷子。","顾阙看着这一切，转过头，想找宋氏。","宋氏站在街中间，站在满街的喊声里。","她看着那些门，一扇一扇，被名字喊开，又被答应声填满。她的嘴唇轻轻动着，好像在跟着念每一个名字。她认识他们每一个人。三百年来，她一直认识。","顾阙走到她身边。","“周顺。”宋氏说，像是自言自语，“卖豆腐的。他娘生他那年发大水，所以叫顺子，图个顺。”","“你记得？”","“我记了三百年。”宋氏说，“他自己都忘了，我还记得。”","巷子里，那个叫周顺的人还在喊：“我叫周顺！我爹叫我顺子！”喊着喊着，隔壁有人接了一句：“顺子！你娘那年是不是发大水？”","“是！是！”","宋氏不说话了。","她又往前看。赵大成的媳妇隔着墙，一样一样地数她男人小时候的事。刘老栓的邻居，喊出了刘老栓三个儿子的小名，一个都没错。这些事，三百年来，只有她一个人记着。","现在，他们自己记起来了。","“他们用不着我了。”她说。","声音很轻，听不出是高兴，还是别的什么。","顾阙看着她。他想起昨天她站在窗边说的话：这县里只有我记得。我要是也忘了，就真的没人记得了。","可现在，满街都是记得的人。","“那你呢？”他问。","宋氏没回答。","满街的人，喊来喊去，没有一个人喊她。","没有人知道该喊她什么。","顾阙张了张嘴，又闭上了。他也不知道。","宋氏低下头，看着自己的右手。透明已经爬到了胳膊肘，她试着攥了一下拳头，攥不太拢。","她看了很久。","然后，她抬起头，冲他笑了一下，摆摆手，意思是：别管我，继续。","可是那一下笑，顾阙看见了，嘴角是往上的，眼睛没有。","“顾阙！”陈小满在前面喊，“这条街喊完了！下一条！”","顾阙收回目光，跟了上去。","他们刚拐进下一条街，锣声就响了。","不是一面锣。","是很多面。","从县衙的方向，从四面八方，当，当，当，乱成一片，越来越近。","长街的尽头，出现了第一张纸脸。","然后是第二张，第三张。黑色的长褂，弯着腰，纸脸上写着墨黑的“差”字。它们从县衙那边涌出来，一排接一排，挤满了整条街，像一场黑色的潮水，朝着满街的喊声扑了过来。","县里所有的唱名差，全出来了。"]},{"id":"ch-1795214173151-0-0","title":"第34章 第七日","paragraphs":["样稿，用于确定文风，请勿直接发布","“关门！”掌柜第一个喊出来，“各家各户，把门关严！”","纸脸差役已经涌到了街口。最前面那一个停在赵家门前，纸脸上的“差”字鼓了一下。","然后，它开口了。","“大——成——”","不是差役那种干哑的嗓子。是一个女人的声音，带着一点哭腔，跟刚才孙氏喊他的调子一模一样。","门里，赵大成想都没想：“在！”","陈小满的脸一下子白了：“它学孙氏的声音！”","赵家的门缝里，一点光都没有。可顾阙看见了，门缝底下，赵大成的影子，正在一点一点地变淡。","“大成！”这一回是真的孙氏，声音尖得发颤，“大成你别吓我！”","“在……在！”","门缝底下的影子，又一点一点地浓了回来。","陈小满愣住了：“回来了？”","“跟你昨晚一样。”裴照说，“答错了，再喊回来就是。”","“那就是……拉锯？”","“对。”裴照说，“它喊一个，我们喊一个。喊到三更鼓响，唱名就停了。”","“三更还有多久？”","“一个多时辰。”","陈小满咬了咬牙，转身冲着整条街喊：“大家听着！听见名字就答，答错了也别怕！邻居再喊你一声，你再答一声，就回来了！谁家边上的人变淡了，就喊他！使劲喊！”","一条街的门里，乱七八糟地答应：“知道了！”","街上一下子吵成了一锅粥。差役喊一声，人淡下去；邻居喊一声，人浓回来。","“不够快。”顾阙说。","他看见巷子深处，有一扇门底下的影子已经淡得快看不见了，可是没有人喊他。","“那一家，边上没人。”宋氏在他身边说，“左边那户是空的，右边那户，前几天夜里就销掉了。他只有一个邻居，是那个卖糖人的。”","“卖糖人的？”","“左手少一根指头的那个老头。”宋氏说，“我看着他三百年了。就是他。”","顾阙一把拉住掌柜：“东边巷子，第四扇门，卖糖人的，左手少一根指头。叫什么？”","掌柜连想都没想：“孙有余！东巷第四户，孙有余，独一口！”","“孙有余！”陈小满扯着嗓子喊。","那扇门里，一个苍老的声音迟疑地答：“……在。”","影子浓了回来。","“下一个。”宋氏说，她的眼睛飞快地扫过一扇一扇门，“西头井台边上，那家的媳妇，脸上有颗痣。”","“西头井台，刘家，媳妇刘周氏！”掌柜说。","“刘周氏！”","“在！”","就这样，宋氏认脸，顾阙传话，掌柜报名，陈小满喊。","裴照没有跟着喊。他站在街中间，所有的纸脸差役经过他身边，都绕开半步。他就那么站着，看着哪扇门底下的影子变淡了，就伸手一指。","锣声里，有一个声音，忽然变得不一样了。","“三——元——”","顾阙转过头。","贾三元站在差役堆里，撑着那把伞，脸一下子僵了。","那个声音，是一个老太太。说话带着很重的口音，调子拖得长长的，像是站在村口喊孩子回家吃饭。","“三元——回来过年了——”","贾三元的嘴唇哆嗦了一下。","“那是我妈。”他小声说，“那是我妈的声音。”","他是县太爷册上的人。县太爷不点他，可是今晚，全县的差役都出来了，它们不挑。","贾三元往后退了一步，又退了一步，退到了街边，背靠着墙。他抬起头，看着不远处的陈小满。","“小满。”他的声音在发抖，“你喊我一声，行不行？”","陈小满停了下来。","“你喊我一声。”贾三元说，“你喊我，我就不答它。我就答你。当应于邻，对吧？咱们是一起进来的，咱们也算邻居……”","陈小满看着他。","她张了张嘴。","顾阙看见她的手攥着那根裂了的橡胶棍，攥得指节发白。那是郝建国的棍子。昨天晚上，就是这个人，用顾阙的声音，把她骗到了门后。","她没有出声。","她把头转了过去。","“三元——”老太太的声音又响了，“你咋不应妈呢——”","贾三元看向顾阙。顾阙没说话。","他又看向裴照。裴照看着他，像看一页早就读过的书。","街上那么多人在喊名字，一声接一声。","没有一声，是喊他的。","贾三元慢慢抬起一只手，捂住了自己的嘴。","就像第一天晚上，宋氏捂住顾阙的嘴一样。只不过这一次，那只手是他自己的。","他捂着嘴，蹲在墙根底下，肩膀一抽一抽的，一声都没有出。","“当——当——当——”","三更鼓响了。","锣声停了。","所有的纸脸差役同时站住，转过身，一排一排往县衙退回去。","街上安静了。","贾三元放下手，站起来，脸上全是眼泪和鼻涕。他没看任何人，撑起伞，跟在最后一个差役后面，往县衙走去。","“没人喊我。”他走过陈小满身边的时候，说了一句。","不是质问，也不是抱怨，就是说了一句。","陈小满低着头，一直到他走远了，都没有抬起来。","他们在街上，一直等到了天亮。","天亮是一瞬间的事。","前一刻，四周还黑得像墨；下一刻，整片天唰的一下，白了。","顾阙想起李贺的一句诗：雄鸡一声天下白。","意思是，公鸡叫了一声，天底下就亮了。","可是今天，没有鸡叫。","天亮了，可那不是天光。","陈小满仰着头，嘴慢慢张开了。","天上铺着一页纸。","大得盖住了整座县城，四个角压在城墙外面。纸上是竖排的字，每一个都比一间房子还大。","“丁溪县，丁口……”","最后一个字，写在正当中，墨黑墨黑的。","“零。”","“官册。”掌柜的声音在抖，“是小人写的那一页官册。”","“它要干什么？”陈小满问。","“对账。”掌柜说，“第七日，账要平。”","城门的方向，传来一阵很轻的沙沙声，像是有人在翻书。","顾阙往那边看。","城墙不见了。","城墙那一块，变成了一片白，像是被橡皮从纸上擦掉了。白色正在往城里走。挨着城墙的第一排房子，屋顶先白了，然后是墙，然后是门。","“那排房子里有人！”陈小满喊，“昨晚他们答应过的！有人喊过他们的！”","“没用。”裴照说。","“当应于邻，防的是官差。”裴照说，“防不了账。现在来收的不是差役，是这本志自己。账要平，只有一个办法：改账。”","“多久？”顾阙问。","陈小满盯着那片白，嘴里飞快地数着。","“一刻钟，往里走一条街。”她说，“城门到广场，我量过，八百六十步，九条街。到县衙，大概……午时。”","“午时之前。”顾阙说，“三证落笔。”","“人证呢？”陈小满问。","没人回答。","照壁那边，有人慢慢走过来。","是杜明堂。他站在街口，看着那片白色，看了很久。","“我在后堂听了一夜。”他说，“三百年了，第一次听见这么多名字。”","“那就别让它吞了他们！”陈小满说。","“不是我让的。”杜明堂说，“零是写下的，写下的才算数。我当年写了零，今天就是零。”","他转过头，看着顾阙。","“你要改，就去改。”他说，“只是你要想好。零，才是他们的太平。”","他慢慢往县衙走回去。","顾阙站在原地，没有动。","一只手，拉了拉他的袖子。","很凉。","顾阙转过头。宋氏站在他身边，脸色很白。她的右手，透明的地方已经过了胳膊肘，爬上了肩膀。","“顾阙。”她说。","“嗯。”","“昨晚满街的人，都有人喊。”她说，“就我没有。”","她看着他，眼白上那个墨点，已经有指甲盖那么大了。","“你给我起个名字吧。”"]},{"id":"ch-1795214173152-0-0","title":"第35章 佚","paragraphs":["样稿，用于确定文风，请勿直接发布","顾阙看着她，一时没说出话来。","“你说过，”他说，“你宁可记着他们没了，也不要忘了他们活着。”","“我说过。”宋氏说，“那是因为，这县里只有我记得他们。”","“昨晚你也看见了。”她说，“赵大成记得孙氏，孙氏记得赵大成。卖糖人的孙有余，以后有人叫他了。他们一个一个，自己喊回来了。”","她笑了一下。","“他们用不着我记了。”","顾阙喉咙发紧。","“现在这个县里，只有我，没人喊。”宋氏说，“你说得对，我不能就这么没了。我没了，谁去作证？”","陈小满在旁边急得直跺脚：“她说什么？宋姐姐说什么了？”","顾阙转述了。","陈小满听完，眼泪一下子涌了出来，冲着那块空气使劲点头：“好，好！宋姐姐，你答应了就不许反悔！”","“这丫头。”宋氏说。","“写人进志，也要三证。”裴照说，“写七千人要三证，写她一个也一样。而且要快，那片白，一刻钟一条街。”","“文证有。”顾阙说。","他翻开丁口实册，翻到最后一页。最末尾，那行后补的小字还在：","“宋氏，失其名。”","“掌柜写的。”顾阙说，“册上有她。没有名字，可有她这个人。”","“物证呢？”","顾阙看向宋氏。","宋氏没说话，抬手拔下了头上那根木簪子，递给他。","簪子很旧了，木头被摸得发黑，上面刻着一道一道的痕，一共四十九道。","“我娘给我的。”宋氏说，“嘉宁七年以前，就在我头上了。”","“人证。”裴照说，“要一个志上有名的人，站出来说，宋家确实有这么一个女儿。”","“县里谁还记得宋家？”陈小满问，“三百年了，谁都不叫谁的名字……”","“昨晚以前，没有。”顾阙说。","他看着宋氏：“你家住在哪儿？”","“城隍庙后头。”宋氏说，“一条小巷子，巷口有棵枣树。东边隔壁，是吴家。”","裴照忽然抬起了头。","“城隍庙后头那条巷子，”他说，“昨晚最后一扇没人喊的门。”","“吴老三。”顾阙说。","“我喊的。”裴照说。","陈小满已经站到了路中间，抹了一把鼻子，深吸一口气：“这里到城隍庙，我量过，四百二十步。”","三步。","鼻血流了下来，她仰着头，用袖子堵住，瓮声瓮气地说：“走，快走。”","巷口果然有一棵枣树，树叶早落光了，枝子黑黑的，伸到半空。","吴老三坐在自家门槛上，是个很瘦的老头，下巴上一撮白胡子，好像一夜没睡。","看见他们来，他愣了一下，然后慢慢站了起来。","“你们是……昨晚喊我的那几位。”","“是。”顾阙说，“老人家，我想问您一件事。”","“您问。”","“您家西边隔壁，以前住的是谁？”","吴老三转过头，看着隔壁。","隔壁是一个空院子。门板歪着，院墙塌了一角，院子里长满了枯草。","他看了很久。","“宋家。”他说。","宋氏站在顾阙身边，一下子不动了。","“三百年，我天天坐在这门槛上，天天看着这个院子，就是想不起来，这院子是谁家的。”吴老三说，“昨晚，有人喊了我一声吴老三。我答了一声在。答完了，我就想起来了。”","“想起什么了？”","“宋家。”吴老三说，“宋家有个丫头。梳两条辫子，嘴快得很，老爬我家这棵枣树偷枣，摔下来也不哭，拍拍土还骂我家的狗。”","宋氏的眼睛红了。","“她娘，”吴老三说，“天天太阳一落山，就站在门口喊她回家。一天都不落下。那一声，先低，后高，尾巴往上一挑。”","宋氏的嘴唇抖了一下。","那是她在城门下，想起来的那个调子。","“喊的什么？”顾阙问，“那丫头叫什么？”","吴老三张了张嘴，脸憋得通红，最后摇了摇头。","“想不起来。”他说，“那两个字，就跟被虫子啃了一样，一个空。”","他抬起头，看着顾阙，眼睛浑浊，可是很认真。","“可那丫头是真有的。”他说，“我拿我这颗白头担保。宋家有个丫头。”","裴照在旁边，轻轻吐出一口气：“人证。”","三证齐了。","“还差一样。”宋氏说。","她看着顾阙：“名字。”","顾阙想了很久。","陈小满在旁边小声说：“要不……叫宋小满？我的名字借她一半。”","宋氏一下子笑出了声，笑着笑着，眼泪掉了下来：“去你的。”","顾阙没有笑。","“我给你起的，不是你娘起的那个。”他说，“那个，我找不回来了。”","“我知道。”","“所以我想给你起一个，让人一看就知道，你丢过一个名字。”顾阙说，“佚。”","“哪个佚？”","“单人旁，一个失去的失。”顾阙说，“古书丢了，叫散佚。不知道作者是谁的诗，署名叫佚名。这个字的意思，就是丢了。”","他顿了一下。","“可是丢了的东西，是有过的。没有过的东西，丢不了。”","宋氏看着他，没说话。","“这个字，还有一个念法。”顾阙说，“古书里，它通安逸的逸，是安安稳稳、不用再提心吊胆的意思。”","顾阙想起屈原在《离骚》里写他自己的名字：皇览揆余初度兮，肇锡余以嘉名。","意思是，父亲看着我出生的时辰，想了又想，给了我一个好名字。","他不是她的父亲，也不是她的娘。他只是一个修书的人，能给她的，只有这一个字。","“宋佚。”宋氏念了一遍。","“行。”她说，“丢了的，就叫丢了的。”","死讯那一行的墨，他要留着写七千人。顾阙从怀里掏出掌柜给的那锭墨，那是当年造册的墨，在吴老三家的门槛上磨开，用食指蘸了，翻开残志。","“只许写见的。”宋佚说。","“我知道。”","他一笔一画地写：","“宋佚，丁溪县人，宋氏女，居城隍庙后。失其名，不在册。镜中无影，能启夜门，手凉。尝于夜中掩主修之口，救之。言语快利，护人。”","写到“镜中无影”的时候，他的手停了一下。","写下去，她以后照镜子，就永远照不出自己了。","“写。”宋佚说，“那就是我。”","顾阙写了下去。","最后一个字落下，指尖没有凉，墨迹在纸上微微一亮。","陈小满忽然“啊”了一声。","她瞪着顾阙身边，眼睛睁得圆圆的，嘴张得能塞进一个鸡蛋。","那里站着一个年轻女人，穿着旧蓝布褂子，头发散着，手里还没来得及把簪子插回去。她的右手，好好的，有颜色，有温度，连指甲盖都是粉的。","“宋……宋姐姐？”陈小满结结巴巴地说，“你、你长这样啊？”","“不然呢？”宋佚说，“长你那样？”","陈小满“哇”的一声扑了上去，一把抱住了她。","吴老三站在门槛上，看着这个凭空出现的姑娘，揉了揉眼睛，又揉了揉。","“……宋家丫头？”","宋佚越过陈小满的肩膀，看着他，笑了：“吴伯，你家的枣，我还欠着你一筐呢。”","“一炷香。”裴照说。","他看着那页残志上的字。墨还是湿的，泛着光。","“墨干之前，她还是她，什么都记得。”裴照说，“墨一干，她就只剩这几行字。”","宋佚松开陈小满，把木簪插回头上，转身就往巷口走。","“愣着干什么？”她头也不回，“走啊，去县衙。趁我还记得那天晚上。”"]},{"id":"ch-1795214173153-0-0","title":"第36章 三证","paragraphs":["样稿，用于确定文风，请勿直接发布","出了巷口，陈小满又要往路中间站。","“别量了。”裴照说，“你鼻血还没止住。”","“城隍庙到广场，一千一百步。”陈小满说，“走过去要一刻多钟。墨等不了一刻钟。”","她深吸一口气，报出了那个数。","三步。","他们站在了广场上。陈小满腿一软，往前一栽，裴照伸手把她接住了。","这是顾阙第一次看见裴照碰一个人。","“你不是不碰东西的吗？”陈小满靠在他胳膊上，迷迷糊糊地说。","“你不是这里的东西。”裴照说，“站好。”","广场上已经站满了人。","昨晚被喊过名字的那些人，天一亮，就从家里出来了。他们站在照壁前面，仰着头，看着天上那页纸，看着城门那边一点一点逼近的白色，谁都不说话。","那片白，离广场只剩两条街了。","掌柜站在人群最前面，手里抱着他的算盘。阿七站在他旁边，攥着那块写着“李王氏”的竹牌。","县衙的台阶上，坐着杜明堂。贾三元撑着伞，站在他身后，眼睛还是肿的。","杜明堂看见宋佚，慢慢站了起来。","“宋家的丫头。”他说，“你有名字了。”","“宋佚。”她说。","满广场的人，这时候都看见她了。三百年来，这是她第一次站在所有人眼前。人群里起了一阵很低的骚动，有人在小声问：“那是谁家的姑娘？”","宋佚没理他们。她走到照壁前面，转过身，对着顾阙。","“摊开。”她说。","顾阙把残志摊开，捧在手里。","“我说，你听着。”宋佚说，“它也听着。”","她吸了一口气，开口了。说得又快又稳，一个字都没有停。","“嘉宁七年，从开春到秋天，没下过一滴雨。城隍庙后头那口井，七月里干了，见了底，县里拿封条封上了。地里的苗，六月就枯了。","“那年县里七千零五十二口人，一口都没少。我在井边打水，天天看着他们排队。","“七月底的一天夜里，我在县衙后堂，躲在屏风后面。我看见县太爷说，写零。我看见簿书的手在抖，一滴墨掉在册子上。我看见那个主修，穿青衫，提起笔，写了一个零。写完，他在册子最后落了名，把笔扔了。","“我亲眼看见的。”","她说完了。","照壁前面一点声音都没有。","顾阙低头看着手里的残志。那一页的空白处，一行一行淡淡的字，正从纸里浮出来，就是她刚才说的话，一个字都不差。","人证，立了。","掌柜站在人群前面，抱着算盘，浑身发抖。他听见了“簿书的手在抖”，低下头，看着自己那双胖手。","顾阙想起文天祥的两句诗：人生自古谁无死，留取丹心照汗青。","意思是，人活一辈子，谁都免不了一死，只要留下一颗真心，照在史书上就行了。汗青，就是史书。古时候在竹片上写字，要先把竹子烤得出汗，所以叫汗青。","宋佚的这一番话，现在就在这部志上了。","“墨干了。”裴照说。","顾阙一下子抬起头。","宋佚站在照壁前面，眨了一下眼睛。","她的神情变了。不是难过，也不是害怕，是一种很空的样子，好像一个人刚刚醒过来，一时想不起自己在哪儿。","她看看四周，看看满广场的人，看看天上那页纸。","阿七从人群里跑了出来，跑到她面前，仰着头看她，眼睛亮亮的。","“姐姐，”阿七说，“你是不是每回都来看我数石子的那个姐姐？我看不见你，可我老觉得旁边有人。”","宋佚低下头，看着这个小姑娘。","她看了很久。","“你是……谁家的孩子？”她问。","阿七愣住了。","“我是阿七啊。”她小声说。","“阿七。”宋佚跟着念了一遍，像念一个第一次听见的名字。","她抬起头，看向顾阙。","“顾阙。”她说，“我刚才说的那些话，是真的吗？”","顾阙的喉咙堵得说不出话。","“是真的。”他说，“是你亲口说的。”","“那就好。”宋佚说。","她点了点头，没再问。她认得顾阙，认得陈小满，认得裴照。她记得杂物间，记得井底，记得这五天。别的，都没了。","陈小满靠在裴照身上，捂着嘴，哭得一抽一抽的。","杜明堂在台阶上，看着这一切，很久都没有说话。","“三证齐了。”顾阙说。","他把残志翻到最后一页。死讯那一行的墨，还是湿的。","“你打算写什么？”杜明堂问。","“嘉宁七年大旱，丁溪县实有丁口七千零五十二，县令杜明堂以旱匿丁，册报为零。”","杜明堂的眉头动了一下：“你把旱也写上？”","“旱是真的。”顾阙说，“她刚才作了证。井封了，苗枯了。这是真的，我就写。”","“写了旱，丁税也还是要交。”","“那不一定。”","说话的是掌柜。","他从人群里走出来，抱着算盘，站到了台阶下面，第一次正面看着县太爷。","“大人。”掌柜说，“小人当了半辈子簿书，规矩小人知道。县里遭了灾，要报灾。府里派人来勘灾，勘实了，当年的丁税，能缓，能减，能免。”","杜明堂看着他。","“大人当年，报的不是灾。”掌柜说，“报的是零。”","“报灾，要报饥口多少。”杜明堂说，声音哑了，“一报人数，府里就知道县里有七千人。勘灾的人来了，要是不认这场旱，就照着人头催。我赌不起。”","“所以您赌了一个零。”掌柜说，“零，就不用赌了。”","杜明堂没有说话。","“这一回，”顾阙说，“志上有旱，有七千人，也有你瞒报。府里免不免，我不知道。”","“你不知道，你就敢写？”","“我不敢替他们写。”顾阙说，“所以，我去问他们。”","他转过身，看着满广场的人。","宋佚昨天问杜明堂：你问过他们吗？这句话，她自己现在已经不记得了。可顾阙记得。","他用食指蘸了死讯那一行的墨，在最后一页的空白处，落笔。","“嘉宁七年大旱，丁溪县实有丁口……”","写到这儿，他的手指停住了。","不是他不想写。是那个“七”字，写不下去。指尖压在纸上，墨就是不往下走，在纸面上聚成一颗圆圆的墨珠，晃来晃去。","“怎么了？”陈小满问。","裴照看着那颗墨珠，明白了。","“实有，不是你说了算的。”他说，“三证能证明他们活过。可他们现在还在不在，要他们自己认。”","“怎么认？”","“册上添丁，向来要本人到堂，应一声名。”裴照说，“官册是这样，志也是这样。”","“应名？”陈小满的声音一下子拔高了，“可凡例说，勿应于官啊！”","“所以不能是官喊。”裴照看着顾阙，“得是邻居喊。”","顾阙抬起头。","照壁前面，站着几百个人。可全县有五千九百一十一个人，散在一千多户里，大部分还关在家里，不敢出门。","城门那边，那片白，又往前吞了一条街。","离广场，只剩最后一条街了。","“七千零五十二个人。”顾阙说，“要在午时之前，一个一个，答应一声。”"]},{"id":"ch-1795214173154-0-0","title":"第37章 七千人","paragraphs":["样稿，用于确定文风，请勿直接发布","顾阙把残志交给裴照捧着，自己走上了县衙的台阶。","杜明堂往旁边让了一步，没拦他。","台阶下面，几百双眼睛看着他。","“我叫顾阙。”他说，“我不是官。我在你们县里住了七天，吃过你们县里的饺子，在你们的井里打过水。按凡例，我算你们的邻居。”","没人出声。","“我要把你们写回志里。”顾阙说，“写回去，你们就是有名有姓的人，不会再被一个一个地销掉。可是我得跟你们说清楚。”","他停了一下。","“写回去，册上就有你们。有人，就要交税。那一年大旱，我写进去了，府里会不会免，我不知道。有可能免，也有可能，你们要回到那个没有雨的夏天。”","人群里，有人倒吸了一口凉气。","“县太爷说，零是你们的太平。”顾阙说，“不疼，不饿，不交税。我不替你们选。愿意回来的，等会儿有人喊你，你就答应一声。不愿意的，就别出声。”","他说完了。","广场上安静得能听见天上那页纸，被风吹得哗啦哗啦响。","城门那边，那片白，已经吞到了广场边上那条街的街口。","一秒，两秒。","没有人说话。","顾阙低头，看着台阶下面那个最小的人。","“阿七。”他喊。","阿七仰着头，攥着她娘的竹牌，大声地、一点都没犹豫地答：","“在！”","裴照手里的残志上，“丁口”两个字后面，浮出了一个很淡的字。","“一。”","掌柜第一个反应过来。他转过身，对着身边一个挑水的汉子：“城西井台，王有田！”","挑水的汉子愣了一下：“……在！”","“二。”","王有田转过头，嘴唇哆嗦着，对着身后的女人：“你，你是西街孙家的……孙巧儿！”","“在！”","“三。”","然后，广场就炸开了。","每一个人，都转向身边的人。有人知道对方的名字，有人不知道，不知道的就问：“你叫什么？你告诉我，我喊你！”问完了，就喊，喊完了，就答。","“刘老栓！”","“在！”","“赵二栓！”","“在！在！”","顾阙想起《诗经》里一首打仗时唱的歌：岂曰无衣？与子同袍。","意思是，谁说你没有衣裳？我的战袍，分你一半穿。那是一群人要一起去拼命之前，互相说的话。","“回家喊！”陈小满靠在裴照身上，扯着沙哑的嗓子，“各回各的街！把关在屋里的都喊出来！”","人群一下子散开了，往四面八方跑。","“太慢了。”陈小满盯着那些跑开的背影，“城北那几条街，走过去就得一刻钟。”","她推开裴照，自己站直了。","“小满。”顾阙说。","“我量过的。”陈小满说，“这七天，我把这个县走遍了。广场到城北，九百二十步。广场到城东，六百一十步。广场到城隍庙，一千一百步。广场到城西井台，七百步……”","她一条一条地报，越报越快，像在背一张地图。","每报一条，就有一条街，猛地拉近了。跑在那条路上的人，几步就到了自家巷口。","陈小满的鼻血哗地流了下来，滴在下巴上，滴在白羽绒服上。她不擦，接着报。","“……广场到南门，八百步。”","报完最后一个数，她眼睛一翻，往后倒了下去。","裴照一手捧着残志，一手接住了她。","“她没事。”宋佚蹲下来，摸了摸她的脸，“晕过去了。”","整座县城，都响起了喊名声。","从城北，从城东，从城隍庙，从西边的井台。比昨晚更响，更乱，更多。关了一夜的门，一扇一扇打开了，有人光着脚就跑了出来，站在门口，扯着嗓子喊邻居的名字。","残志上，那个淡淡的数，在跳。","“一百二十。”","“四百。”","“一千零九十。”","阿七蹲在台阶下面，把她的石子一颗一颗摆开。她听着满城的喊声，一边听，一边拨石子，嘴里小声地数着。","“三千……四千……”","城门那边，白色吞进了广场边上那条街。挨着广场的第一排房子，屋檐开始发白。","房子里，有人在喊：“我在！我在！”可屋顶还在一点一点变白。","“五千九百一十。”","数停住了。","阿七抬起头：“哥哥，到了。今天县里的人，都在了。”","“还差一千一百四十一个。”顾阙说。","那些人，是这七夜里被销掉的。周铎投名那一夜的那条街，铁匠铺，针线铺，还有阿七她娘。","“他们不在了。”掌柜的声音在抖，“销掉的，谁来喊？”","“你。”顾阙说，“你的账上，销一个，记一个。他们叫什么，你知道。”","掌柜愣住了，然后猛地翻开账本。","“铁匠铺，周顺他爹，周老铁！”","满广场的人跟着喊：“周老铁——”","没有回答。","“针线铺，冯三姑！”","“冯三姑——”","还是没有回答。","白色已经爬过了第一排房子，舔到了广场的边上。","阿七站了起来。","她把那块竹牌举过头顶，用尽了全身的力气，喊了一声。","“娘——！李王氏——！”","声音在广场上转了一圈，撞到照壁，又弹回来。","没有回答。","阿七的嘴瘪了一下，又喊：“娘！我天天都在数！你是第四千三百零六个！你答应我！”","一阵风从广场上刮过去。","然后，人群后面，响起了一个女人的大嗓门，又粗又响，带着一股子火气：","“喊什么喊！在呢！”","阿七的竹牌掉在了地上。","人群往两边分开。一个胖胖的女人站在那儿，系着围裙，手上还沾着面，一脸莫名其妙地看着四周，好像刚从灶台前面被叫出来。","“这是哪儿……我不是在家擀面吗……”","阿七已经扑了过去，一头撞进她怀里，哭得整个广场都听得见。","残志上，数又跳了一下：“五千九百一十一。”","“周老铁——！”周顺扯着嗓子喊他爹。","街那头，一阵叮叮当当的打铁声响了起来，跟着是一句跑了调的小曲。","“在！哪个兔崽子喊老子？”","整座县城，像是被这一声唤醒了。","被销掉的人，一个一个，从说不清的地方答应着回来。在灶台前，在铁砧边，在针线笸箩旁。他们的邻居喊着他们的名字，他们就答一声“在”，然后就站在了那儿，好像从来没有离开过。","“六千五百。”","“七千。”","“七千零五十一。”","数停在了七千零五十一。","顾阙看着残志，愣了一下。","“还差一个。”裴照说。","掌柜翻着账本，翻到最后，手停住了。","他慢慢抬起头，看着台阶上的县太爷。","“钱守仁。”掌柜说，“县衙簿书房，钱守仁，一口。”","他自己答了一声：“在。”","“七千零五十二。”","顾阙接过残志，用食指蘸了墨。","他看着台阶下面，看着满城的人。他没有再喊任何一个人的名字。","他喊了一声：","“丁溪县——！”","整座县城，七千零五十二个人，在同一个瞬间，一齐答应：","“在——！”","那一声，比三百年来所有的锣声加起来都响。","顾阙落笔。","“七千零五十二。”","那个“七”字，这一次，稳稳地写了下去。","最后一笔落下的时候，天上那页纸，正当中那个巨大的“零”字，裂开了。"]},{"id":"ch-1795214173155-0-0","title":"第37章 七千人","paragraphs":["样稿，用于确定文风，请勿直接发布","顾阙把残志交给裴照捧着，自己走上了县衙的台阶。","杜明堂往旁边让了一步，没拦他。","台阶下面，几百双眼睛看着他。","“我叫顾阙。”他说，“我不是官。我在你们县里住了七天，吃过你们县里的饺子，在你们的井里打过水。按凡例，我算你们的邻居。”","没人出声。","“我要把你们写回志里。”顾阙说，“写回去，你们就是有名有姓的人，不会再被一个一个地销掉。可是我得跟你们说清楚。”","他停了一下。","“写回去，册上就有你们。有人，就要交税。那一年大旱，我写进去了，府里会不会免，我不知道。有可能免，也有可能，你们要回到那个没有雨的夏天。”","人群里，有人倒吸了一口凉气。","“县太爷说，零是你们的太平。”顾阙说，“不疼，不饿，不交税。我不替你们选。愿意回来的，等会儿有人喊你，你就答应一声。不愿意的，就别出声。”","他说完了。","广场上安静得能听见天上那页纸，被风吹得哗啦哗啦响。","城门那边，那片白，已经吞到了广场边上那条街的街口。","一秒，两秒。","没有人说话。","顾阙低头，看着台阶下面那个最小的人。","“阿七。”他喊。","阿七仰着头，攥着她娘的竹牌，大声地、一点都没犹豫地答：","“在！”","裴照手里的残志上，“丁口”两个字后面，浮出了一个很淡的字。","“一。”","掌柜第一个反应过来。他转过身，对着身边一个挑水的汉子：“城西井台，王有田！”","挑水的汉子愣了一下：“……在！”","“二。”","王有田转过头，嘴唇哆嗦着，对着身后的女人：“你，你是西街孙家的……孙巧儿！”","“在！”","“三。”","然后，广场就炸开了。","每一个人，都转向身边的人。有人知道对方的名字，有人不知道，不知道的就问：“你叫什么？你告诉我，我喊你！”问完了，就喊，喊完了，就答。","“刘老栓！”","“在！”","“赵二栓！”","“在！在！”","顾阙想起《诗经》里一首打仗时唱的歌：岂曰无衣？与子同袍。","意思是，谁说你没有衣裳？我的战袍，分你一半穿。那是一群人要一起去拼命之前，互相说的话。","“回家喊！”陈小满靠在裴照身上，扯着沙哑的嗓子，“各回各的街！把关在屋里的都喊出来！”","人群一下子散开了，往四面八方跑。","“太慢了。”陈小满盯着那些跑开的背影，“城北那几条街，走过去就得一刻钟。”","她推开裴照，自己站直了。","“小满。”顾阙说。","“我量过的。”陈小满说，“这七天，我把这个县走遍了。广场到城北，九百二十步。广场到城东，六百一十步。广场到城隍庙，一千一百步。广场到城西井台，七百步……”","她一条一条地报，越报越快，像在背一张地图。","每报一条，就有一条街，猛地拉近了。跑在那条路上的人，几步就到了自家巷口。","陈小满的鼻血哗地流了下来，滴在下巴上，滴在白羽绒服上。她不擦，接着报。","“……广场到南门，八百步。”","报完最后一个数，她眼睛一翻，往后倒了下去。","裴照一手捧着残志，一手接住了她。","“她没事。”宋佚蹲下来，摸了摸她的脸，“晕过去了。”","整座县城，都响起了喊名声。","从城北，从城东，从城隍庙，从西边的井台。比昨晚更响，更乱，更多。关了一夜的门，一扇一扇打开了，有人光着脚就跑了出来，站在门口，扯着嗓子喊邻居的名字。","残志上，那个淡淡的数，在跳。","“一百二十。”","“四百。”","“一千零九十。”","阿七蹲在台阶下面，把她的石子一颗一颗摆开。她听着满城的喊声，一边听，一边拨石子，嘴里小声地数着。","“三千……四千……”","城门那边，白色吞进了广场边上那条街。挨着广场的第一排房子，屋檐开始发白。","房子里，有人在喊：“我在！我在！”可屋顶还在一点一点变白。","“五千九百一十。”","数停住了。","阿七抬起头：“哥哥，到了。今天县里的人，都在了。”","“还差一千一百四十一个。”顾阙说。","那些人，是这七夜里被销掉的。周铎投名那一夜的那条街，铁匠铺，针线铺，还有阿七她娘。","“他们不在了。”掌柜的声音在抖，“销掉的，谁来喊？”","“你。”顾阙说，“你的账上，销一个，记一个。他们叫什么，你知道。”","掌柜愣住了，然后猛地翻开账本。","“铁匠铺，周顺他爹，周老铁！”","满广场的人跟着喊：“周老铁——”","没有回答。","“针线铺，冯三姑！”","“冯三姑——”","还是没有回答。","白色已经爬过了第一排房子，舔到了广场的边上。","阿七站了起来。","她把那块竹牌举过头顶，用尽了全身的力气，喊了一声。","“娘——！李王氏——！”","声音在广场上转了一圈，撞到照壁，又弹回来。","没有回答。","阿七的嘴瘪了一下，又喊：“娘！我天天都在数！你是第四千三百零六个！你答应我！”","一阵风从广场上刮过去。","然后，人群后面，响起了一个女人的大嗓门，又粗又响，带着一股子火气：","“喊什么喊！在呢！”","阿七的竹牌掉在了地上。","人群往两边分开。一个胖胖的女人站在那儿，系着围裙，手上还沾着面，一脸莫名其妙地看着四周，好像刚从灶台前面被叫出来。","“这是哪儿……我不是在家擀面吗……”","阿七已经扑了过去，一头撞进她怀里，哭得整个广场都听得见。","残志上，数又跳了一下：“五千九百一十一。”","“周老铁——！”周顺扯着嗓子喊他爹。","街那头，一阵叮叮当当的打铁声响了起来，跟着是一句跑了调的小曲。","“在！哪个兔崽子喊老子？”","整座县城，像是被这一声唤醒了。","被销掉的人，一个一个，从说不清的地方答应着回来。在灶台前，在铁砧边，在针线笸箩旁。他们的邻居喊着他们的名字，他们就答一声“在”，然后就站在了那儿，好像从来没有离开过。","“六千五百。”","“七千。”","“七千零五十一。”","数停在了七千零五十一。","顾阙看着残志，愣了一下。","“还差一个。”裴照说。","掌柜翻着账本，翻到最后，手停住了。","他慢慢抬起头，看着台阶上的县太爷。","“钱守仁。”掌柜说，“县衙簿书房，钱守仁，一口。”","他自己答了一声：“在。”","“七千零五十二。”","顾阙接过残志，用食指蘸了墨。","他看着台阶下面，看着满城的人。他没有再喊任何一个人的名字。","他喊了一声：","“丁溪县——！”","整座县城，七千零五十二个人，在同一个瞬间，一齐答应：","“在——！”","那一声，比三百年来所有的锣声加起来都响。","顾阙落笔。","“七千零五十二。”","那个“七”字，这一次，稳稳地写了下去。","最后一笔落下的时候，天上那页纸，正当中那个巨大的“零”字，裂开了。"]},{"id":"ch-1795214173156-0-0","title":"第38章 定稿","paragraphs":["样稿，用于确定文风，请勿直接发布","那个“零”字，从正当中裂成了两半。","墨从裂缝里流出来，像下雨一样，落在屋顶上，落在街上，落在每个人的肩膀上。落到身上，却一点都不湿，一沾就没了。","天上那页纸，从四个角开始卷起来，越卷越小，最后卷成一根细细的纸卷，掉进了县衙的后堂。","天光是真的天光了。","城门那边，那片白，在往回退。屋檐重新有了颜色，墙重新有了砖缝，城墙一截一截地长回来，城门楼子也回来了。","照壁上，那张官榜，“丁口”后面的“零”字慢慢褪掉，换成了五个字：","“七千零五十二。”","广场上没人欢呼。大家只是站着，看看天，看看身边的人，然后小声地，一遍一遍地，叫着彼此的名字。","陈小满醒过来的时候，躺在台阶上，头枕着裴照的大衣。","“成了？”她哑着嗓子问。","“成了。”顾阙说。","陈小满躺着没动，看着天，看了很久。","“顾阙，”她说，“郝大哥和周老师，能喊回来吗？”","顾阙沉默了一会儿。","“他们不在这本册上。”他说，“他们是外账。”","陈小满没说话。她坐起来，从顾阙怀里抽出那个笔记本，翻到空白的一页，一笔一画地写：郝建国。周铎。","“那我记着。”她说。","台阶上，忽然有东西掉在地上。","是那把伞。","贾三元站在杜明堂身后，低着头，看着自己的手。他的手，正在一点一点地变透明。","“我……”他抬起头，脸上一点血色都没有，“我怎么了？我没答应啊，昨晚我一声都没答……”","“不是官差。”裴照说，“是账。”","“什么账？”","“县太爷把你写进了他的册子。”裴照说，“那本册子，上面写的是零。零没了，那本册子就作废了。写在假账上的人，跟着假账一起作废。”","贾三元的腿一软，扶住了台阶边的石狮子。","他看向顾阙：“你能写我吗？你是主修，你写我一笔……”","“我没有证据。”顾阙说，“你不是这个县的人。”","贾三元张着嘴，看了他很久，最后点了点头。","“我知道。”他说，“我就是问问。”","透明已经爬到了他的胳膊。他转过头，看着陈小满。","他没有再求她。","陈小满看着他。她手里攥着笔记本，本子上刚写的那两个名字，墨还没干。","“贾三元。”她说。","贾三元愣住了。","“在。”他说，声音很轻。","他身上的透明，没有停。喊名字，救不了被账收走的人。","可他笑了。","“有人喊了。”他说。","他从西装口袋里摸出一张名片，皱巴巴的，递给陈小满。","就是第一天他递给顾阙的那种名片。印名字的地方是空的，只剩一个电话号码。","“上面没我名字。”贾三元说，“进来之前，就被删了。”","陈小满跟顾阙要了笔，在那块空白上，一笔一画地写：贾三元。","贾三元看着那三个字，看了很久。","“你别忘了就行。”他说。","他又看了一眼天，小声说了一句：“我妈还在等我过年呢。”","然后，他就没了。","伞还躺在台阶上。陈小满低头看那张名片。她写上去的三个字，清清楚楚，一个都没少。","杜明堂一直坐在台阶最高的那一级。他的官服，已经淡得像一层灰。","顾阙走上去，在他旁边坐下。","“你要问我。”杜明堂说，“三百年前，你为什么写零。”","“对。”","“你那天，没信我。”杜明堂说，“我把今天这番话跟你说了一遍，你一个字都没信。你说，人是藏不住的，藏得了一年，藏不了一辈子。”","顾阙愣住了。","“那我为什么还要写？”","杜明堂沉默了很久。","“那天夜里，井里有声音。”他说，“城隍庙后头那口井，七月里干了，封上了。可那天夜里，井底下有东西在翻书，一页一页地翻，翻得整个县衙都听得见。”","顾阙的后背一下子凉了。","“你听了很久。”杜明堂说，“然后你说，它在读这一页。读到谁的名字，谁就没了。”","“然后呢？”","“然后你说，零，它不读。”杜明堂说，“你提起笔，写了零。写完了，在最后落了你的名。你跟我说，你先把他们藏起来，你会回来改。”","“它是什么？”","“你没说。”杜明堂说，“我也不想知道。”","他看着广场上那些互相叫着名字的人。","“三百年，四十八回进来的人，没有一个是你。”他说，“这是第一回。”","顾阙坐在那儿，说不出话来。","他想起杜甫的两句诗：文章千古事，得失寸心知。","意思是，写文章是传千年的大事，写得好不好、写得对不对，只有写的人自己心里清楚。","三百年前那个他，写下那个零的时候，心里清楚的是什么？他不知道。他只知道，今天这一笔，他自己清楚。","“你走吧。”杜明堂说，“我的事，志上已经写了。县令杜明堂，以旱匿丁。我认。”","台阶下面，掌柜抱着算盘，仰着头，看着他。","“大人。”掌柜说，“小人喊您一声。”","杜明堂看着他，没说话。","“杜明堂。”掌柜说。","杜明堂怔了一下。","然后，他很慢、很郑重地，答了一声：","“在。”","答完了，他就像那层灰一样，散在了台阶上。风一吹，什么都没剩下。","宋佚一直站在台阶下面，看着这一切。她拔下头上的木簪子，看着上面那一道一道的刻痕。","“这四十九道，”她问顾阙，“是我刻的？”","“是你刻的。”","她数了一遍，又插了回去。","“奇怪。”她说，“我什么都不记得了，可我总觉得，我在等一个人。”","“等谁？”","宋佚想了很久，摇了摇头。","“想不起来了。”","他们离开的时候，掌柜一直送到了城门口。","城门下，木榜还立在那儿。阿七牵着她娘的手，也跟了过来，非要看着他们走。","掌柜站在城门洞里，把算盘托在手上，看着顾阙，笑眯眯的，跟第一天一模一样。","“这位客官，”他说，“您算几个人？”","顾阙还没开口，掌柜手指下的那颗珠子，自己往上一跳，稳稳地拨了上去。","掌柜低头看了看，笑出了声，眼泪也跟着下来了。","“外账，六口。”他说，“销二，转出一，余三。平了。”","“账清了？”","“账清了。”掌柜说，“客官，慢走。”","顾阙走到城门下，停住了脚步。","城门下这块木榜，他第一天进城就见过，上面刻着本县五条凡例。第一条后半截被人刮成了一个坑，他们在坑底拓出了“当应于邻”。","现在，那个坑不见了，填平了，多了一行新刻的字。","“日落后，有人唤名，勿应于官，当应于邻。”","木榜上，第一条那个被刮得凹下去的坑，不见了。坑被填平了，上面多了一行新刻的字，一笔一画，刻得很深。","“日落后，有人唤名，勿应于官，当应于邻。”","陈小满凑过来，看了一眼，忽然“咦”了一声。","“顾阙，”她说，“这字，跟你笔记本上的一模一样。”","顾阙看着那行字。","他写“邻”字，左边那一点总是点得太重，像一颗没干的墨珠。闻老师说过他好多回，他一直没改过来。","木榜上这个“邻”字，左边那一点，也点得太重了。","是他的字。","他没有刻过这块木榜。","那天拓完坑底的字，他照着拓片，把这一句抄在了笔记本上。那一行被刮了三百年，世上再没有第二份底本。","落笔以后，县城回来，这一条也回来了，照的就是他笔记本上那一份。","所以木榜上刻的，是他的字。","陈小满盯着那个“邻”字，声音一下子小了：“那残志最后一页的落款……”","顾阙没回答。","三百年前，残志的落款，也是他的字。"]},{"id":"ch-1795214173158-0-0","title":"第39章 地图","paragraphs":["样稿，用于确定文风，请勿直接发布","出了城门，还是那条土路。","来的时候，这条路三里。走回去的时候，陈小满数了一路，一千零八十步，一步不多，一步不少。","“不缩了。”她说，“它现在老实了。”","路边那四十七只单鞋还在。陈小满走过去的时候，放慢了脚步，一只一只地看。那只虎头鞋，还是歪在草里。","“宋姐姐，”她回头问，“这些鞋……你还记得是谁的吗？”","宋佚看着那些鞋，看了很久，摇了摇头。","“不记得了。”她说，“可我看着它们，心里不好受。”","陈小满没再问。她蹲下来，把那只虎头鞋扶正了，鞋尖朝着城门。","路的尽头，是一片灰蒙蒙的雾。雾里隐隐约约，能看见几扇不一样的门。一扇是窗户，窗台上摆着一盆绿萝。一扇是宿舍的门，门上贴着一张值日表。还有一扇，什么都看不清。","“各回各的门。”裴照说，“从哪儿进来的，就从哪儿出去。”","“那宋姐姐呢？”陈小满马上问，“她从哪儿出去？她能出去吗？”","“能。”裴照说，“三证写进志里的东西，能带回去。她现在是志上的人。”","他看着宋佚，停了一下。","“可是外面跟这里不一样。外面的人，没读过这本志。”裴照说，“监控拍不到她。别人看见她，转过头就会忘。还有，每过四十九天，得有人把她重新写一遍。不写，她就会慢慢淡掉。”","“谁来写？”","裴照没回答，看了顾阙一眼。","宋佚抱起胳膊：“那就是你了，主修。”","“我知道。”顾阙说。","陈小满抱着那个保温桶，在原地站了一会儿，忽然扑上去，一把抱住了宋佚。她鼻子底下，还糊着报七千个名字时流的鼻血，干成了一道一道的，她一直顾不上擦。","“宋姐姐，我会想你的。”她说，“我转过头也不会忘，我保证。我把你写在本子上了。”","“这丫头。”宋佚拍了拍她的背，嘴上嫌她，声音却有点哑，“脸上的鼻血擦干净再走，别让外头的人看见了，还以为你跟谁打架了。”","陈小满松开她，又转向顾阙，从他怀里抽出笔记本，在最后一页写了一串号码。","“我的电话。”她说，“出去以后，你要是敢不认识我，我就去你单位门口站着，一天数你一千遍。”","“认识。”顾阙说。","陈小满又转向裴照。","“喂。”她说，“卷终了。”","裴照看着她。","“你说过，卷终再说。”陈小满说，“你真名叫什么？”","裴照沉默了一会儿。","然后他弯下腰，凑到陈小满耳边，很轻很轻地说了两个字。","顾阙站在旁边，什么都没听见。","陈小满愣了一下，眼睛慢慢睁大了，然后，她笑了。","“行。”她说，“我记住了。”","“别喊。”裴照直起身子，“在外面也别喊。”","“知道啦。”","裴照转向顾阙，从大衣口袋里摸出一张很旧的纸片，递给他。纸片上什么都没写，只有一个小小的朱印，印着一个“修”字。","“修志会会找你。”他说，“找不找我们，你自己定。”","他没有走向任何一扇门。他往旁边跨了一步，就像从两页书的缝里，侧着身子挤了过去。灰大衣的衣角一闪，人就不见了。","他的鞋上，还是没有泥。","陈小满冲着他消失的地方，做了个鬼脸，然后抱着保温桶，走向那扇贴着值日表的门。","走到门口，她回过头，冲他们挥了挥手。","“顾阙！宋姐姐！在不在？”","“在。”顾阙说。","“在。”宋佚说。","门关上了。","只剩那扇窗户。窗台上的绿萝，是小葛养的，叶子黄了一片，一直没人管。","顾阙抬腿翻上窗台。","宋佚站在土路上，没动。","“怎么了？”","“没什么。”宋佚说，“三百年，我没出过这个县。”","顾阙看着她，伸出了手。","宋佚看了看他的手，哼了一声，没去拉，自己一撑，利落地翻了上来。","修复室里很黑，只有窗外停车场的路灯，橘黄色的光照进来，照在工作台上。","那本残志好好地摊在那儿，翻在死讯那一页。","顾阙低头去看。","死讯那一行，空了。","“顾阙，本县人，卒于本月十七亥时，年二十六。”那一行字，一个都没剩下，纸面上只有一道淡淡的水痕。那行墨，他一点一点蘸着用，写门闩，写灯，写七千零五十二，用干净了。","他翻到版心。三百年前被人一刀一刀刮掉的地方，现在印着四个小字：","丁溪县志。","他抬头看了一眼墙上的钟。","九点零一分。","他在那个县里过了七天，外面只过了一分钟。","宋佚在屋里转了一圈，停在那具骷髅标本前面，伸手敲了敲它的脑门。","“这是谁？”","“教学用的。”顾阙说，“假的。”","“难看。”宋佚说。","顾阙掏出手机。屏幕亮了，通讯录一格一格地回来了。“阿姨（房东）”，小葛，老王，闻老师。他从上往下划，划到底，屏幕下方一行小字：共 212 位联系人。","他把工牌翻过来。下面印名字的那一栏，“顾阙”两个字，好好地印在那儿。","门外传来脚步声，手电筒的光从门缝底下扫进来。","“小顾？”是老王，“这么晚还不走？明天再修吧，身体要紧。”","“马上走。”顾阙说，“王叔。”","“哎。”老王应了一声，脚步声走远了。","顾阙站在黑暗里，过了很久，才把那口气慢慢吐出来。","他想起贺知章的诗：少小离家老大回，乡音无改鬓毛衰。儿童相见不相识，笑问客从何处来。","意思是，年轻时离开家乡，老了才回来，口音没变，头发却白了。村里的孩子都不认识他，笑着问他：客人，你从哪儿来？","他离开了一分钟。还好，回来的时候，有人认得他。","那天晚上，宋佚在修复室的折叠床上睡了。顾阙在工作台前坐了一夜，把这七天的事，一条一条，全记在了笔记本上。","第二天早上八点半，门禁滴的一声。","小葛背着包进来，看见他，吓了一跳：“顾老师，您又通宵了？”","“嗯。”","顾阙看着她胸前的工牌。","他已经想不起她的全名了。可工牌上印着。他看了一眼，在心里念了一遍，记住了。","“葛青禾。”他说。","小葛愣住了：“啊？您干嘛突然叫我全名？我又干什么坏事了？”","“没有。”顾阙说，“就是叫一下。”","小葛一脸莫名其妙地坐下了。","宋佚坐在折叠床上，抱着胳膊，冲她看。小葛的目光扫过折叠床，扫过宋佚，没有停，就那么滑了过去。","顾阙打开手机地图，放大衡泽省。","他认得这张地图。省里每个县的位置，他修地方志的时候都对过。","在两个县中间，原来是一片山的地方，多了一块。","丁溪县。","他盯着那三个字，手指有点抖。","“小葛。”他说，“你听说过丁溪县吗？”","小葛正在泡茶，头都没回。","“听说过啊。”她说，“我老家就是丁溪的啊。”"]},{"id":"ch-1795214173159-0-0","title":"第40章 热搜","paragraphs":["样稿，用于确定文风，请勿直接发布","“你老家是丁溪的？”顾阙问。","“对啊。”小葛端着茶杯转过身，“我没跟您说过吗？丁溪县，在南边，山沟沟里，小地方。”","“你在那儿长大的？”","“长到十八岁。”小葛说，“怎么了？您今天好奇怪。”","顾阙把手机扣在桌上：“丁溪有什么？”","小葛想了想：“也没什么。就是规矩怪。我们那儿，太阳一落山，家家户户都要站在门口，喊隔壁的名字。”","顾阙的手停住了。","“喊名字？”","“对，喊邻居的名字。”小葛说，“隔壁听见了，就得答一声‘在’。从小喊到大，一天都不能落。我小时候贪玩不想答，我奶奶拿笤帚追了我半条街。”","“为什么要喊？”","“老规矩呗。”小葛说，“县城门口有块老木榜，第一条就是这个。日落后，有人唤名，勿应于官，当应于邻。我们那儿小孩都会背。外地人来了，都觉得我们神神叨叨的。”","宋佚坐在折叠床上，轻轻笑了一声。","小葛没听见，又说：“哦对，县城里还有家老客栈，叫安居，说是三百年的老字号了，一直是钱家开的。老板胖胖的，见谁都笑眯眯的，算盘打得飞快。”","顾阙低下头，没让她看见自己的脸。","“顾老师？”","“没事。”他说，“茶凉了。”","上午十点，小葛刷手机，忽然“咦”了一声。","“顾老师，丁溪上热搜了。”","“什么热搜？”","小葛把手机递过来。","热搜第三条：#你记得丁溪县吗#","点进去，最上面一条，是一个大学生发的。两张截图，左边是上周的地图，右边是今天的地图。左边那片地方是山，右边多了一个县。配的字很长，一连好几个感叹号：","“我学测绘的！！上周我们课上刚用过这一片的图！！这里根本没有县！！一夜之间多出来一个县，七千多口人，你们都不觉得奇怪吗！！”","顾阙看了一眼发帖人的头像。一只兔子拖鞋。","他差点笑出来。","底下的评论吵成了一锅粥。","“楼主记错了吧，丁溪一直都在啊，我高中同学就是丁溪的。”","“我也觉得奇怪！我记得那边是山！”","“曼德拉效应又来了。”","“丁溪那个喊名字的习俗我在纪录片里看过，好多年前就有了。”","“楼上，那个纪录片你能找到链接吗？”","“……找不到了，但我真看过。”","一半人说丁溪一直都在，一半人发誓上周还没有。吵到中午，热搜的词条变成了：#丁溪县 唤名#。有人去丁溪拍了视频，太阳落山的时候，一整条老街的人站在门口，你喊我，我喊你，一声接一声，喊得整条街都在响。","那条视频，一上午转了三十万次。","早上，顾阙照着笔记本最后一页的号码，给陈小满发过一条短信：我是顾阙。她一直没回。","这时候，手机震了一下。","“顾阙！你看热搜没！！那是我发的！！你真的还认识我！！”","“认识。”顾阙回。","“我就知道！！我室友说我疯了！！”","过了一会儿，又来一条。","“我昨晚查了一夜郝大哥。查不到。哪儿都查不到。周老师也是。”","顾阙看着这一行字，很久没有回。","最后，他回了一句：“我本子上有。”","“我本子上也有。”陈小满回，“那就行。”","下午，顾阙去了趟书库。","古籍书库在地下二层，又冷又干，一排一排的铁书架，按省、按府、按县排着。衡泽省那一排，他闭着眼睛都能找到。","他找到了。","在两部县志中间，多了一函。蓝布函套，签条上写着四个字：丁溪县志。","他戴上手套，抽出第一册，翻开。","卷首，修志衔名。","“主修：顾阙。”","落款年份，晏嘉宁七年。","顾阙站在书架中间，后背一阵发冷。他翻过去，不敢多看。","户口门，第一条。","“嘉宁七年大旱，丁溪县实有丁口七千零五十二，县令杜明堂以旱匿丁，册报为零。”","就是他写的那一句。一字不差。","可是后面，还有一行小字。他没写过。","“事闻，府遣官勘灾，实。蠲是年丁税。”","顾阙看着这一行，看了很久。","府里派人来查了灾情，查实了。那一年的丁税，免了。","他没有写这一句。他只是写了真话。真话写下去，后面的事，历史自己接上了。","他想起刘禹锡的两句诗：旧时王谢堂前燕，飞入寻常百姓家。","意思是，从前在王家、谢家这种大户人家屋檐下做窝的燕子，现在飞进了普通老百姓的家里。说的是世道变了，大人物的事过去了，日子落到了普通人头上。","杜明堂，主修，簿书，那七夜，现在都只是这部志里的几行字。剩下的，是一个县，七千多户人家，每天太阳落山的时候，站在门口喊邻居的名字。","他往后翻，翻到人物门。","“钱守仁，县署簿书。性和易，善算。晚年开安居客栈，客至，必笑问：客官算几个人。”","再往后。","“李氏女，小字阿七，年七岁，善数。”","顾阙的眼眶一热。","再往后，人物门的最末尾，一条很短很短的小传。","“宋佚，丁溪县人，宋氏女，居城隍庙后。失其名，不在册……”","就是他写在吴老三门槛边上的那几行。","“我在志上？”","宋佚不知道什么时候站到了他身后，探着头看。","“你在志上。”顾阙说。","“就这么几行？”","“只写见的。”顾阙说，“你说的。”","宋佚哼了一声，没说话，伸手在那几行字上轻轻摸了一下。","顾阙把书放回函套，推回了书架。","他们从书库出来，经过一楼大厅的时候，顾阙停了一下。","大厅角落里，挂着一块监控屏，十六个小格子，照着馆里的各个角落。其中一格，照的就是他们站的这块地方。","屏幕上，大厅里人来人往。顾阙站在正当中，一个人，侧着脸，像是在跟身边的空气说话。","他身边，什么都没有。","顾阙看着屏幕，慢慢转过头。","宋佚就站在他旁边，离他半步远。监控照得到这块地方，却照不出她。","她看着他，笑了一下。"]},{"id":"ch-1795214173160-0-0","title":"第41章 宋佚条","paragraphs":["样稿，用于确定文风，请勿直接发布","傍晚五点半，小葛收拾东西走了。走之前她探头问：“顾老师，楼下砂锅，一起吗？”","“下回。”顾阙说。","“您每回都说下回。”小葛撇撇嘴，“那我给您带一份。”","“好。”","小葛愣了一下，好像没想到他会答应，高高兴兴地关上了门。","修复室里只剩他们两个。","宋佚站在窗边。窗外，停车场那头，太阳正一点一点往楼后面落。这里的太阳不是一下子落的，是慢慢落的，落了很久。","“外面的天黑得真慢。”她说。","“外面都是这样。”","太阳最后一点边，沉了下去。","顾阙没有抬头，手里的镊子也没停。","“宋佚。”他说。","宋佚转过身，看着他，看了好一会儿。","“在。”她说。","顾阙这才抬起头。","宋佚靠着窗台，抱着胳膊：“你一天到晚，就记着这个？”","“小葛说的。”顾阙说，“丁溪的规矩，太阳落山，要喊邻居的名字。”","“我是你邻居？”","“你睡我工作室的折叠床。”顾阙说，“算。”","宋佚哼了一声，转过头去看窗外，嘴角却翘了起来。","手机响了。一个没有号码的来电，屏幕上只显示着一个小小的“修”字。","顾阙接起来。","“残志最后一页。”电话那头说。声音很冷淡，话很短。","是裴照。","顾阙把残志翻到最后一页。原本是一片空白的地方，现在聚着一小汪墨。不多，指甲盖那么大，像刚磨好的一样。","“这是什么？”","“墨。”裴照说，“丁溪上了热搜，转了三十万次。一个人记住它，就多一滴。记住的人越多，墨越多。以后落笔，就用这个。”","“以前那行死讯的墨呢？”","“那是借的。”裴照说，“借的用完了，以后都得自己挣。还有，你现在是校勘了。”","“什么意思？”","“修志会的人，从抄手做起。”裴照说，“抄手，校勘，采访，分纂，一级一级往上走。你第一卷就到了校勘。跟我一样。”","顾阙没说话。","“还有，”裴照顿了一下，“宋佚的四十九天，从昨晚出卷算起。写她，要在卷末。”","“卷末？”","“修志的规矩。一卷修完，卷末附一条。”裴照说，“写什么，你自己定。只许写见的，你知道。”","电话挂了。","宋佚在旁边，听得一清二楚：“要写我了？”","“要写你了。”","“写什么？”","“只写见的。”","顾阙把那本残志摊平，翻到卷末，最后一页墨的旁边，还有半页空白。他用食指蘸了那一小汪墨，想了很久，然后开始写。","宋佚凑过来，看着他一笔一画地写。","“宋佚，丁溪县人，宋氏女，居城隍庙后。失其名，不在册。镜中无影，能启夜门，手凉。尝于夜中掩主修之口，救之。言语快利，护人。","“嘉宁七年事，佚独亲见。当众证之，证毕而忘。","“丁溪定稿日，随主修出卷。主修援之，不受，自攀窗而入。见骷髅，叩其颅，曰：难看。","“日落，主修唤其名，应曰：在。”","写完了。","墨在纸上微微一亮，干了。","宋佚一行一行地看下来，看到“证毕而忘”，停了一会儿。看到“自攀窗而入”，皱起了眉头。","“‘主修援之，不受’，这个也写？”","“我伸手了，你没拉。”顾阙说，“我亲眼见的。”","“‘叩其颅，曰：难看’，这个也写？”","“你说的。”","“这也太丢人了。”宋佚说，“我在志上，就是一个敲骷髅脑门的？”","“还有最后一句。”","宋佚看着最后一句，没再说话。","日落，主修唤其名，应曰：在。","顾阙想起《诗经》里的几句：投我以木桃，报之以琼瑶。匪报也，永以为好也。","意思是，你送我一个桃子，我回你一块美玉。不是为了还你的情，是想跟你一直好下去。","第一天晚上，她捂住了他的嘴，救了他一条命。他能还给她的，只有这几行字。可他写这几行字，不是为了还。","“比上回长了。”宋佚说。","“长了四行。”","“以后呢？”","“以后，见得多了，就长。”顾阙说。","宋佚看着他，眼白上那个墨点，比在丁溪的时候淡了一点。","“那你多看着点。”她说。","顾阙低下头，假装去收镊子。","过了一会儿，宋佚又开口了，声音很轻。","“顾阙，我那天说，我觉得我在等一个人。”","“嗯。”","“我还是想不起来是谁。”她说，“可说不定，我等的就是你。”","顾阙的手停了。","“这一句，”宋佚马上说，“你可不许写。你又没见过。”","“不写。”","八点多，小葛提着一个打包盒上来了，砂锅还冒着热气。她把盒子放在桌上，看见顾阙对着窗户那边笑了一下，自己也跟着往那边看了一眼，窗户那边什么都没有。","“顾老师，您最近真的好奇怪。”","“趁热吃。”顾阙说，“谢谢。”","小葛走了以后，顾阙想起一件事。","他掏出手机，打开通讯录，照着笔记本最后一页，把陈小满的号码存了进去。","名字那一栏，他打了三个字：陈小满。","保存。","屏幕最下面，那一行小字跳了一下。","共 212 位联系人。","顾阙没有看那一行。他把手机扣在桌上，去吃那碗砂锅了。","九点整，门外响起了敲门声。","是老王。他手里拿着一个牛皮纸包裹，包得方方正正，上面落了一层灰。","“小顾，收发室下午收的，说是捐赠件，没留名字，指名给你。”老王说，“我刚才巡楼看见，顺手给你带上来了。”","“谢谢王叔。”","老王走了。","顾阙拆开包裹。","里面是一本残书。线装，前后都缺，没有题署。版心本该刻县名的地方，被人用刀刮过。","可这一回，刮了两遍。","刮痕是两层，一层横着刮，一层竖着刮，像是两个人，先后都想把这个县名抹掉。","顾阙一页一页地翻。翻到一半，书里掉出一张夹页。","上面有两行字，字迹不一样。","第一行：“顾阙，本县人，卒于本月二十九子时，年二十六。”","第二行，在它旁边，墨色深一些：“顾阙，本县人，寿八十一，子孙满堂，无疾而终。”","两行字，墨都是湿的。","宋佚凑过来，看了一眼，脸色变了。","“两个你。”她说。"]}]}</script></head>

    // =========================================================================
    // 2. APPLICATION STATE & STORAGE
    // =========================================================================
    const STORAGE_KEY_BOOKS = 'mojuan_books_v1';
    const STORAGE_KEY_PREFS = 'mojuan_prefs_v1';
    const STORAGE_KEY_PROGRESS = 'mojuan_progress_v1';

    function safeStorageGet(key, fallback) {
      try {
        const raw = window.localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function safeStorageSet(key, value) {
      try {
        window.localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {
        // Ignore storage quota or sandbox restrictions gracefully
      }
    }

    // Check if this HTML was exported as a standalone Shared Reader for friends
    const sharedPayloadEl = document.getElementById('shared-book-payload');
    let SHARED_BOOK = null;
    if (sharedPayloadEl && sharedPayloadEl.textContent.trim()) {
      try {
        SHARED_BOOK = JSON.parse(sharedPayloadEl.textContent);
      } catch (e) {
        SHARED_BOOK = null;
      }
    }

    const defaultPrefs = {
      theme: 'paper',       // paper | green | parchment | white | night
      fontSize: 19,         // 14 - 28
      lineHeight: 1.85,     // 1.6 | 1.85 | 2.1
      fontFamily: 'serif',  // serif | kai | sans
      turnMode: 'flip',     // flip | slide | scroll
      spreadMode: 'auto'    // auto | single | double
    };

    const state = {
      isSharedMode: Boolean(SHARED_BOOK),
      view: SHARED_BOOK ? 'reader' : 'shelf', // 'shelf' | 'reader'
      books: [],
      activeBookId: SHARED_BOOK ? SHARED_BOOK.id : null,
      prefs: { ...defaultPrefs, ...safeStorageGet(STORAGE_KEY_PREFS, {}) },
      progress: safeStorageGet(STORAGE_KEY_PROGRESS, {}), // { [bookId]: { chapterIdx, pageIdx, bookmarks: [] } }

      // Reader runtime state
      chapterIdx: 0,
      pageIdx: 0,
      pages: [],            // array of HTML strings for current chapter
      isDoubleSpread: false,
      hudVisible: true,
      activePanel: null,    // null | 'toc' | 'settings' | 'tts'
      tocTab: 'chapters',   // 'chapters' | 'bookmarks'
      flipAnim: null,       // null | { dir: 'next'|'prev', prevHtml: string }
      slideAnim: null,      // null | 'next' | 'prev'

      // TTS state
      ttsPlaying: false,
      ttsRate: 1.0,

      // Modals
      modal: null,          // null | { type: 'edit'|'share'|'paste'|'delete'|'import_preview', data: ... }
      searchQuery: '',
      isParsing: false
    };

    // Initialize books
    if (SHARED_BOOK) {
      state.books = [SHARED_BOOK];
      const savedProg = state.progress[SHARED_BOOK.id];
      state.chapterIdx = savedProg ? Math.min(savedProg.chapterIdx || 0, SHARED_BOOK.chapters.length - 1) : 0;
      state.pageIdx = savedProg ? (savedProg.pageIdx || 0) : 0;
    } else {
      const savedBooks = safeStorageGet(STORAGE_KEY_BOOKS, null);
      if (Array.isArray(savedBooks) && savedBooks.length > 0) {
        state.books = savedBooks;
      } else {
        state.books = [SAMPLE_BOOK];
      }
    }

    function persistBooks() {
      if (!state.isSharedMode) {
        safeStorageSet(STORAGE_KEY_BOOKS, state.books);
      }
    }

    function persistPrefs() {
      safeStorageSet(STORAGE_KEY_PREFS, state.prefs);
    }

    function persistProgress() {
      if (!state.activeBookId) return;
      if (!state.progress[state.activeBookId]) {
        state.progress[state.activeBookId] = { chapterIdx: 0, pageIdx: 0, bookmarks: [] };
      }
      state.progress[state.activeBookId].chapterIdx = state.chapterIdx;
      state.progress[state.activeBookId].pageIdx = state.pageIdx;
      state.progress[state.activeBookId].updatedAt = Date.now();
      safeStorageSet(STORAGE_KEY_PROGRESS, state.progress);
    }

    // 3. UTILITIES & TOASTS

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function countWords(book) {
      if (!book || !book.chapters) return 0;
      let total = 0;
      for (const ch of book.chapters) {
        for (const p of (ch.paragraphs || [])) {
          total += p.replace(/\s+/g, '').length;
        }
      }
      return total;
    }

    function formatWordCount(n) {
      if (n >= 10000) return (n / 10000).toFixed(1) + ' 万字';
      return n.toLocaleString() + ' 字';
    }

    function getCoverTheme(id) {
      return COVER_THEMES.find(c => c.id === id) || COVER_THEMES[0];
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const el = document.createElement('div');
      const colors = {
        info: 'bg-stone-800 text-stone-50 border-stone-700',
        success: 'bg-emerald-800 text-emerald-50 border-emerald-700',
        error: 'bg-rose-800 text-rose-50 border-rose-700'
      };
      el.className = `pointer-events-auto px-4 py-2.5 rounded-full text-sm font-medium shadow-lg border flex items-center gap-2 transition-all duration-300 opacity-0 -translate-y-2 ${colors[type] || colors.info}`;
      el.textContent = message;
      container.appendChild(el);
      requestAnimationFrame(() => {
        el.classList.remove('opacity-0', '-translate-y-2');
      });
      setTimeout(() => {
        el.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => el.remove(), 300);
      }, 2800);
    }

    function getActiveBook() {
      return state.books.find(b => b.id === state.activeBookId) || null;
    }

    // =========================================================================
    // 4. ZERO-DEPENDENCY PURE JS .DOCX & .TXT PARSER
    // =========================================================================
    async function inflateRawBytes(compressedUint8) {
      if (typeof DecompressionStream !== 'undefined') {
        const ds = new DecompressionStream('deflate-raw');
        const writer = ds.writable.getWriter();
        writer.write(compressedUint8);
        writer.close();
        const response = new Response(ds.readable);
        const buf = await response.arrayBuffer();
        return new Uint8Array(buf);
      }
      throw new Error('当前浏览器版本过旧，不支持内置解压 .docx，请升级浏览器或转为 .txt 导入。');
    }

    async function extractFileFromZip(arrayBuffer, targetPath) {
      const bytes = new Uint8Array(arrayBuffer);
      const view = new DataView(arrayBuffer);

      // Find End of Central Directory (EOCD) signature: 0x06054b50
      let eocdOffset = -1;
      const minOffset = Math.max(0, bytes.length - 65557);
      for (let i = bytes.length - 22; i >= minOffset; i--) {
        if (
          bytes[i] === 0x50 &&
          bytes[i + 1] === 0x4b &&
          bytes[i + 2] === 0x05 &&
          bytes[i + 3] === 0x06
        ) {
          eocdOffset = i;
          break;
        }
      }
      if (eocdOffset === -1) {
        throw new Error('无法识别该 Word 文件格式（请确保为 .docx 格式，而非旧版 .doc 格式）。');
      }

      const totalEntries = view.getUint16(eocdOffset + 10, true);
      let cdOffset = view.getUint32(eocdOffset + 16, true);
      const decoder = new TextDecoder('utf-8');

      for (let idx = 0; idx < totalEntries; idx++) {
        if (cdOffset + 46 > bytes.length) break;
        const sig = view.getUint32(cdOffset, true);
        if (sig !== 0x02014b50) break;

        const method = view.getUint16(cdOffset + 10, true);
        const compressedSize = view.getUint32(cdOffset + 20, true);
        const nameLen = view.getUint16(cdOffset + 28, true);
        const extraLen = view.getUint16(cdOffset + 30, true);
        const commentLen = view.getUint16(cdOffset + 32, true);
        const localHeaderOffset = view.getUint32(cdOffset + 42, true);

        const nameBytes = bytes.subarray(cdOffset + 46, cdOffset + 46 + nameLen);
        const fileName = decoder.decode(nameBytes);

        if (fileName.toLowerCase() === targetPath.toLowerCase()) {
          const localNameLen = view.getUint16(localHeaderOffset + 26, true);
          const localExtraLen = view.getUint16(localHeaderOffset + 28, true);
          const dataStart = localHeaderOffset + 30 + localNameLen + localExtraLen;
          const compressedData = bytes.subarray(dataStart, dataStart + compressedSize);

          if (method === 0) {
            return decoder.decode(compressedData);
          } else if (method === 8) {
            const raw = await inflateRawBytes(compressedData);
            return decoder.decode(raw);
          } else {
            throw new Error(`不支持的压缩方式 (${method})`);
          }
        }

        cdOffset += 46 + nameLen + extraLen + commentLen;
      }

      throw new Error('未在 Word 文档中找到正文内容 (word/document.xml)。');
    }

    const CHAPTER_TITLE_REGEX = /^\s*(第[零〇一二三四五六七八九十百千万两\d]+[章回节卷集部篇](?:[\s：:·、—\-].{0,40})?|序章(?:[\s：:].{0,30})?|楔子(?:[\s：:].{0,30})?|引子(?:[\s：:].{0,30})?|尾声(?:[\s：:].{0,30})?|终章(?:[\s：:].{0,30})?|番外(?:[\s：:一二三四五六七八九十\d].{0,30})?|Chapter\s+\d+(?:[\s:\-].{0,45})?|Prologue.*|Epilogue.*)$/i;

    function isHeadingStyle(styleVal) {
      if (!styleVal) return false;
      const v = styleVal.toLowerCase();
      return (
        v === 'heading1' || v === 'heading2' || v === 'heading3' ||
        v === '1' || v === '2' || v === 'title' ||
        v.includes('heading') || v.includes('标题')
      );
    }

    async function parseDocxFile(file) {
      const buf = await file.arrayBuffer();
      const xmlStr = await extractFileFromZip(buf, 'word/document.xml');
      const parser = new DOMParser();
      const doc = parser.parseFromString(xmlStr, 'application/xml');
      const pNodes = doc.getElementsByTagNameNS('*', 'p');

      const blocks = [];
      for (let i = 0; i < pNodes.length; i++) {
        const p = pNodes[i];
        let styleVal = '';
        const pStyleNodes = p.getElementsByTagNameNS('*', 'pStyle');
        if (pStyleNodes.length > 0) {
          styleVal = pStyleNodes[0].getAttribute('w:val') || pStyleNodes[0].getAttribute('val') || '';
        }

        // Extract text including line breaks inside paragraphs
        let text = '';
        const walker = doc.createTreeWalker(p, NodeFilter.SHOW_ELEMENT);
        let cur = walker.nextNode();
        while (cur) {
          const local = cur.localName;
          if (local === 't') {
            text += cur.textContent || '';
          } else if (local === 'tab') {
            text += '  ';
          } else if (local === 'br') {
            text += '\n';
          }
          cur = walker.nextNode();
        }

        const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
        for (const line of lines) {
          const heading = (isHeadingStyle(styleVal) && line.length <= 45) || (CHAPTER_TITLE_REGEX.test(line) && line.length <= 50);
          blocks.push({ text: line, isHeading: heading });
        }
      }

      return blocksToChapters(blocks, stripExt(file.name));
    }

    async function parseTxtFile(file) {
      const buf = await file.arrayBuffer();
      let text = '';
      try {
        text = new TextDecoder('utf-8', { fatal: true }).decode(buf);
      } catch (e) {
        try {
          text = new TextDecoder('gb18030').decode(buf);
        } catch (e2) {
          text = new TextDecoder('utf-8').decode(buf);
        }
      }
      return parsePlainTextToChapters(text, stripExt(file.name));
    }

    function parsePlainTextToChapters(text, fallbackTitle) {
      const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n').map(l => l.trim()).filter(Boolean);
      const blocks = lines.map(line => ({
        text: line,
        isHeading: CHAPTER_TITLE_REGEX.test(line) && line.length <= 50
      }));
      return blocksToChapters(blocks, fallbackTitle);
    }

    function blocksToChapters(blocks, fallbackTitle) {
      if (!blocks.length) {
        return [{ id: 'ch-' + Date.now() + '-0', title: fallbackTitle || '正文', paragraphs: ['（该文档内容为空）'] }];
      }

      const chapters = [];
      let currentChapter = null;

      for (let i = 0; i < blocks.length; i++) {
        const b = blocks[i];
        if (b.isHeading) {
          if (currentChapter && currentChapter.paragraphs.length > 0) {
            chapters.push(currentChapter);
          } else if (currentChapter && currentChapter.paragraphs.length === 0) {
            // Merge consecutive heading (e.g. Book Title followed immediately by Chapter 1)
            if (chapters.length === 0 && i < 3) {
              // Ignore book title line if Chapter 1 immediately follows
            } else {
              chapters.push(currentChapter);
            }
          }
          currentChapter = {
            id: 'ch-' + Date.now() + '-' + chapters.length + '-' + i,
            title: b.text,
            paragraphs: []
          };
        } else {
          if (!currentChapter) {
            currentChapter = {
              id: 'ch-' + Date.now() + '-0',
              title: fallbackTitle || '序章 / 正文',
              paragraphs: []
            };
          }
          currentChapter.paragraphs.push(b.text);
        }
      }

      if (currentChapter && (currentChapter.paragraphs.length > 0 || chapters.length === 0)) {
        chapters.push(currentChapter);
      }

      return chapters;
    }

    function stripExt(name) {
      return (name || '未命名小说').replace(/\.(docx|txt|md)$/i, '').trim();
    }

    async function handleFileUpload(fileList) {
      const files = Array.from(fileList || []).filter(f => /\.(docx|txt|md)$/i.test(f.name));
      if (!files.length) {
        showToast('请上传 .docx（Word）或 .txt 格式的小说文档', 'error');
        return;
      }

      // Natural sort so 第1章, 第2章, 第10章 stay in order
      files.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN', { numeric: true }));

      state.isParsing = true;
      render();

      try {
        let allChapters = [];
        for (const file of files) {
          const chs = file.name.toLowerCase().endsWith('.docx')
            ? await parseDocxFile(file)
            : await parseTxtFile(file);
          allChapters = allChapters.concat(chs);
        }

        const guessedTitle = files.length === 1
          ? stripExt(files[0].name)
          : stripExt(files[0].name).replace(/[\s\-_]*第?[零〇一二三四五六七八九十百千万\d]+[章回节].*$/, '') || '我的原创小说';

        const newBook = {
          id: 'book-' + Date.now(),
          title: guessedTitle || '未命名小说',
          author: '原创作者',
          synopsis: `由 ${files.length} 个文档导入，共识别出 ${allChapters.length} 个章节。`,
          coverTheme: COVER_THEMES[state.books.length % COVER_THEMES.length].id,
          customCover: '',
          createdAt: Date.now(),
          chapters: allChapters
        };

        state.isParsing = false;
        state.modal = { type: 'import_preview', book: newBook };
        render();
      } catch (err) {
        state.isParsing = false;
        render();
        showToast(err.message || '解析文档失败，请确认文件为标准 .docx 格式', 'error');
      }
    }

    // =========================================================================
    // 5. PAGINATION ENGINE (Exact Viewport Fit, Binary-Search Paragraph Split)
    // =========================================================================
    function computeSpreadLayout() {
      const w = window.innerWidth;
      if (state.prefs.turnMode === 'scroll') return false;
      if (state.prefs.spreadMode === 'single') return false;
      if (state.prefs.spreadMode === 'double') return w >= 780;
      return w >= 980; // auto
    }

    function getFontClass() {
      if (state.prefs.fontFamily === 'kai') return 'font-kai-sc';
      if (state.prefs.fontFamily === 'sans') return 'font-sans-sc';
      return 'font-serif-sc';
    }

    function paginateCurrentChapter(preserveRatio = null) {
      const book = getActiveBook();
      if (!book) return;
      const chapter = book.chapters[state.chapterIdx];
      if (!chapter) return;

      state.isDoubleSpread = computeSpreadLayout();

      if (state.prefs.turnMode === 'scroll') {
        state.pages = [renderFullChapterHtml(chapter)];
        state.pageIdx = 0;
        return;
      }

      const measurer = document.getElementById('page-measurer');
      const stageEl = document.getElementById('book-page-slot');
      if (!measurer) return;

      // Calculate exact single-page interior dimensions
      let pageW, pageH;
      if (stageEl) {
        const rect = stageEl.getBoundingClientRect();
        pageW = rect.width;
        pageH = rect.height;
      } else {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        pageW = state.isDoubleSpread ? Math.min(440, (vw - 140) / 2) : Math.min(640, vw - 48);
        pageH = Math.max(360, vh - 170);
      }

      pageW = Math.max(220, Math.floor(pageW));
      pageH = Math.max(240, Math.floor(pageH));

      measurer.className = `novel-content ${getFontClass()}`;
      measurer.style.width = pageW + 'px';
      measurer.style.fontSize = state.prefs.fontSize + 'px';
      measurer.style.lineHeight = String(state.prefs.lineHeight);
      measurer.innerHTML = '';

      const pages = [];
      let currentPageHtml = '';

      const headingHtml = `
        <div class="chapter-heading-block">
          <div style="font-size: 0.72em; opacity: 0.6; letter-spacing: 0.08em; margin-bottom: 0.35em;">第 ${state.chapterIdx + 1} 章 / 共 ${book.chapters.length} 章</div>
          <h2 style="font-size: 1.38em; font-weight: 700; line-height: 1.35; margin: 0;">${escapeHtml(chapter.title)}</h2>
        </div>
      `;

      measurer.innerHTML = headingHtml;
      currentPageHtml = headingHtml;

      const paragraphs = chapter.paragraphs && chapter.paragraphs.length ? chapter.paragraphs : ['（本章暂无内容）'];

      for (let i = 0; i < paragraphs.length; i++) {
        let remaining = paragraphs[i];
        let isContinuation = false;

        while (remaining.length > 0) {
          const pClass = isContinuation ? ' class="no-indent"' : '';
          const candidateHtml = currentPageHtml + `<p${pClass}>${escapeHtml(remaining)}</p>`;
          measurer.innerHTML = candidateHtml;

          if (measurer.scrollHeight <= pageH) {
            currentPageHtml = candidateHtml;
            remaining = '';
          } else {
            // Binary search for max prefix of `remaining` that fits on current page
            let lo = 0;
            let hi = remaining.length;
            let best = 0;

            while (lo <= hi) {
              const mid = (lo + hi) >> 1;
              if (mid === 0) {
                lo = 1;
                continue;
              }
              const testHtml = currentPageHtml + `<p${pClass}>${escapeHtml(remaining.slice(0, mid))}</p>`;
              measurer.innerHTML = testHtml;
              if (measurer.scrollHeight <= pageH) {
                best = mid;
                lo = mid + 1;
              } else {
                hi = mid - 1;
              }
            }

            if (best > 0) {
              // Avoid stranding a single punctuation mark at start of next page
              let splitAt = best;
              if (splitAt < remaining.length && /[，。！？；：、”’）》」】]/.test(remaining[splitAt])) {
                if (splitAt > 4) splitAt -= 1;
              }
              currentPageHtml += `<p${pClass}>${escapeHtml(remaining.slice(0, splitAt))}</p>`;
              pages.push(currentPageHtml);
              currentPageHtml = '';
              measurer.innerHTML = '';
              remaining = remaining.slice(splitAt);
              isContinuation = true;
            } else {
              // Current page is full, push it and retry paragraph on fresh page
              if (currentPageHtml.trim()) {
                pages.push(currentPageHtml);
                currentPageHtml = '';
                measurer.innerHTML = '';
              } else {
                // Edge case: even 1 char didn't fit (extremely tiny container)
                const chunk = remaining.slice(0, Math.min(20, remaining.length));
                pages.push(`<p${pClass}>${escapeHtml(chunk)}</p>`);
                remaining = remaining.slice(chunk.length);
                isContinuation = true;
              }
            }
          }
        }
      }

      if (currentPageHtml.trim()) {
        pages.push(currentPageHtml);
      }
      if (!pages.length) {
        pages.push(headingHtml);
      }

      state.pages = pages;

      if (preserveRatio !== null) {
        state.pageIdx = Math.min(pages.length - 1, Math.max(0, Math.round(preserveRatio * (pages.length - 1))));
      } else {
        state.pageIdx = Math.min(pages.length - 1, Math.max(0, state.pageIdx));
      }

      if (state.isDoubleSpread && state.pageIdx % 2 === 1) {
        state.pageIdx = Math.max(0, state.pageIdx - 1);
      }
    }

    function renderFullChapterHtml(chapter) {
      const book = getActiveBook();
      const head = `
        <div class="chapter-heading-block">
          <div style="font-size: 0.78em; opacity: 0.6; letter-spacing: 0.08em; margin-bottom: 0.35em;">第 ${state.chapterIdx + 1} 章 / 共 ${book ? book.chapters.length : 1} 章</div>
          <h2 style="font-size: 1.5em; font-weight: 700; line-height: 1.35; margin: 0;">${escapeHtml(chapter.title)}</h2>
        </div>
      `;
      const body = (chapter.paragraphs || []).map(p => `<p>${escapeHtml(p)}</p>`).join('');
      return head + body;
    }

    // =========================================================================
    // 6. READER NAVIGATION, BOOKMARKS & TTS
    // =========================================================================
    function openBook(bookId) {
      const book = state.books.find(b => b.id === bookId);
      if (!book) return;
      stopTTS();
      state.activeBookId = bookId;
      const prog = state.progress[bookId] || { chapterIdx: 0, pageIdx: 0, bookmarks: [] };
      state.chapterIdx = Math.min(Math.max(0, prog.chapterIdx || 0), book.chapters.length - 1);
      state.pageIdx = Math.max(0, prog.pageIdx || 0);
      state.view = 'reader';
      state.hudVisible = true;
      state.activePanel = null;
      state.flipAnim = null;
      state.slideAnim = null;
      render();
      requestAnimationFrame(() => {
        paginateCurrentChapter();
        render();
      });
    }

    function goToBookshelf() {
      stopTTS();
      persistProgress();
      state.view = 'shelf';
      state.activePanel = null;
      render();
    }

    function triggerPageTurn(dir) {
      const book = getActiveBook();
      if (!book || state.prefs.turnMode === 'scroll') return;

      const step = state.isDoubleSpread ? 2 : 1;
      const currentRightHtml = state.isDoubleSpread
        ? (state.pages[state.pageIdx + 1] || '')
        : (state.pages[state.pageIdx] || '');

      if (dir === 'next') {
        if (state.pageIdx + step < state.pages.length) {
          state.pageIdx += step;
          applyTurnAnimation('next', currentRightHtml);
          persistProgress();
          render();
        } else if (state.chapterIdx + 1 < book.chapters.length) {
          state.chapterIdx += 1;
          state.pageIdx = 0;
          paginateCurrentChapter();
          applyTurnAnimation('next', currentRightHtml);
          persistProgress();
          render();
          showToast(`已进入：${book.chapters[state.chapterIdx].title}`);
        } else {
          showToast('已经是全书最后一页了');
        }
      } else {
        if (state.pageIdx - step >= 0) {
          state.pageIdx -= step;
          const targetHtml = state.isDoubleSpread
            ? (state.pages[state.pageIdx + 1] || state.pages[state.pageIdx] || '')
            : (state.pages[state.pageIdx] || '');
          applyTurnAnimation('prev', targetHtml);
          persistProgress();
          render();
        } else if (state.chapterIdx > 0) {
          state.chapterIdx -= 1;
          paginateCurrentChapter();
          state.pageIdx = state.isDoubleSpread
            ? Math.max(0, state.pages.length - (state.pages.length % 2 === 0 ? 2 : 1))
            : Math.max(0, state.pages.length - 1);
          const targetHtml = state.pages[state.pageIdx] || '';
          applyTurnAnimation('prev', targetHtml);
          persistProgress();
          render();
          showToast(`返回上一章：${book.chapters[state.chapterIdx].title}`);
        } else {
          showToast('已经是第一页了');
        }
      }
    }

    let animTimer = null;
    function applyTurnAnimation(dir, overlayHtml) {
      if (animTimer) clearTimeout(animTimer);
      if (state.prefs.turnMode === 'flip') {
        state.flipAnim = { dir, html: overlayHtml };
        state.slideAnim = null;
        animTimer = setTimeout(() => {
          state.flipAnim = null;
          const el = document.getElementById('flip-overlay');
          if (el) el.remove();
        }, 440);
      } else if (state.prefs.turnMode === 'slide') {
        state.slideAnim = dir;
        state.flipAnim = null;
        animTimer = setTimeout(() => {
          state.slideAnim = null;
        }, 280);
      }
    }

    function jumpToChapter(idx, pageIdx = 0) {
      const book = getActiveBook();
      if (!book || idx < 0 || idx >= book.chapters.length) return;
      stopTTS();
      state.chapterIdx = idx;
      state.pageIdx = pageIdx;
      state.activePanel = null;
      paginateCurrentChapter();
      persistProgress();
      render();
      if (state.prefs.turnMode === 'scroll') {
        const scroller = document.getElementById('scroll-reader-container');
        if (scroller) scroller.scrollTop = 0;
      }
    }

    function toggleBookmark() {
      const book = getActiveBook();
      if (!book) return;
      if (!state.progress[book.id]) {
        state.progress[book.id] = { chapterIdx: state.chapterIdx, pageIdx: state.pageIdx, bookmarks: [] };
      }
      const list = state.progress[book.id].bookmarks || [];
      const existingIdx = list.findIndex(b => b.chapterIdx === state.chapterIdx && b.pageIdx === state.pageIdx);
      if (existingIdx >= 0) {
        list.splice(existingIdx, 1);
        showToast('已移除当前页书签');
      } else {
        const ch = book.chapters[state.chapterIdx];
        const tmp = document.createElement('div');
        tmp.innerHTML = state.pages[state.pageIdx] || '';
        const snippet = (tmp.textContent || ch.title).replace(/\s+/g, ' ').trim().slice(0, 48);
        list.unshift({
          id: 'bm-' + Date.now(),
          chapterIdx: state.chapterIdx,
          pageIdx: state.pageIdx,
          chapterTitle: ch.title,
          snippet,
          createdAt: Date.now()
        });
        showToast('已添加书签', 'success');
      }
      state.progress[book.id].bookmarks = list;
      persistProgress();
      render();
    }

    function isCurrentPageBookmarked() {
      if (!state.activeBookId) return false;
      const list = (state.progress[state.activeBookId] && state.progress[state.activeBookId].bookmarks) || [];
      return list.some(b => b.chapterIdx === state.chapterIdx && b.pageIdx === state.pageIdx);
    }

    // TTS Read Aloud
    function toggleTTS() {
      if (!('speechSynthesis' in window)) {
        showToast('当前浏览器不支持语音朗读功能', 'error');
        return;
      }
      if (state.ttsPlaying) {
        stopTTS();
        render();
        return;
      }
      const book = getActiveBook();
      if (!book) return;
      const ch = book.chapters[state.chapterIdx];
      if (!ch) return;

      const textToRead = ch.title + '。' + (ch.paragraphs || []).join('。');
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(textToRead);
      utter.lang = 'zh-CN';
      utter.rate = state.ttsRate;
      utter.onend = () => {
        state.ttsPlaying = false;
        render();
      };
      utter.onerror = () => {
        state.ttsPlaying = false;
        render();
      };
      state.ttsPlaying = true;
      window.speechSynthesis.speak(utter);
      showToast(`开始朗读：${ch.title}`);
      render();
    }

    function stopTTS() {
      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
      }
      state.ttsPlaying = false;
    }

    // =========================================================================
    // 7. EXPORT STANDALONE SHAREABLE HTML FOR FRIENDS
    // =========================================================================
    function exportShareableHtml(book) {
      if (!book) return;
      const cloned = document.documentElement.cloneNode(true);

      // Clear runtime UI inside cloned DOM so friend opens cleanly
      const root = cloned.querySelector('#app-root');
      if (root) root.innerHTML = '';
      const measurer = cloned.querySelector('#page-measurer');
      if (measurer) measurer.innerHTML = '';
      const toast = cloned.querySelector('#toast-container');
      if (toast) toast.innerHTML = '';

      // Remove any previous payload
      const oldPayload = cloned.querySelector('#shared-book-payload');
      if (oldPayload) oldPayload.remove();

      // Update title
      const titleEl = cloned.querySelector('title');
      if (titleEl) titleEl.textContent = `${book.title} · 墨卷在线阅读`;

      // Inject book payload safely
      const payloadScript = document.createElement('script');
      payloadScript.id = 'shared-book-payload';
      payloadScript.type = 'application/json';
      payloadScript.textContent = JSON.stringify(book).replace(/<\/script>/gi, '<\\/script>');
      const head = cloned.querySelector('head');
      if (head) head.appendChild(payloadScript);

      const finalHtml = '<!DOCTYPE html>\n' + cloned.outerHTML;
      const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${book.title.replace(/[\\/:*?"<>|]/g, '_')}_好友阅读版.html`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      showToast('已导出独立阅读网页，发给朋友双击即可翻书看！', 'success');
    }

    function exportBookJson(book) {
      if (!book) return;
      const blob = new Blob([JSON.stringify(book, null, 2)], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${book.title.replace(/[\\/:*?"<>|]/g, '_')}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      showToast('已导出小说备份数据 (.json)', 'success');
    }

    // =========================================================================

    // =========================================================================
    function render() {
      const root = document.getElementById('app-root');
      if (!root) return;

      if (state.view === 'shelf') {
        document.body.style.backgroundColor = '#f4f1ea';
        root.innerHTML = renderShelfView() + renderModal();
      } else {
        root.innerHTML = renderReaderView() + renderModal();
      }

      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
      bindEvents();
    }

                    class="pl-9 pr-3 py-1.5 w-48 lg:w-60 text-sm bg-white/80 border border-stone-200 rounded-full focus:outline-none focus:ring-2 focus:ring-amber-700/25 focus:border-amber-700 transition" />
