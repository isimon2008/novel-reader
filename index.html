    function renderBookCard(book) {
      const theme = getCoverTheme(book.coverTheme);
      const prog = state.progress[book.id];
      const totalCh = book.chapters.length;
      const curCh = prog ? Math.min(prog.chapterIdx + 1, totalCh) : 0;
      const pct = curCh > 0 ? Math.round((curCh / totalCh) * 100) : 0;
      const words = formatWordCount(countWords(book));

      const coverStyle = book.customCover
        ? `background-image: linear-gradient(to top, rgba(0,0,0,0.72), rgba(0,0,0,0.18)), url('${escapeHtml(book.customCover)}'); background-size: cover; background-position: center;`
        : `background: ${theme.bg};`;

      return `
        <div class="book-card-wrap bg-white rounded-2xl border border-stone-200/90 p-4 shadow-xs hover:shadow-md transition flex gap-4">
          <!-- 3D Book Cover -->
          <button data-action="open-book" data-id="${escapeHtml(book.id)}" class="book-cover-card shrink-0 w-28 h-40 p-3 flex flex-col justify-between text-left cursor-pointer focus:outline-none" style="${coverStyle}">
            <div class="border-l-2 pl-2" style="border-color: ${book.customCover ? 'rgba(255,255,255,0.45)' : theme.border};">
              <div class="text-xs font-bold leading-snug line-clamp-3 font-serif-sc" style="color: ${book.customCover ? '#fff' : theme.text};">
                ${escapeHtml(book.title)}
              </div>
            </div>
            <div class="text-[10px] truncate" style="color: ${book.customCover ? 'rgba(255,255,255,0.82)' : theme.sub};">
              ${escapeHtml(book.author || '原创作者')}
            </div>
          </button>

          <!-- Book Info & Actions -->
          <div class="flex-1 min-w-0 flex flex-col justify-between">
            <div>
              <div class="flex items-start justify-between gap-2">
                <button data-action="open-book" data-id="${escapeHtml(book.id)}" class="text-base font-bold text-stone-900 hover:text-amber-800 transition text-left line-clamp-1 font-serif-sc cursor-pointer">
                  ${escapeHtml(book.title)}
                </button>
              </div>
              <div class="mt-1 flex flex-wrap items-center gap-x-2.5 gap-y-0.5 text-xs text-stone-500">
                <span>${escapeHtml(book.author || '原创作者')}</span>
                <span>·</span>
                <span>${totalCh} 章</span>
                <span>·</span>
                <span>${words}</span>
              </div>
              <p class="mt-2 text-xs text-stone-600 line-clamp-2 leading-relaxed">
                ${escapeHtml(book.synopsis || '暂无简介')}
              </p>
            </div>

            <div class="pt-3 mt-2 border-t border-stone-100">
              ${curCh > 0 ? `
                <div class="flex items-center justify-between text-[11px] text-stone-500 mb-2">
                  <span>已读至第 ${curCh} 章</span>
                  <span>${pct}%</span>
                </div>
              ` : ''}
              <div class="flex items-center gap-1.5">
                <button data-action="open-book" data-id="${escapeHtml(book.id)}" class="flex-1 py-1.5 px-3 rounded-lg bg-stone-900 hover:bg-amber-900 text-white text-xs font-medium transition cursor-pointer">
                  ${curCh > 0 ? '继续阅读' : '开始翻书'}
                </button>
                <button data-action="share-book" data-id="${escapeHtml(book.id)}" title="导出独立网页发给朋友" class="p-1.5 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-200/70 transition cursor-pointer">
                  <i data-lucide="share-2" class="w-4 h-4"></i>
                </button>
                <button data-action="edit-book" data-id="${escapeHtml(book.id)}" title="编辑书名/封面/章节" class="p-1.5 rounded-lg bg-stone-100 hover:bg-stone-200 text-stone-700 transition cursor-pointer">
                  <i data-lucide="pencil" class="w-4 h-4"></i>
                </button>
                <button data-action="delete-book" data-id="${escapeHtml(book.id)}" title="移除书籍" class="p-1.5 rounded-lg bg-stone-100 hover:bg-rose-100 text-stone-500 hover:text-rose-700 transition cursor-pointer">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // READER VIEW
    // =========================================================================
    function renderReaderView() {
      const book = getActiveBook();
      if (!book) {
        state.view = 'shelf';
        return renderShelfView();
      }
      const chapter = book.chapters[state.chapterIdx] || book.chapters[0];
      const themeClass = `theme-${state.prefs.theme}`;
      const fontClass = getFontClass();
      const totalPages = Math.max(1, state.pages.length);
      const bookmarked = isCurrentPageBookmarked();

      const pageLeftHtml = state.pages[state.pageIdx] || '';
      const pageRightHtml = state.isDoubleSpread ? (state.pages[state.pageIdx + 1] || '') : '';

      const pageLabel = state.prefs.turnMode === 'scroll'
        ? `第 ${state.chapterIdx + 1} / ${book.chapters.length} 章`
        : state.isDoubleSpread
          ? `第 ${state.pageIdx + 1}${pageRightHtml ? `-${state.pageIdx + 2}` : ''} / ${totalPages} 页`
          : `第 ${state.pageIdx + 1} / ${totalPages} 页`;

      const overallPct = Math.round(
        ((state.chapterIdx + (state.pageIdx + 1) / totalPages) / Math.max(1, book.chapters.length)) * 100
      );

      return `
        <div id="reader-shell" class="reader-viewport ${themeClass} fixed inset-0 flex flex-col overflow-hidden select-none">
          <!-- Top HUD Bar -->
          <header class="z-30 shrink-0 transition-all duration-250 ${state.hudVisible ? 'translate-y-0 opacity-100' : '-translate-y-full opacity-0 pointer-events-none'}"
            style="background-color: var(--reader-page); border-bottom: 1px solid var(--reader-border);">
            <div class="max-w-5xl mx-auto px-3 sm:px-5 h-13 py-2 flex items-center justify-between gap-2">
              <div class="flex items-center gap-2 min-w-0">
                ${!state.isSharedMode ? `
                  <button id="btn-back-shelf" class="p-2 rounded-lg hover:bg-black/5 transition cursor-pointer shrink-0" title="返回书架">
                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                  </button>
                ` : `
                  <div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" style="background-color: var(--reader-border);">
                    <i data-lucide="book-open" class="w-4 h-4"></i>
                  </div>
                `}
                <div class="min-w-0">
                  <div class="text-sm font-bold truncate font-serif-sc">${escapeHtml(book.title)}</div>
                  <div class="text-[11px] truncate" style="color: var(--reader-muted);">${escapeHtml(chapter.title)}</div>
                </div>
              </div>

              <div class="flex items-center gap-1 sm:gap-1.5 shrink-0">
                <button id="btn-toggle-tts" class="px-2.5 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1 hover:bg-black/5 transition cursor-pointer ${state.ttsPlaying ? 'ring-1' : ''}"
                  style="${state.ttsPlaying ? 'color: var(--reader-accent); border-color: var(--reader-accent);' : ''}" title="语音听书">
                  <i data-lucide="${state.ttsPlaying ? 'volume-2' : 'headphones'}" class="w-4 h-4"></i>
                  <span class="hidden sm:inline">${state.ttsPlaying ? '朗读中' : '听书'}</span>
                </button>
                <button id="btn-toggle-bookmark" class="p-2 rounded-lg hover:bg-black/5 transition cursor-pointer" title="${bookmarked ? '移除书签' : '添加书签'}">
                  <i data-lucide="bookmark" class="w-4 h-4 ${bookmarked ? 'fill-current' : ''}" style="${bookmarked ? 'color: var(--reader-accent);' : ''}"></i>
                </button>
                ${!state.isSharedMode ? `
                  <button id="btn-reader-share" class="px-3 py-1.5 rounded-full text-xs font-medium text-white transition cursor-pointer flex items-center gap-1"
                    style="background-color: var(--reader-accent);" title="导出独立阅读网页给朋友">
                    <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
                    <span class="hidden sm:inline">发给朋友</span>
                  </button>
                ` : ''}
              </div>
            </div>
          </header>

          <!-- Main Book Reading Area -->
          <main class="flex-1 relative min-h-0 flex items-center justify-center px-2 sm:px-6 py-3 sm:py-5 overflow-hidden">
            ${state.prefs.turnMode === 'scroll' ? `
              <!-- Vertical Scroll Mode -->
              <div id="scroll-reader-container" class="w-full max-w-2xl h-full overflow-y-auto rounded-xl book-sheet px-6 sm:px-12 py-8 sm:py-10 select-text">
                <div class="novel-content ${fontClass}" style="font-size: ${state.prefs.fontSize}px; line-height: ${state.prefs.lineHeight};">
                  ${renderFullChapterHtml(chapter)}
                </div>
                <div class="mt-10 pt-6 flex items-center justify-between gap-3" style="border-top: 1px solid var(--reader-border);">
                  <button id="btn-scroll-prev" class="px-4 py-2 rounded-lg text-sm font-medium border transition cursor-pointer ${state.chapterIdx === 0 ? 'opacity-40 pointer-events-none' : 'hover:bg-black/5'}" style="border-color: var(--reader-border);">
                    ← 上一章
                  </button>
                  <span class="text-xs" style="color: var(--reader-muted);">${state.chapterIdx + 1} / ${book.chapters.length}</span>
                  <button id="btn-scroll-next" class="px-4 py-2 rounded-lg text-sm font-medium text-white transition cursor-pointer ${state.chapterIdx >= book.chapters.length - 1 ? 'opacity-40 pointer-events-none' : ''}" style="background-color: var(--reader-accent);">
                    下一章 →
                  </button>
                </div>
              </div>
            ` : `
              <!-- Paginated Book Flip / Slide Mode -->
              <div id="book-touch-stage" class="book-stage w-full h-full flex items-center justify-center relative">
                <!-- Left Turn Arrow (Desktop) -->
                <button id="btn-turn-prev" aria-label="上一页"
                  class="hidden md:flex items-center justify-center w-10 h-16 rounded-full hover:bg-black/5 transition cursor-pointer mr-2 shrink-0"
                  style="color: var(--reader-muted);">
                  <i data-lucide="chevron-left" class="w-6 h-6"></i>
                </button>

                <!-- Book Sheet Container -->
                <div class="book-sheet relative w-full h-full rounded-xl overflow-hidden flex flex-col ${state.isDoubleSpread ? 'max-w-5xl' : 'max-w-2xl'} ${state.slideAnim === 'next' ? 'anim-slide-next' : state.slideAnim === 'prev' ? 'anim-slide-prev' : ''}">
                  <!-- Page Header Meta -->
                  <div class="shrink-0 px-6 sm:px-9 pt-3.5 pb-1.5 flex items-center justify-between text-[11px]" style="color: var(--reader-muted);">
                    <span class="truncate max-w-[60%]">${escapeHtml(chapter.title)}</span>
                    <span>${escapeHtml(book.title)}</span>
                  </div>

                  <!-- Book Pages Area -->
                  <div class="flex-1 min-h-0 relative flex">
                    <!-- Left (or Single) Page -->
                    <div class="flex-1 min-w-0 px-6 sm:px-9 py-2 overflow-hidden flex flex-col">
                      <div id="book-page-slot" class="flex-1 min-h-0 overflow-hidden novel-content ${fontClass} select-text"
                        style="font-size: ${state.prefs.fontSize}px; line-height: ${state.prefs.lineHeight};">
                        ${pageLeftHtml}
                      </div>
                    </div>

                    ${state.isDoubleSpread ? `
                      <!-- Center Book Spine Shadow -->
                      <div class="w-6 shrink-0 book-spine-gutter pointer-events-none"></div>
                      <!-- Right Page -->
                      <div class="flex-1 min-w-0 px-6 sm:px-9 py-2 overflow-hidden flex flex-col">
                        <div class="flex-1 min-h-0 overflow-hidden novel-content ${fontClass} select-text"
                          style="font-size: ${state.prefs.fontSize}px; line-height: ${state.prefs.lineHeight};">
                          ${pageRightHtml || `<div class="h-full flex flex-col items-center justify-center opacity-40 text-xs gap-2"><i data-lucide="feather" class="w-5 h-5"></i><span>本章终 · 翻页进入下一章</span></div>`}
                        </div>
                      </div>
                    ` : ''}

                    <!-- 3D Flip Animation Overlay -->
                    ${state.flipAnim ? `
                      <div id="flip-overlay" class="pointer-events-none absolute top-0 bottom-0 ${state.isDoubleSpread ? 'left-1/2 right-0' : 'inset-x-0'} px-6 sm:px-9 py-2 overflow-hidden ${state.flipAnim.dir === 'next' ? 'anim-flip-next' : 'anim-flip-prev'}"
                        style="background-color: var(--reader-page); border-left: 1px solid var(--reader-border);">
                        <div class="novel-content ${fontClass}" style="font-size: ${state.prefs.fontSize}px; line-height: ${state.prefs.lineHeight};">
                          ${state.flipAnim.html}
                        </div>
                      </div>
                    ` : ''}

                    <!-- Invisible Tap Zones for App-like Page Turning -->
                    <div id="tap-zone-prev" class="absolute left-0 top-0 bottom-0 w-[26%] cursor-pointer z-10" title="点击翻上一页"></div>
                    <div id="tap-zone-center" class="absolute left-[26%] right-[26%] top-0 bottom-0 cursor-pointer z-10" title="点击显示/隐藏菜单"></div>
                    <div id="tap-zone-next" class="absolute right-0 top-0 bottom-0 w-[26%] cursor-pointer z-10" title="点击翻下一页"></div>
                  </div>

                  <!-- Page Footer Meta -->
                  <div class="shrink-0 px-6 sm:px-9 pt-1.5 pb-3.5 flex items-center justify-between text-[11px]" style="color: var(--reader-muted);">
                    <span>${pageLabel}</span>
                    <span>全书进度 ${overallPct}%</span>
                  </div>
                </div>

                <!-- Right Turn Arrow (Desktop) -->
                <button id="btn-turn-next" aria-label="下一页"
                  class="hidden md:flex items-center justify-center w-10 h-16 rounded-full hover:bg-black/5 transition cursor-pointer ml-2 shrink-0"
                  style="color: var(--reader-muted);">
                  <i data-lucide="chevron-right" class="w-6 h-6"></i>
                </button>
              </div>
            `}
          </main>

          <!-- Bottom HUD Bar -->
          <footer class="z-30 shrink-0 transition-all duration-250 ${state.hudVisible ? 'translate-y-0 opacity-100' : 'translate-y-full opacity-0 pointer-events-none'}"
            style="background-color: var(--reader-page); border-top: 1px solid var(--reader-border);">
            <div class="max-w-3xl mx-auto px-4 pt-2.5 pb-3 space-y-2.5">
              <!-- Chapter Progress Row -->
              <div class="flex items-center gap-3 text-xs">
                <button id="btn-prev-chapter" class="shrink-0 px-2 py-1 rounded hover:bg-black/5 transition cursor-pointer ${state.chapterIdx === 0 ? 'opacity-35 pointer-events-none' : ''}">上一章</button>
                <input id="chapter-range-slider" type="range" min="0" max="${Math.max(0, book.chapters.length - 1)}" value="${state.chapterIdx}" class="flex-1 h-1.5 rounded-lg cursor-pointer" />
                <button id="btn-next-chapter" class="shrink-0 px-2 py-1 rounded hover:bg-black/5 transition cursor-pointer ${state.chapterIdx >= book.chapters.length - 1 ? 'opacity-35 pointer-events-none' : ''}">下一章</button>
              </div>

              <!-- Tool Buttons Row -->
              <div class="grid grid-cols-4 gap-1 text-xs">
                <button id="btn-panel-toc" class="py-1.5 rounded-lg flex flex-col items-center gap-1 hover:bg-black/5 transition cursor-pointer ${state.activePanel === 'toc' ? 'font-semibold' : ''}"
                  style="${state.activePanel === 'toc' ? 'color: var(--reader-accent);' : ''}">
                  <i data-lucide="list" class="w-4 h-4"></i>
                  <span>目录</span>
                </button>
                <button id="btn-panel-settings" class="py-1.5 rounded-lg flex flex-col items-center gap-1 hover:bg-black/5 transition cursor-pointer ${state.activePanel === 'settings' ? 'font-semibold' : ''}"
                  style="${state.activePanel === 'settings' ? 'color: var(--reader-accent);' : ''}">
                  <i data-lucide="type" class="w-4 h-4"></i>
                  <span>排版</span>
                </button>
                <button id="btn-quick-night" class="py-1.5 rounded-lg flex flex-col items-center gap-1 hover:bg-black/5 transition cursor-pointer">
                  <i data-lucide="${state.prefs.theme === 'night' ? 'sun' : 'moon'}" class="w-4 h-4"></i>
                  <span>${state.prefs.theme === 'night' ? '日间' : '夜间'}</span>
                </button>
                <button id="btn-quick-mode" class="py-1.5 rounded-lg flex flex-col items-center gap-1 hover:bg-black/5 transition cursor-pointer">
                  <i data-lucide="${state.prefs.turnMode === 'scroll' ? 'scroll-text' : 'book-open'}" class="w-4 h-4"></i>
                  <span>${state.prefs.turnMode === 'flip' ? '仿真翻页' : state.prefs.turnMode === 'slide' ? '左右滑动' : '上下滚动'}</span>
                </button>
              </div>
            </div>
          </footer>

          <!-- TOC & Bookmarks Slide-over Drawer -->
          ${state.activePanel === 'toc' ? renderTocDrawer(book) : ''}

          <!-- Typography & Theme Settings Sheet -->
          ${state.activePanel === 'settings' ? renderSettingsSheet() : ''}
        </div>
      `;
    }

    function renderTocDrawer(book) {
      const bookmarks = (state.progress[book.id] && state.progress[book.id].bookmarks) || [];
      return `
        <div id="panel-backdrop" class="fixed inset-0 z-40 bg-black/35 backdrop-blur-[1px] flex">
          <div class="w-80 max-w-[85vw] h-full flex flex-col shadow-2xl" style="background-color: var(--reader-page); color: var(--reader-text); border-right: 1px solid var(--reader-border);" onclick="event.stopPropagation()">
            <div class="p-4 flex items-center justify-between" style="border-bottom: 1px solid var(--reader-border);">
              <div>
                <h3 class="font-bold text-base font-serif-sc line-clamp-1">${escapeHtml(book.title)}</h3>
                <p class="text-xs mt-0.5" style="color: var(--reader-muted);">共 ${book.chapters.length} 章 · ${formatWordCount(countWords(book))}</p>
              </div>
              <button id="btn-close-panel" class="p-1.5 rounded-lg hover:bg-black/5 cursor-pointer">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>

            <div class="flex text-xs font-medium" style="border-bottom: 1px solid var(--reader-border);">
              <button data-toc-tab="chapters" class="flex-1 py-2.5 text-center cursor-pointer transition ${state.tocTab === 'chapters' ? 'border-b-2 font-bold' : 'opacity-60'}"
                style="${state.tocTab === 'chapters' ? 'border-color: var(--reader-accent); color: var(--reader-accent);' : ''}">
                目录 (${book.chapters.length})
              </button>
              <button data-toc-tab="bookmarks" class="flex-1 py-2.5 text-center cursor-pointer transition ${state.tocTab === 'bookmarks' ? 'border-b-2 font-bold' : 'opacity-60'}"
                style="${state.tocTab === 'bookmarks' ? 'border-color: var(--reader-accent); color: var(--reader-accent);' : ''}">
                书签 (${bookmarks.length})
              </button>
            </div>

            <div class="flex-1 overflow-y-auto p-2 space-y-0.5">
              ${state.tocTab === 'chapters' ? book.chapters.map((ch, i) => `
                <button data-jump-chapter="${i}" class="w-full text-left px-3 py-2.5 rounded-lg text-sm transition flex items-center justify-between gap-2 cursor-pointer ${i === state.chapterIdx ? 'font-bold bg-black/5' : 'hover:bg-black/5'}"
                  style="${i === state.chapterIdx ? 'color: var(--reader-accent);' : ''}">
                  <span class="truncate">${escapeHtml(ch.title)}</span>
                  ${i === state.chapterIdx ? '<span class="text-[10px] shrink-0 px-1.5 py-0.5 rounded bg-black/10">当前</span>' : ''}
                </button>
              `).join('') : (
                bookmarks.length === 0 ? `
                  <div class="py-12 text-center text-xs" style="color: var(--reader-muted);">
                    还没有添加书签，点击右上角书签图标即可收藏当前页。
                  </div>
                ` : bookmarks.map(bm => `
                  <div class="p-3 rounded-lg hover:bg-black/5 transition flex items-start justify-between gap-2">
                    <button data-jump-bookmark-ch="${bm.chapterIdx}" data-jump-bookmark-pg="${bm.pageIdx}" class="text-left flex-1 min-w-0 cursor-pointer">
                      <div class="text-xs font-bold truncate" style="color: var(--reader-accent);">${escapeHtml(bm.chapterTitle)} · 第 ${bm.pageIdx + 1} 页</div>
                      <div class="text-xs mt-1 line-clamp-2 opacity-80">${escapeHtml(bm.snippet)}...</div>
                    </button>
                    <button data-remove-bookmark="${escapeHtml(bm.id)}" class="p-1 opacity-50 hover:opacity-100 cursor-pointer" title="删除书签">
                      <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                `).join('')
              )}
            </div>
          </div>
        </div>
      `;
    }

    function renderSettingsSheet() {
      return `
        <div id="panel-backdrop" class="fixed inset-0 z-40 bg-black/25 flex items-end justify-center">
          <div class="w-full max-w-2xl rounded-t-2xl p-5 shadow-2xl space-y-5" style="background-color: var(--reader-page); color: var(--reader-text); border-top: 1px solid var(--reader-border);" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between">
              <span class="text-sm font-bold">阅读排版设置</span>
              <button id="btn-close-panel" class="p-1 rounded-lg hover:bg-black/5 cursor-pointer">
                <i data-lucide="x" class="w-4 h-4"></i>
              </button>
            </div>

            <!-- Font Size -->
            <div class="flex items-center justify-between gap-4">
              <span class="text-xs shrink-0 w-12" style="color: var(--reader-muted);">字号</span>
              <div class="flex-1 flex items-center gap-2">
                <button id="btn-font-dec" class="px-3.5 py-1.5 rounded-lg border text-xs font-semibold hover:bg-black/5 cursor-pointer" style="border-color: var(--reader-border);">A-</button>
                <div class="flex-1 text-center text-xs font-medium">${state.prefs.fontSize} px</div>
                <button id="btn-font-inc" class="px-3.5 py-1.5 rounded-lg border text-xs font-semibold hover:bg-black/5 cursor-pointer" style="border-color: var(--reader-border);">A+</button>
              </div>
            </div>

            <!-- Background Theme -->
            <div class="flex items-center justify-between gap-4">
              <span class="text-xs shrink-0 w-12" style="color: var(--reader-muted);">背景</span>
              <div class="flex-1 grid grid-cols-5 gap-2">
                ${READER_THEMES.map(t => `
                  <button data-set-theme="${t.id}" class="py-1.5 rounded-lg text-xs font-medium border transition cursor-pointer ${state.prefs.theme === t.id ? 'ring-2 ring-offset-1' : ''}"
                    style="background-color: ${t.swatch}; color: ${t.text}; border-color: ${t.ring}; ${state.prefs.theme === t.id ? '--tw-ring-color: var(--reader-accent);' : ''}">
                    ${t.name}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Font Family -->
            <div class="flex items-center justify-between gap-4">
              <span class="text-xs shrink-0 w-12" style="color: var(--reader-muted);">字体</span>
              <div class="flex-1 grid grid-cols-3 gap-2">
                ${[
                  { id: 'serif', label: '雅致宋体', cls: 'font-serif-sc' },
                  { id: 'kai', label: '古韵楷体', cls: 'font-kai-sc' },
                  { id: 'sans', label: '现代黑体', cls: 'font-sans-sc' }
                ].map(f => `
                  <button data-set-font="${f.id}" class="py-1.5 rounded-lg text-xs border transition cursor-pointer ${f.cls} ${state.prefs.fontFamily === f.id ? 'font-bold' : ''}"
                    style="border-color: ${state.prefs.fontFamily === f.id ? 'var(--reader-accent)' : 'var(--reader-border)'}; color: ${state.prefs.fontFamily === f.id ? 'var(--reader-accent)' : 'inherit'};">
                    ${f.label}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Line Height -->
            <div class="flex items-center justify-between gap-4">
              <span class="text-xs shrink-0 w-12" style="color: var(--reader-muted);">行距</span>
              <div class="flex-1 grid grid-cols-3 gap-2">
                ${[
                  { val: 1.6, label: '紧凑' },
                  { val: 1.85, label: '适中' },
                  { val: 2.15, label: '宽松' }
                ].map(lh => `
                  <button data-set-lh="${lh.val}" class="py-1.5 rounded-lg text-xs border transition cursor-pointer ${state.prefs.lineHeight === lh.val ? 'font-bold' : ''}"
                    style="border-color: ${state.prefs.lineHeight === lh.val ? 'var(--reader-accent)' : 'var(--reader-border)'}; color: ${state.prefs.lineHeight === lh.val ? 'var(--reader-accent)' : 'inherit'};">
                    ${lh.label}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Page Turn Mode & Spread -->
            <div class="flex items-center justify-between gap-4">
              <span class="text-xs shrink-0 w-12" style="color: var(--reader-muted);">翻页</span>
              <div class="flex-1 grid grid-cols-3 gap-2">
                ${[
                  { id: 'flip', label: '仿真翻页' },
                  { id: 'slide', label: '左右滑动' },
                  { id: 'scroll', label: '上下滚动' }
                ].map(m => `
                  <button data-set-turn="${m.id}" class="py-1.5 rounded-lg text-xs border transition cursor-pointer ${state.prefs.turnMode === m.id ? 'font-bold' : ''}"
                    style="border-color: ${state.prefs.turnMode === m.id ? 'var(--reader-accent)' : 'var(--reader-border)'}; color: ${state.prefs.turnMode === m.id ? 'var(--reader-accent)' : 'inherit'};">
                    ${m.label}
                  </button>
                `).join('')}
              </div>
            </div>

            ${state.prefs.turnMode !== 'scroll' ? `
              <div class="flex items-center justify-between gap-4">
                <span class="text-xs shrink-0 w-12" style="color: var(--reader-muted);">版式</span>
                <div class="flex-1 grid grid-cols-3 gap-2">
                  ${[
                    { id: 'auto', label: '自动双页' },
                    { id: 'single', label: '单页模式' },
                    { id: 'double', label: '双页对开' }
                  ].map(sp => `
                    <button data-set-spread="${sp.id}" class="py-1.5 rounded-lg text-xs border transition cursor-pointer ${state.prefs.spreadMode === sp.id ? 'font-bold' : ''}"
                      style="border-color: ${state.prefs.spreadMode === sp.id ? 'var(--reader-accent)' : 'var(--reader-border)'}; color: ${state.prefs.spreadMode === sp.id ? 'var(--reader-accent)' : 'inherit'};">
                      ${sp.label}
                    </button>
                  `).join('')}
                </div>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 9. EVENT BINDINGS
    // =========================================================================
    function bindEvents() {
      // Shelf view events
      const searchInput = document.getElementById('shelf-search');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          state.searchQuery = e.target.value;
          const pos = e.target.selectionStart;
          render();
          const newInput = document.getElementById('shelf-search');
          if (newInput) {
            newInput.focus();
            newInput.setSelectionRange(pos, pos);
          }
        });
      }

      const headerFileInput = document.getElementById('header-file-input');
      if (headerFileInput) {
        headerFileInput.addEventListener('change', (e) => {
          handleFileUpload(e.target.files);
          e.target.value = '';
        });
      }

      const dropzoneFileInput = document.getElementById('dropzone-file-input');
      if (dropzoneFileInput) {
        dropzoneFileInput.addEventListener('change', (e) => {
          handleFileUpload(e.target.files);
          e.target.value = '';
        });
      }

      const dropzone = document.getElementById('word-dropzone');
      if (dropzone) {
        ['dragenter', 'dragover'].forEach(evt => {
          dropzone.addEventListener(evt, (e) => {
            e.preventDefault();
            dropzone.classList.add('dropzone-active');
          });
        });
        ['dragleave', 'drop'].forEach(evt => {
          dropzone.addEventListener(evt, (e) => {
            e.preventDefault();
            dropzone.classList.remove('dropzone-active');
          });
        });
        dropzone.addEventListener('drop', (e) => {
          if (e.dataTransfer && e.dataTransfer.files) {
            handleFileUpload(e.dataTransfer.files);
          }
        });
      }

      const btnHeroDemo = document.getElementById('btn-hero-demo');
      if (btnHeroDemo) {
        btnHeroDemo.addEventListener('click', () => {
          if (state.books.length > 0) openBook(state.books[0].id);
        });
      }

      const btnOpenPaste = document.getElementById('btn-open-paste');
      if (btnOpenPaste) {
        btnOpenPaste.addEventListener('click', () => {
          state.modal = { type: 'paste' };
          render();
        });
      }

      // Book card action buttons
      document.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', () => {
          const action = btn.getAttribute('data-action');
          const id = btn.getAttribute('data-id');
          const book = state.books.find(b => b.id === id);
          if (!book) return;
          if (action === 'open-book') openBook(id);
          else if (action === 'share-book') { state.modal = { type: 'share', book }; render(); }
          else if (action === 'edit-book') { state.modal = { type: 'edit', book: JSON.parse(JSON.stringify(book)) }; render(); }
          else if (action === 'delete-book') { state.modal = { type: 'delete', book }; render(); }
        });
      });

      // Reader view events
      const btnBackShelf = document.getElementById('btn-back-shelf');
      if (btnBackShelf) btnBackShelf.addEventListener('click', goToBookshelf);

      const btnToggleTts = document.getElementById('btn-toggle-tts');
      if (btnToggleTts) btnToggleTts.addEventListener('click', toggleTTS);

      const btnToggleBookmark = document.getElementById('btn-toggle-bookmark');
      if (btnToggleBookmark) btnToggleBookmark.addEventListener('click', toggleBookmark);

      const btnReaderShare = document.getElementById('btn-reader-share');
      if (btnReaderShare) {
        btnReaderShare.addEventListener('click', () => {
          const book = getActiveBook();
          if (book) { state.modal = { type: 'share', book }; render(); }
        });
      }

      const btnTurnPrev = document.getElementById('btn-turn-prev');
      if (btnTurnPrev) btnTurnPrev.addEventListener('click', () => triggerPageTurn('prev'));

      const btnTurnNext = document.getElementById('btn-turn-next');
      if (btnTurnNext) btnTurnNext.addEventListener('click', () => triggerPageTurn('next'));

      const tapPrev = document.getElementById('tap-zone-prev');
      if (tapPrev) tapPrev.addEventListener('click', () => triggerPageTurn('prev'));

      const tapNext = document.getElementById('tap-zone-next');
      if (tapNext) tapNext.addEventListener('click', () => triggerPageTurn('next'));

      const tapCenter = document.getElementById('tap-zone-center');
      if (tapCenter) {
        tapCenter.addEventListener('click', () => {
          state.hudVisible = !state.hudVisible;
          state.activePanel = null;
          render();
        });
      }

      // Touch swipe support for flipping pages
      const touchStage = document.getElementById('book-touch-stage');
      if (touchStage) {
        let startX = 0;
        let startY = 0;
        touchStage.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
          }
        }, { passive: true });
        touchStage.addEventListener('touchend', (e) => {
          if (e.changedTouches.length === 1) {
            const dx = e.changedTouches[0].clientX - startX;
            const dy = e.changedTouches[0].clientY - startY;
            if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.4) {
              triggerPageTurn(dx < 0 ? 'next' : 'prev');
            }
          }
        }, { passive: true });
      }

      const btnScrollPrev = document.getElementById('btn-scroll-prev');
      if (btnScrollPrev) btnScrollPrev.addEventListener('click', () => jumpToChapter(state.chapterIdx - 1));

      const btnScrollNext = document.getElementById('btn-scroll-next');
      if (btnScrollNext) btnScrollNext.addEventListener('click', () => jumpToChapter(state.chapterIdx + 1));

      const btnPrevCh = document.getElementById('btn-prev-chapter');
      if (btnPrevCh) btnPrevCh.addEventListener('click', () => jumpToChapter(state.chapterIdx - 1));

      const btnNextCh = document.getElementById('btn-next-chapter');
      if (btnNextCh) btnNextCh.addEventListener('click', () => jumpToChapter(state.chapterIdx + 1));

      const chSlider = document.getElementById('chapter-range-slider');
      if (chSlider) {
        chSlider.addEventListener('change', (e) => {
          jumpToChapter(parseInt(e.target.value, 10));
        });
      }

      const btnPanelToc = document.getElementById('btn-panel-toc');
      if (btnPanelToc) {
        btnPanelToc.addEventListener('click', () => {
          state.activePanel = state.activePanel === 'toc' ? null : 'toc';
          render();
        });
      }

      const btnPanelSettings = document.getElementById('btn-panel-settings');
      if (btnPanelSettings) {
        btnPanelSettings.addEventListener('click', () => {
          state.activePanel = state.activePanel === 'settings' ? null : 'settings';
          render();
        });
      }

      const btnQuickNight = document.getElementById('btn-quick-night');
      if (btnQuickNight) {
        btnQuickNight.addEventListener('click', () => {
          state.prefs.theme = state.prefs.theme === 'night' ? 'paper' : 'night';
          persistPrefs();
          render();
        });
      }

      const btnQuickMode = document.getElementById('btn-quick-mode');
      if (btnQuickMode) {
        btnQuickMode.addEventListener('click', () => {
          const order = ['flip', 'slide', 'scroll'];
          const nextIdx = (order.indexOf(state.prefs.turnMode) + 1) % order.length;
          const ratio = state.pages.length > 1 ? state.pageIdx / (state.pages.length - 1) : 0;
          state.prefs.turnMode = order[nextIdx];
          persistPrefs();
          render();
          requestAnimationFrame(() => {
            paginateCurrentChapter(ratio);
            render();
          });
        });
      }

      // Panel backdrop / close
      const panelBackdrop = document.getElementById('panel-backdrop');
      if (panelBackdrop) {
        panelBackdrop.addEventListener('click', () => {
          state.activePanel = null;
          render();
        });
      }
      const btnClosePanel = document.getElementById('btn-close-panel');
      if (btnClosePanel) {
        btnClosePanel.addEventListener('click', () => {
          state.activePanel = null;
          render();
        });
      }

      // TOC tabs & jumps
      document.querySelectorAll('[data-toc-tab]').forEach(el => {
        el.addEventListener('click', () => {
          state.tocTab = el.getAttribute('data-toc-tab');
          render();
        });
      });
      document.querySelectorAll('[data-jump-chapter]').forEach(el => {
        el.addEventListener('click', () => {
          jumpToChapter(parseInt(el.getAttribute('data-jump-chapter'), 10), 0);
        });
      });
      document.querySelectorAll('[data-jump-bookmark-ch]').forEach(el => {
        el.addEventListener('click', () => {
          const ch = parseInt(el.getAttribute('data-jump-bookmark-ch'), 10);
          const pg = parseInt(el.getAttribute('data-jump-bookmark-pg'), 10);
          jumpToChapter(ch, pg);
        });
      });
      document.querySelectorAll('[data-remove-bookmark]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          const bmId = el.getAttribute('data-remove-bookmark');
          const prog = state.progress[state.activeBookId];
          if (prog && prog.bookmarks) {
            prog.bookmarks = prog.bookmarks.filter(b => b.id !== bmId);
            persistProgress();
            render();
          }
        });
      });

      // Settings Sheet controls
      const repaginateWithRatio = () => {
        const ratio = state.pages.length > 1 ? state.pageIdx / (state.pages.length - 1) : 0;
        persistPrefs();
        render();
        requestAnimationFrame(() => {
          paginateCurrentChapter(ratio);
          render();
        });
      };

      const btnFontDec = document.getElementById('btn-font-dec');
      if (btnFontDec) btnFontDec.addEventListener('click', () => {
        if (state.prefs.fontSize > 14) { state.prefs.fontSize -= 1; repaginateWithRatio(); }
      });

      const btnFontInc = document.getElementById('btn-font-inc');
      if (btnFontInc) btnFontInc.addEventListener('click', () => {
        if (state.prefs.fontSize < 28) { state.prefs.fontSize += 1; repaginateWithRatio(); }
      });

      document.querySelectorAll('[data-set-theme]').forEach(el => {
        el.addEventListener('click', () => {
          state.prefs.theme = el.getAttribute('data-set-theme');
          persistPrefs();
          render();
        });
      });

      document.querySelectorAll('[data-set-font]').forEach(el => {
        el.addEventListener('click', () => {
          state.prefs.fontFamily = el.getAttribute('data-set-font');
          repaginateWithRatio();
        });
      });

      document.querySelectorAll('[data-set-lh]').forEach(el => {
        el.addEventListener('click', () => {
          state.prefs.lineHeight = parseFloat(el.getAttribute('data-set-lh'));
          repaginateWithRatio();
        });
      });

      document.querySelectorAll('[data-set-turn]').forEach(el => {
        el.addEventListener('click', () => {
          state.prefs.turnMode = el.getAttribute('data-set-turn');
          repaginateWithRatio();
        });
      });

      document.querySelectorAll('[data-set-spread]').forEach(el => {
        el.addEventListener('click', () => {
          state.prefs.spreadMode = el.getAttribute('data-set-spread');
          repaginateWithRatio();
        });
      });

      // Modal events
      const closeModal = () => { state.modal = null; render(); };
      const modalBackdrop = document.getElementById('modal-backdrop');
      if (modalBackdrop) modalBackdrop.addEventListener('click', closeModal);
      const btnCloseModal = document.getElementById('btn-close-modal');
      if (btnCloseModal) btnCloseModal.addEventListener('click', closeModal);
      const btnCloseModalCancel = document.getElementById('btn-close-modal-cancel');
      if (btnCloseModalCancel) btnCloseModalCancel.addEventListener('click', closeModal);

      document.querySelectorAll('[data-pick-cover]').forEach(el => {
        el.addEventListener('click', () => {
          if (state.modal && state.modal.book) {
            state.modal.book.coverTheme = el.getAttribute('data-pick-cover');
            // Preserve current typed inputs before re-render
            const t = document.getElementById('modal-book-title');
            const a = document.getElementById('modal-book-author');
            const s = document.getElementById('modal-book-synopsis');
            if (t) state.modal.book.title = t.value;
            if (a) state.modal.book.author = a.value;
            if (s) state.modal.book.synopsis = s.value;
            render();
          }
        });
      });

      const btnSaveBookModal = document.getElementById('btn-save-book-modal');
      if (btnSaveBookModal && state.modal && state.modal.book) {
        btnSaveBookModal.addEventListener('click', () => {
          const title = (document.getElementById('modal-book-title').value || '').trim() || '未命名小说';
          const author = (document.getElementById('modal-book-author').value || '').trim() || '原创作者';
          const synopsis = (document.getElementById('modal-book-synopsis').value || '').trim();
          state.modal.book.title = title;
          state.modal.book.author = author;
          state.modal.book.synopsis = synopsis;

          if (state.modal.type === 'import_preview') {
            state.books.unshift(state.modal.book);
            persistBooks();
            const newId = state.modal.book.id;
            state.modal = null;
            showToast(`《${title}》已加入书架！`, 'success');
            openBook(newId);
          } else {
            const idx = state.books.findIndex(b => b.id === state.modal.book.id);
            if (idx >= 0) state.books[idx] = state.modal.book;
            persistBooks();
            state.modal = null;
            showToast('书籍信息已更新', 'success');
            render();
          }
        });
      }

      const btnExportShareHtml = document.getElementById('btn-export-share-html');
      if (btnExportShareHtml && state.modal && state.modal.book) {
        btnExportShareHtml.addEventListener('click', () => exportShareableHtml(state.modal.book));
      }

      const btnExportJson = document.getElementById('btn-export-json');
      if (btnExportJson && state.modal && state.modal.book) {
        btnExportJson.addEventListener('click', () => exportBookJson(state.modal.book));
      }

      const btnSubmitPaste = document.getElementById('btn-submit-paste');
      if (btnSubmitPaste) {
        btnSubmitPaste.addEventListener('click', () => {
          const title = (document.getElementById('paste-title').value || '').trim() || '我的原创小说';
          const content = (document.getElementById('paste-content').value || '').trim();
          if (!content) {
            showToast('请先粘贴一些小说正文内容', 'error');
            return;
          }
          const chapters = parsePlainTextToChapters(content, '正文');
          const newBook = {
            id: 'book-' + Date.now(),
            title,
            author: '原创作者',
            synopsis: `通过粘贴文本创建，共识别出 ${chapters.length} 个章节。`,
            coverTheme: COVER_THEMES[state.books.length % COVER_THEMES.length].id,
            customCover: '',
            createdAt: Date.now(),
            chapters
          };
          state.modal = { type: 'import_preview', book: newBook };
          render();
        });
      }

      const btnConfirmDelete = document.getElementById('btn-confirm-delete');
      if (btnConfirmDelete && state.modal && state.modal.book) {
        btnConfirmDelete.addEventListener('click', () => {
          const id = state.modal.book.id;
          state.books = state.books.filter(b => b.id !== id);
          persistBooks();
          state.modal = null;
          showToast('已从书架移除');
          render();
        });
      }
    }

    // Keyboard shortcuts for flipping pages
    window.addEventListener('keydown', (e) => {
      if (state.view !== 'reader' || state.modal) return;
      if (state.prefs.turnMode === 'scroll') return;
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        triggerPageTurn('next');
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        triggerPageTurn('prev');
      } else if (e.key === 'Escape') {
        if (state.activePanel) {
          state.activePanel = null;
          render();
        }
      }
    });

    // Repaginate smoothly on resize
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      if (state.view !== 'reader') return;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const ratio = state.pages.length > 1 ? state.pageIdx / (state.pages.length - 1) : 0;
        paginateCurrentChapter(ratio);
        render();
      }, 150);
    });

    // Initial Boot
    render();
    if (state.view === 'reader') {
      requestAnimationFrame(() => {
        paginateCurrentChapter();
        render();
      });
    }
  })();
  </script>

</body></html>
